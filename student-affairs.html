<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شئون الطلاب</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── تابات ── */
    .shu2on-tabs {
      display: flex; gap: 0.4rem; margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border); padding-bottom: 0;
    }
    .shu2on-tab {
      padding: 0.55rem 1.25rem; font-family: 'Cairo', sans-serif;
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
      border: none; background: none; color: var(--text-light);
      border-bottom: 3px solid transparent; margin-bottom: -2px;
      transition: var(--transition); border-radius: 8px 8px 0 0;
    }
    .shu2on-tab:hover { color: var(--primary); background: var(--accent); }
    .shu2on-tab.active { color: var(--primary); border-bottom-color: var(--primary); background: var(--accent); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeInUp 0.3s ease; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

    /* ── بطاقة الطالب ── */
    .student-pending-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem 1.25rem;
      display: flex; align-items: center; gap: 1rem;
      transition: var(--transition); margin-bottom: 0.75rem;
    }
    .student-pending-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
    .student-avatar {
      width: 46px; height: 46px; border-radius: 50%;
      background: var(--accent); display: flex; align-items: center;
      justify-content: center; font-size: 1.2rem; font-weight: 800;
      color: var(--primary); flex-shrink: 0;
    }
    .student-info { flex: 1; min-width: 0; }
    .student-name { font-size: 0.95rem; font-weight: 800; color: var(--text-dark); }
    .student-meta { font-size: 0.78rem; color: var(--text-light); margin-top: 0.15rem; }
    .student-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.35rem; }

    .grade-badge {
      display: inline-flex; padding: 0.18rem 0.65rem; border-radius: 20px;
      font-size: 0.72rem; font-weight: 700;
      background: var(--accent); color: var(--primary);
      border: 1px solid var(--primary-light);
    }
    .gender-badge-m { background: #e3f2fd; color: #1565c0; border-color: #90caf9 !important; }
    .gender-badge-f { background: #fce4ec; color: #c62828; border-color: #f48fb1 !important; }

    /* ── فورم ── */
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
    @media (max-width: 768px) { .form-grid-2 { grid-template-columns: 1fr; } }

    /* ── إحصائيات ── */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
    @media (max-width: 768px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
    .stat-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem; text-align: center;
    }
    .stat-num { font-size: 1.8rem; font-weight: 900; color: var(--primary); }
    .stat-label { font-size: 0.75rem; color: var(--text-light); font-weight: 600; margin-top: 0.2rem; }

    /* ── فلتر ── */
    .filter-row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }

    /* ── زر التحويل ── */
    .btn-transfer {
      padding: 0.35rem 0.85rem; border-radius: 8px; font-size: 0.78rem;
      font-weight: 700; cursor: pointer; font-family: 'Cairo', sans-serif;
      background: var(--primary); color: #fff; border: none;
      transition: var(--transition); white-space: nowrap;
    }
    .btn-transfer:hover { opacity: 0.85; }

    /* ── عمر ── */
    .age-display { font-size: 0.78rem; color: var(--text-light); margin-top: 0.3rem; font-weight: 600; }

    /* ── section title ── */
    .section-title {
      font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1px; color: var(--primary);
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 0.4rem; margin-bottom: 0.85rem;
    }

    /* ── empty ── */
    .empty-msg { text-align: center; padding: 3rem 1rem; color: var(--text-light); font-size: 0.9rem; }
    .empty-msg .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>

<div class="app-layout">
  <div class="main-content">
    <div id="topbarContainer"></div>
    <div class="page-content">

      <!-- التابات -->
      <div class="shu2on-tabs">
        <button class="shu2on-tab active" id="tabRegisterBtn" onclick="switchTab('register')">تسجيل طالب جديد</button>
        <button class="shu2on-tab" onclick="switchTab('pending')">
          الطلاب المنتظرون
          <span id="pendingBadge" style="background:var(--primary);color:#fff;border-radius:20px;padding:1px 8px;font-size:0.7rem;margin-right:4px">0</span>
        </button>
      </div>

      <!-- ══ TAB 1: تسجيل طالب جديد ══ -->
      <div class="tab-pane active" id="tab-register">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">تسجيل طالب جديد</h2>
            <span class="badge badge-primary">شئون الطلاب</span>
          </div>
          <div class="card-body">
            <div class="alert hidden" id="regAlert"></div>
            <div class="alert alert-success hidden" id="regSuccess"></div>

            <!-- ══ بيانات الطالب ══ -->
            <div class="section-title">بيانات الطالب</div>
            <div class="form-grid-2" style="margin-bottom:0.85rem">
              <div class="form-group">
                <label class="form-label">اسم الطالب (عربي) <span class="required">*</span></label>
                <input type="text" class="form-input form-input-ar" id="studentName" placeholder="الاسم رباعياً بالعربي" />
              </div>
              <div class="form-group">
                <label class="form-label">اسم الطالب (إنجليزي) <span class="required">*</span></label>
                <input type="text" class="form-input" id="studentNameEn" placeholder="Full Name in English"
                  style="direction:ltr;text-align:left" />
              </div>
              <div class="form-group">
                <label class="form-label">الرقم القومي للطالب <span class="required">*</span></label>
                <input type="text" class="form-input" id="studentNid" placeholder="14 رقم"
                  style="direction:ltr;text-align:left" maxlength="14" />
              </div>
              <div class="form-group">
                <label class="form-label">النوع <span class="required">*</span></label>
                <select class="form-input" id="gender">
                  <option value="">-- اختر --</option>
                  <option value="ذكر">ذكر</option>
                  <option value="أنثى">أنثى</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">الجنسية <span class="required">*</span></label>
                <select class="form-input" id="nationality">
                  <option value="">-- اختر --</option>
                  <option value="مصرية">مصرية</option>
                  <option value="سعودية">سعودية</option>
                  <option value="إماراتية">إماراتية</option>
                  <option value="كويتية">كويتية</option>
                  <option value="أردنية">أردنية</option>
                  <option value="سورية">سورية</option>
                  <option value="لبنانية">لبنانية</option>
                  <option value="فلسطينية">فلسطينية</option>
                  <option value="يمنية">يمنية</option>
                  <option value="سودانية">سودانية</option>
                  <option value="ليبية">ليبية</option>
                  <option value="تونسية">تونسية</option>
                  <option value="جزائرية">جزائرية</option>
                  <option value="مغربية">مغربية</option>
                  <option value="عراقية">عراقية</option>
                  <option value="أخرى">أخرى</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">الديانة <span class="required">*</span></label>
                <select class="form-input" id="religion">
                  <option value="">-- اختر --</option>
                  <option value="مسلم">مسلم</option>
                  <option value="مسيحي">مسيحي</option>
                  <option value="أخرى">أخرى</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">تاريخ الميلاد <span class="required">*</span></label>
                <input type="date" class="form-input" id="birthDate" onchange="calcAge()" />
                <div class="age-display" id="ageDisplay"></div>
              </div>
              <div class="form-group">
                <label class="form-label">الصف <span class="required">*</span></label>
                <select class="form-input" id="grade">
                  <option value="">-- اختر الصف --</option>
                  <optgroup label="ما قبل المدرسة">
                    <option value="Pre-KG">Pre-KG</option>
                    <option value="KG1">KG 1</option>
                    <option value="KG2">KG 2</option>
                  </optgroup>
                  <optgroup label="الابتدائية">
                    <option value="Grade 1">Grade 1</option>
                    <option value="Grade 2">Grade 2</option>
                    <option value="Grade 3">Grade 3</option>
                    <option value="Grade 4">Grade 4</option>
                    <option value="Grade 5">Grade 5</option>
                    <option value="Grade 6">Grade 6</option>
                  </optgroup>
                  <optgroup label="الإعدادية">
                    <option value="Prep 1">Prep 1</option>
                    <option value="Prep 2">Prep 2</option>
                    <option value="Prep 3">Prep 3</option>
                  </optgroup>
                </select>
              </div>
            </div>

            <!-- ══ اللغة الثانية والفصل ══ -->
            <div class="section-title" style="margin-top:1.25rem">بيانات إضافية</div>
            <div class="form-grid-2" style="margin-bottom:0.85rem">
              <div class="form-group">
                <label class="form-label">اللغة الثانية <span style="font-size:0.75rem;color:var(--text-light);font-weight:600">(اختياري)</span></label>
                <select class="form-input" id="secondLang">
                  <option value="">-- اختر --</option>
                  <option value="فرنسي">فرنسي</option>
                  <option value="ألماني">ألماني</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">الفصل <span style="font-size:0.75rem;color:var(--text-light);font-weight:600">(اختياري)</span></label>
                <input type="text" class="form-input" id="classroom" placeholder="مثال: 3B ، أو الفصل الثالث" />
              </div>
            </div>

            <!-- ══ بيانات الأب ══ -->
            <div class="section-title" style="margin-top:1.25rem">بيانات الأب</div>
            <div class="form-grid-2" style="margin-bottom:0.85rem">
              <div class="form-group">
                <label class="form-label">اسم الأب (عربي) <span class="required">*</span></label>
                <input type="text" class="form-input form-input-ar" id="fatherName" placeholder="الاسم كاملاً بالعربي" />
              </div>
              <div class="form-group">
                <label class="form-label">اسم الأب (إنجليزي) <span class="required">*</span></label>
                <input type="text" class="form-input" id="fatherNameEn" placeholder="Full Name in English"
                  style="direction:ltr;text-align:left" />
              </div>
              <div class="form-group">
                <label class="form-label">الرقم القومي للأب <span class="required">*</span></label>
                <input type="text" class="form-input" id="fatherNid" placeholder="14 رقم"
                  style="direction:ltr;text-align:left" maxlength="14" />
              </div>
              <div class="form-group">
                <label class="form-label">تليفون الأب <span class="required">*</span></label>
                <input type="tel" class="form-input" id="fatherPhone" placeholder="01XXXXXXXXX"
                  style="direction:ltr;text-align:left" maxlength="11" />
              </div>
              <div class="form-group">
                <label class="form-label">وظيفة الأب <span class="required">*</span></label>
                <input type="text" class="form-input form-input-ar" id="fatherJob" placeholder="مثال: مهندس، طبيب، موظف حكومي..." />
              </div>
              <div class="form-group">
                <label class="form-label">العنوان <span class="required">*</span></label>
                <input type="text" class="form-input form-input-ar" id="address" placeholder="العنوان بالتفصيل" />
              </div>
            </div>

            <!-- ══ بيانات الأم ══ -->
            <div class="section-title" style="margin-top:1.25rem">بيانات الأم</div>
            <div class="form-grid-2" style="margin-bottom:0.85rem">
              <div class="form-group">
                <label class="form-label">اسم الأم (عربي) <span class="required">*</span></label>
                <input type="text" class="form-input form-input-ar" id="motherName" placeholder="الاسم كاملاً بالعربي" />
              </div>
              <div class="form-group">
                <label class="form-label">اسم الأم (إنجليزي) <span class="required">*</span></label>
                <input type="text" class="form-input" id="motherNameEn" placeholder="Full Name in English"
                  style="direction:ltr;text-align:left" />
              </div>
              <div class="form-group">
                <label class="form-label">الرقم القومي للأم <span class="required">*</span></label>
                <input type="text" class="form-input" id="motherNid" placeholder="14 رقم"
                  style="direction:ltr;text-align:left" maxlength="14" />
              </div>
              <div class="form-group">
                <label class="form-label">تليفون الأم</label>
                <input type="tel" class="form-input" id="motherPhone" placeholder="01XXXXXXXXX"
                  style="direction:ltr;text-align:left" maxlength="11" />
              </div>
              <div class="form-group">
                <label class="form-label">وظيفة الأم <span class="required">*</span></label>
                <input type="text" class="form-input form-input-ar" id="motherJob" placeholder="مثال: ربة منزل، معلمة، طبيبة..." />
              </div>
            </div>

            <!-- أزرار -->
            <div style="display:flex;justify-content:flex-end;gap:0.75rem;margin-top:1rem">
              <button class="btn btn-secondary" onclick="resetForm()">مسح</button>
              <button class="btn btn-primary" onclick="saveStudent()" id="saveBtn" style="width:auto;padding:0.75rem 2rem">
                <span id="saveBtnText">حفظ البيانات</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ TAB 2: الطلاب المنتظرون ══ -->
      <div class="tab-pane" id="tab-pending">

        <!-- إحصائيات -->
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-num" id="statTotal">0</div>
            <div class="stat-label">إجمالي المنتظرين</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" id="statMale" style="color:#1565c0">0</div>
            <div class="stat-label">ذكور</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" id="statFemale" style="color:#c62828">0</div>
            <div class="stat-label">إناث</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" id="statGrades" style="color:var(--success)">0</div>
            <div class="stat-label">صفوف مختلفة</div>
          </div>
        </div>

        <!-- فلتر -->
        <div class="filter-row">
          <input type="text" class="form-input" id="searchInput"
            placeholder="ابحث بالاسم أو اسم الأب..."
            oninput="filterStudents()" style="flex:1;max-width:300px" />
          <select class="form-input" id="filterGrade" onchange="filterStudents()" style="max-width:160px">
            <option value="">كل الصفوف</option>
            <optgroup label="ما قبل المدرسة">
              <option value="Pre-KG">Pre-KG</option>
              <option value="KG1">KG 1</option>
              <option value="KG2">KG 2</option>
            </optgroup>
            <optgroup label="الابتدائية">
              <option value="Grade 1">Grade 1</option>
              <option value="Grade 2">Grade 2</option>
              <option value="Grade 3">Grade 3</option>
              <option value="Grade 4">Grade 4</option>
              <option value="Grade 5">Grade 5</option>
              <option value="Grade 6">Grade 6</option>
            </optgroup>
            <optgroup label="الإعدادية">
              <option value="Prep 1">Prep 1</option>
              <option value="Prep 2">Prep 2</option>
              <option value="Prep 3">Prep 3</option>
            </optgroup>
          </select>
          <select class="form-input" id="filterGender" onchange="filterStudents()" style="max-width:130px">
            <option value="">كل النوع</option>
            <option value="ذكر">ذكور</option>
            <option value="أنثى">إناث</option>
          </select>
          <button class="btn btn-outline btn-sm" onclick="loadPendingStudents()" style="width:auto;padding:0.45rem 1rem">
            ↻ تحديث
          </button>
        </div>

        <!-- قائمة الطلاب -->
        <div id="pendingList">
          <div class="empty-msg">
            <div class="empty-icon">👨‍🎓</div>
            جاري التحميل...
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="layout.js"></script>

<script>
  // ══════════════════════════════════════════════
  // INIT — حماية الصفحة + sidebar حسب الدور
  // ══════════════════════════════════════════════
  (function () {
    const session = guardShu2onPage();
    if (!session) return;
    // renderLayout تبني السايد بار تلقائي حسب الدور:
    // محاسب/أدمن → كل الصفحات | shu2on → شئون الطلاب بس
    renderLayout('student-affairs', 'شئون الطلاب');
  })();

  // ══════════════════════════════════════════════
  // متغيرات عامة
  // ══════════════════════════════════════════════
  const session  = SESSION.get();
  const schoolId = session?.schoolId;
  let allStudents = [];

  // ══ إخفاء تاب التسجيل للمحاسب ══
  const _isAccountant = Object.values(SCHOOLS).some(sc => sc.users.includes(session?.email));
  if (_isAccountant && !SESSION.isAdmin()) {
    const regBtn = document.getElementById('tabRegisterBtn');
    if (regBtn) regBtn.style.display = 'none';
    document.getElementById('tab-register').classList.remove('active');
    document.getElementById('tab-pending').classList.add('active');
    document.querySelectorAll('.shu2on-tab').forEach((t,i) => t.classList.toggle('active', i===1));
    loadPendingStudents();
  }

  // ══════════════════════════════════════════════
  // TABS
  // ══════════════════════════════════════════════
  function switchTab(name) {
    document.querySelectorAll('.shu2on-tab').forEach((t, i) => {
      t.classList.toggle('active', ['register','pending'][i] === name);
    });
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    if (name === 'pending') loadPendingStudents();
  }

  // ══════════════════════════════════════════════
  // حساب السن
  // ══════════════════════════════════════════════
  // ── السن يُحسب دائماً من تاريخ الميلاد إلى 1 أكتوبر 2026 ──
  const AGE_REF_DATE = new Date(2026, 9, 1);

  function calcAge() {
    const val = document.getElementById('birthDate').value;
    const disp = document.getElementById('ageDisplay');
    if (!val) { disp.textContent = ''; return; }
    const birth = new Date(val);
    let years  = AGE_REF_DATE.getFullYear() - birth.getFullYear();
    let months = AGE_REF_DATE.getMonth()    - birth.getMonth();
    if (months < 0) { years--; months += 12; }
    disp.textContent = `العمر في 1 أكتوبر 2026: ${years} سنة ${months > 0 ? 'و ' + months + ' شهر' : ''}`;
  }

  function calcAgeFromDate(dateStr) {
    if (!dateStr) return '—';
    const birth = new Date(dateStr);
    let years  = AGE_REF_DATE.getFullYear() - birth.getFullYear();
    let months = AGE_REF_DATE.getMonth()    - birth.getMonth();
    if (months < 0) { years--; months += 12; }
    return `${years}س${months > 0 ? ' ' + months + 'ش' : ''}`;
  }

  // ══════════════════════════════════════════════
  // validation رقم الهاتف
  // ══════════════════════════════════════════════
  function isValidPhone(phone) {
    return /^01[0125]\d{8}$/.test(phone);
  }

  // ══════════════════════════════════════════════
  // حفظ الطالب
  // ══════════════════════════════════════════════
  async function saveStudent() {
    // ── بيانات الطالب ──
    const studentName    = document.getElementById('studentName').value.trim();
    const studentNameEn  = document.getElementById('studentNameEn').value.trim();
    const studentNid     = document.getElementById('studentNid').value.trim();
    const gender         = document.getElementById('gender').value;
    const nationality    = document.getElementById('nationality').value;
    const religion       = document.getElementById('religion').value;
    const birthDate      = document.getElementById('birthDate').value;
    const grade          = document.getElementById('grade').value;
    // ── بيانات إضافية ──
    const secondLang     = document.getElementById('secondLang').value;
    const classroom      = document.getElementById('classroom').value.trim();
    // ── بيانات الأب ──
    const fatherName     = document.getElementById('fatherName').value.trim();
    const fatherNameEn   = document.getElementById('fatherNameEn').value.trim();
    const fatherNid      = document.getElementById('fatherNid').value.trim();
    const fatherPhone    = document.getElementById('fatherPhone').value.trim();
    const fatherJob      = document.getElementById('fatherJob').value.trim();
    const address        = document.getElementById('address').value.trim();
    // ── بيانات الأم ──
    const motherName     = document.getElementById('motherName').value.trim();
    const motherNameEn   = document.getElementById('motherNameEn').value.trim();
    const motherNid      = document.getElementById('motherNid').value.trim();
    const motherPhone    = document.getElementById('motherPhone').value.trim();
    const motherJob      = document.getElementById('motherJob').value.trim();

    const alertEl   = document.getElementById('regAlert');
    const successEl = document.getElementById('regSuccess');

    function showErr(msg) {
      alertEl.textContent = msg;
      alertEl.className = 'alert alert-error';
      alertEl.classList.remove('hidden');
      setTimeout(() => alertEl.classList.add('hidden'), 4000);
    }

    // ─── Validation ───
    if (!studentName)              return showErr('من فضلك ادخل اسم الطالب بالعربي');
    if (!studentNameEn)            return showErr('من فضلك ادخل اسم الطالب بالإنجليزي');
    if (!studentNid || studentNid.length !== 14) return showErr('الرقم القومي للطالب يجب أن يكون 14 رقم');
    if (!gender)                   return showErr('من فضلك اختر النوع');
    if (!nationality)              return showErr('من فضلك اختر الجنسية');
    if (!religion)                 return showErr('من فضلك اختر الديانة');
    if (!birthDate)                return showErr('من فضلك ادخل تاريخ الميلاد');
    if (!grade)                    return showErr('من فضلك اختر الصف');

    if (!fatherName)               return showErr('من فضلك ادخل اسم الأب بالعربي');
    if (!fatherNameEn)             return showErr('من فضلك ادخل اسم الأب بالإنجليزي');
    if (!fatherNid || fatherNid.length !== 14) return showErr('الرقم القومي للأب يجب أن يكون 14 رقم');
    if (!fatherPhone)              return showErr('من فضلك ادخل تليفون الأب');
    if (!isValidPhone(fatherPhone))return showErr('رقم تليفون الأب غير صحيح — يجب أن يبدأ بـ 01 ويكون 11 رقم');
    if (!fatherJob)                return showErr('من فضلك ادخل وظيفة الأب');
    if (!address)                  return showErr('من فضلك ادخل العنوان');
    if (!motherName)               return showErr('من فضلك ادخل اسم الأم بالعربي');
    if (!motherNameEn)             return showErr('من فضلك ادخل اسم الأم بالإنجليزي');
    if (!motherNid || motherNid.length !== 14) return showErr('الرقم القومي للأم يجب أن يكون 14 رقم');
    if (motherPhone && !isValidPhone(motherPhone)) return showErr('رقم تليفون الأم غير صحيح');
    if (!motherJob)                return showErr('من فضلك ادخل وظيفة الأم');

    const btn = document.getElementById('saveBtn');
    const txt = document.getElementById('saveBtnText');
    btn.disabled = true; txt.textContent = 'جاري الحفظ...';

    try {
      const birth = new Date(birthDate);
      let ageYears  = AGE_REF_DATE.getFullYear() - birth.getFullYear();
      let ageMonths = AGE_REF_DATE.getMonth()    - birth.getMonth();
      if (ageMonths < 0) { ageYears--; ageMonths += 12; }

      await db.collection('studentAffairs').add({
        schoolId,
        // الطالب
        studentName,
        studentNameEn,
        studentNid,
        gender,
        nationality,
        religion,
        birthDate,
        ageYears,
        ageMonths,
        grade,
        // إضافية
        secondLang,
        classroom: classroom || '',
        // الأب
        fatherName,
        fatherNameEn,
        fatherNid,
        fatherPhone,
        fatherJob,
        address,
        // الأم
        motherName,
        motherNameEn,
        motherNid,
        motherPhone: motherPhone || '',
        motherJob,
        status: 'pending',
        registeredBy: session.email,
        registeredAt: firebase.firestore.FieldValue.serverTimestamp(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });

      successEl.textContent = `✓ تم تسجيل الطالب "${studentName}" بنجاح`;
      successEl.classList.remove('hidden');
      setTimeout(() => successEl.classList.add('hidden'), 4000);

      loadPendingCount();
      resetForm();
    } catch (err) {
      showErr('خطأ في الحفظ: ' + err.message);
      console.error(err);
    } finally {
      btn.disabled = false; txt.textContent = 'حفظ البيانات';
    }
  }

  // ══════════════════════════════════════════════
  // مسح الفورم
  // ══════════════════════════════════════════════
  function resetForm() {
    [
      'studentName','studentNameEn','studentNid',
      'fatherName','fatherNameEn','fatherNid','fatherPhone','fatherJob','address',
      'motherName','motherNameEn','motherNid','motherPhone','motherJob',
      'classroom'
    ].forEach(id => { document.getElementById(id).value = ''; });
    ['grade','gender','nationality','religion','secondLang'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('birthDate').value = '';
    document.getElementById('ageDisplay').textContent = '';
  }

  // ══════════════════════════════════════════════
  // badge عدد المنتظرين
  // ══════════════════════════════════════════════
  async function loadPendingCount() {
    try {
      const [snapPending, snapInProgress] = await Promise.all([
        db.collection('studentAffairs').where('schoolId','==',schoolId).where('status','==','pending').get(),
        db.collection('studentAffairs').where('schoolId','==',schoolId).where('status','==','in_progress').get(),
      ]);
      document.getElementById('pendingBadge').textContent = snapPending.size + snapInProgress.size;
    } catch(e) { console.warn(e); }
  }

  // ══════════════════════════════════════════════
  // تحميل الطلاب المنتظرين
  // ══════════════════════════════════════════════
  async function loadPendingStudents() {
    const container = document.getElementById('pendingList');
    container.innerHTML = '<div class="empty-msg"><div class="empty-icon">⏳</div>جاري التحميل...</div>';

    try {
      // ملاحظة: لو Firestore طلب Composite Index على schoolId+status+createdAt
      // ابعت الـ link اللي بيظهر في الـ console لـ Firebase وهيعمله تلقائي
      const [snapP, snapI] = await Promise.all([
        db.collection('studentAffairs').where('schoolId','==',schoolId).where('status','==','pending').orderBy('createdAt','desc').get(),
        db.collection('studentAffairs').where('schoolId','==',schoolId).where('status','==','in_progress').orderBy('createdAt','desc').get(),
      ]);
      allStudents = [
        ...snapP.docs.map(d => ({ id: d.id, ...d.data() })),
        ...snapI.docs.map(d => ({ id: d.id, ...d.data() })),
      ].sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
      updateStats();
      renderStudents(allStudents);
    } catch(err) {
      console.error(err);
      // لو الخطأ بسبب missing index — وضّح للمستخدم
      if (err.code === 'failed-precondition' || err.message.includes('index')) {
        container.innerHTML = `
          <div class="alert alert-error" style="margin:1rem">
            ⚠️ يحتاج Firestore إنشاء index مركّب.<br>
            افتح الـ Console (F12) وهتلاقي رابط — اضغطه وسيُنشأ تلقائياً.
          </div>`;
      } else {
        container.innerHTML = `<div class="alert alert-error" style="margin:1rem">خطأ في التحميل: ${err.message}</div>`;
      }
    }
  }

  // ══════════════════════════════════════════════
  // تحديث الإحصائيات
  // ══════════════════════════════════════════════
  function updateStats() {
    document.getElementById('statTotal').textContent  = allStudents.length;
    document.getElementById('statMale').textContent   = allStudents.filter(s => s.gender === 'ذكر').length;
    document.getElementById('statFemale').textContent = allStudents.filter(s => s.gender === 'أنثى').length;
    document.getElementById('statGrades').textContent = new Set(allStudents.map(s => s.grade)).size;
    document.getElementById('pendingBadge').textContent = allStudents.length;
  }

  // ══════════════════════════════════════════════
  // رسم البطاقات
  // ══════════════════════════════════════════════
  function renderStudents(list) {
    const container = document.getElementById('pendingList');
    if (!list.length) {
      container.innerHTML = '<div class="empty-msg"><div class="empty-icon">✅</div>لا يوجد طلاب منتظرون</div>';
      return;
    }
    // هل المستخدم الحالي محاسب أو أدمن؟ (مش شئون طلاب)
    const canCollect = SESSION.isAdmin() || !SESSION.isShu2on();
    container.innerHTML = list.map(s => `
      <div class="student-pending-card">
        <div class="student-avatar">${s.studentName?.charAt(0) || '؟'}</div>
        <div class="student-info">
          <div class="student-name">${escHtml(s.studentName)}</div>
          <div class="student-meta">
            ${escHtml(s.fatherName)} (${escHtml(s.fatherNameEn || "")}) · ${escHtml(s.fatherPhone)}
            ${s.motherPhone ? " · أم: " + escHtml(s.motherPhone) : ""}
          </div>
          <div class="student-badges">
            <span class="grade-badge">${escHtml(s.grade)}</span>
            <span class="grade-badge ${s.gender === 'ذكر' ? 'gender-badge-m' : 'gender-badge-f'}">${escHtml(s.gender)}</span>
            <span class="grade-badge" style="background:#f3e5f5;color:#6a1b9a;border-color:#ce93d8">${escHtml(s.nationality)}</span>
            <span class="grade-badge" style="background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7">
              ${calcAgeFromDate(s.birthDate)}
            </span>
          </div>
          <div style="font-size:0.72rem;color:var(--text-light);margin-top:0.25rem">
            سجّله: ${escHtml(s.registeredBy || '—')} ·
            ${s.createdAt?.toDate ? s.createdAt.toDate().toLocaleDateString('ar-EG') : ''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.5rem;align-items:flex-end">
          ${s.status === 'in_progress'
            ? `<span style="font-size:0.72rem;color:#0d6efd;background:#e7f1ff;border:1px solid #9ec5fe;border-radius:8px;padding:0.3rem 0.65rem;font-weight:700;white-space:nowrap">
                🔄 جاري التحصيل
               </span>`
            : canCollect
              ? `<button class="btn-transfer" onclick="goToCollection('${s.id}')">
                  💰 تسديد التحصيل
                 </button>`
              : `<span style="font-size:0.72rem;color:#856404;background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:0.3rem 0.65rem;font-weight:700;white-space:nowrap">
                  ⏳ في انتظار المحاسب
                 </span>`
          }
          <button onclick="deleteStudent('${s.id}','${escHtml(s.studentName).replace(/'/g,"\\'")}'"
            style="font-size:0.72rem;color:var(--danger);background:none;border:none;cursor:pointer;font-family:Cairo,sans-serif;font-weight:700">
            🗑 حذف
          </button>
        </div>
      </div>`).join('');
  }

  // ── XSS protection ──
  function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ══════════════════════════════════════════════
  // فلترة
  // ══════════════════════════════════════════════
  function filterStudents() {
    const search = document.getElementById('searchInput').value.trim().toLowerCase();
    const grade  = document.getElementById('filterGrade').value;
    const gender = document.getElementById('filterGender').value;

    let filtered = allStudents;
    if (search) filtered = filtered.filter(s =>
      (s.studentName || '').toLowerCase().includes(search) ||
      (s.fatherName  || '').toLowerCase().includes(search) ||
      (s.fatherPhone || '').includes(search)
    );
    if (grade)  filtered = filtered.filter(s => s.grade  === grade);
    if (gender) filtered = filtered.filter(s => s.gender === gender);

    renderStudents(filtered);
  }

  // ══════════════════════════════════════════════
  // التحويل لصفحة التحصيل
  // ══════════════════════════════════════════════
  function goToCollection(studentId) {
    const student = allStudents.find(s => s.id === studentId);
    if (!student) return;

    // حفظ بيانات الطالب في sessionStorage — collection.html هيقراها
    sessionStorage.setItem('shu2on_prefill', JSON.stringify({
      studentName:    student.studentName,
      studentNameEn:  student.studentNameEn || '',
      grade:          student.grade,
      classroom:      student.classroom || '',
      fatherName:     student.fatherName,
      fatherNameEn:   student.fatherNameEn || '',
      fatherPhone:    student.fatherPhone,
      studentDocId:   student.id,
    }));

    // لو Admin — روّح لـ collection مباشرة
    // لو shu2on — مفيش صلاحية لـ collection، بس بيروّح عشان المحاسب يكمّل
    window.location.href = 'collection.html';
  }

  // ══════════════════════════════════════════════
  // حذف (soft delete → status='deleted')
  // ══════════════════════════════════════════════
  async function deleteStudent(id, name) {
    if (!confirm(`هل تريد حذف بيانات "${name}"؟\n(سيتم الحذف نهائياً)`)) return;
    try {
      // soft delete: نغيّر status بدل الحذف الفعلي
      await db.collection('studentAffairs').doc(id).update({
        status: 'deleted',
        deletedBy: session.email,
        deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      allStudents = allStudents.filter(s => s.id !== id);
      updateStats();
      renderStudents(allStudents);
    } catch(err) {
      alert('خطأ في الحذف: ' + err.message);
    }
  }

  // ══════════════════════════════════════════════
  // تحميل أولي
  // ══════════════════════════════════════════════
  loadPendingCount();
</script>
</body>
</html>
