<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التقارير - نظام المحاسبة</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .export-btn-group { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .filter-section { background:var(--card-bg); border-radius:var(--radius); padding:1.25rem; border:1px solid var(--border); margin-bottom:1rem; }
    .summary-box { background: linear-gradient(135deg, var(--primary), var(--primary-dark, #0d2247)); color: white; border-radius: var(--radius); padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .summary-box .big-num { font-size: 2.5rem; font-weight: 900; }
    .summary-box .sub { font-size: 0.8rem; opacity: 0.7; }
    .table-footer-total { background: var(--accent); font-weight: 800; color: var(--primary); }
  </style>
</head>
<body>

<div class="app-layout">
  <div class="main-content">
    <div id="topbarContainer"></div>
    <div class="page-content">

      <!-- Period Tabs -->
      <div class="report-period-tabs animate-in">
        <button class="period-tab active" onclick="setPeriod('daily', this)"> يومي</button>
        <button class="period-tab" onclick="setPeriod('weekly', this)"> أسبوعي</button>
        <button class="period-tab" onclick="setPeriod('monthly', this)"> شهري</button>
        <button class="period-tab" onclick="setPeriod('custom', this)"> مخصص</button>
      </div>

      <!-- Filters -->
      <div class="filter-section animate-in">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;align-items:end">
          <div id="dailyFilter"><label class="form-label">التاريخ</label><input type="date" class="form-input" id="filterDate" onchange="loadReport()" /></div>
          <div id="weeklyFilter" style="display:none"><label class="form-label">أسبوع من</label><input type="date" class="form-input" id="filterWeekStart" onchange="loadReport()" /></div>
          <div id="monthlyFilter" style="display:none"><label class="form-label">الشهر</label><input type="month" class="form-input" id="filterMonth" onchange="loadReport()" /></div>
          <div id="customFilter" style="display:none;grid-template-columns:1fr 1fr;gap:0.5rem;grid-column:span 2"><div><label class="form-label">من</label><input type="date" class="form-input" id="filterFrom" onchange="loadReport()" /></div><div><label class="form-label">إلى</label><input type="date" class="form-input" id="filterTo" onchange="loadReport()" /></div></div>
          <div><label class="form-label">المرحلة</label><select class="form-select" id="filterStage" onchange="loadReport()"><option value="">كل المراحل</option><option value="pre_kg">Pre-KG</option><option value="kg">KG</option><option value="grade">Grade</option><option value="prep">Prep</option></select></div>
          <div><label class="form-label">بند الدفع</label><select class="form-select" id="filterItem" onchange="loadReport()"><option value="">كل البنود</option><option value="مصروفات دراسية">مصروفات دراسية</option><option value="باص">باص</option><option value="يونيفورم">يونيفورم</option><option value="فايل">فايل</option><option value="أبليكيشن">أبليكيشن</option><option value="رحلات">رحلات</option><option value="امتحانات">امتحانات</option></select></div>
          <div><label class="form-label">طريقة الدفع</label><select class="form-select" id="filterPaymentType" onchange="loadReport()"><option value="">كل الطرق</option><option value="cash">نقدي</option><option value="bank_transfer">تحويل بنكي</option><option value="check">شيك</option><option value="instapay">إنستاباي</option></select></div>
          <div><button class="btn btn-primary w-full" onclick="loadReport()"> بحث</button></div>
        </div>
      </div>

      <!-- Summary Box -->
      <div class="summary-box animate-in" id="summaryBox">
        <div><div class="sub">إجمالي التحصيل</div><div class="big-num" id="summaryTotal">ج.م 0</div><div class="sub" id="summaryPeriod">التقرير اليومي</div></div>
        <div><div style="font-size:2rem;font-weight:900" id="summaryCount">0</div><div class="sub">عملية</div></div>
        <div><div style="font-size:2rem;font-weight:900" id="summaryStudents">0</div><div class="sub">طالب</div></div>
        <div class="export-btn-group no-print"><button class="btn btn-secondary btn-sm" id="exportExcelBtn" style="background:rgba(255,255,255,0.2);color:white;border:1px solid rgba(255,255,255,0.3)"> Excel</button><button class="btn btn-secondary btn-sm" onclick="exportPDF()" style="background:rgba(255,255,255,0.2);color:white;border:1px solid rgba(255,255,255,0.3)"> PDF</button><button class="btn btn-secondary btn-sm" onclick="window.print()" style="background:rgba(255,255,255,0.2);color:white;border:1px solid rgba(255,255,255,0.3)"> طباعة</button></div>
      </div>

      <!-- Results Table -->
      <div class="card animate-in">
        <div class="card-header"><span class="card-title"> نتائج التقرير</span><span class="badge badge-primary" id="resultsCount">0 سجل</span></div>
        <div class="table-wrapper">
          <table class="data-table" id="reportTable">
            <thead><tr><th>#</th><th>التاريخ</th><th class="col-daily">اسم الطالب</th><th>المرحلة</th><th>الصف</th><th>بند الدفع</th><th>المبلغ المدفوع</th><th class="col-daily">المديونية</th><th>طريقة الدفع</th><th>رقم الإيصال</th><th>ملاحظات</th></tr></thead>
            <tbody id="reportTableBody"><tr><td colspan="10"><div class="empty-state"><div class="empty-state-icon"></div><div class="empty-state-title">اختر الفلتر وانقر بحث</div></div></td></tr></tbody>
            <tfoot id="reportTableFoot"></tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
  renderLayout('reports', 'التقارير والشيتات');
  const session = SESSION.get();
  const schoolId = session.schoolId;
  let currentPeriod = 'daily';
  let currentData = [];

  function init() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('filterDate').value = today;
    const weekStart = new Date(); weekStart.setDate(weekStart.getDate() - weekStart.getDay());
    document.getElementById('filterWeekStart').value = weekStart.toISOString().split('T')[0];
    document.getElementById('filterMonth').value = today.substring(0,7);
    document.getElementById('filterFrom').value = today;
    document.getElementById('filterTo').value = today;
    loadReport();
    document.getElementById('exportExcelBtn').onclick = exportExcel;
  }

  function setPeriod(period, btn) {
    currentPeriod = period;
    document.querySelectorAll('.period-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('dailyFilter').style.display = period === 'daily' ? 'block' : 'none';
    document.getElementById('weeklyFilter').style.display = period === 'weekly' ? 'block' : 'none';
    document.getElementById('monthlyFilter').style.display = period === 'monthly' ? 'block' : 'none';
    document.getElementById('customFilter').style.display = period === 'custom' ? 'grid' : 'none';
    loadReport();
  }

  function getDateRange() {
    let from, to;
    const today = new Date();
    if (currentPeriod === 'daily') {
      const d = document.getElementById('filterDate').value || today.toISOString().split('T')[0];
      from = d; to = d;
    } else if (currentPeriod === 'weekly') {
      const start = new Date(document.getElementById('filterWeekStart').value || today);
      const end = new Date(start); end.setDate(end.getDate() + 6);
      from = start.toISOString().split('T')[0];
      to = end.toISOString().split('T')[0];
    } else if (currentPeriod === 'monthly') {
      const month = document.getElementById('filterMonth').value || today.toISOString().substring(0,7);
      const [y, m] = month.split('-').map(Number);
      const lastDay = new Date(y, m, 0).getDate();
      from = `${month}-01`;
      to = `${month}-${String(lastDay).padStart(2,'0')}`;
    } else {
      from = document.getElementById('filterFrom').value;
      to = document.getElementById('filterTo').value;
    }
    return { from, to };
  }

  async function loadReport() {
    const { from, to } = getDateRange();
    const filterStage = document.getElementById('filterStage').value;
    const filterItem = document.getElementById('filterItem').value;
    const filterPaymentType = document.getElementById('filterPaymentType').value;
    const tbody = document.getElementById('reportTableBody');
    tbody.innerHTML = `<tr><td colspan="10"><div class="loading-spinner"></div></td></tr>`;
    try {
      let query = db.collection('transactions').where('schoolId', '==', schoolId).where('date', '>=', from).where('date', '<=', to);
      const snap = await query.get();
      currentData = [];
      snap.forEach(doc => {
        const d = { id: doc.id, ...doc.data() };
        if (filterStage && d.stage !== filterStage) return;
        // paymentItem can be "بند1 + بند2" for multi-select — check with includes
        if (filterItem && !(d.paymentItem || '').includes(filterItem)) return;
        if (filterPaymentType && d.paymentType !== filterPaymentType) return;
        currentData.push(d);
      });
      currentData.sort((a,b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : 0));
      renderTable();
    } catch(err) { tbody.innerHTML = `<tr><td colspan="10"><div class="alert alert-error">خطأ: ${err.message}</div><tr></tr>`; }
  }

  function renderTable() {
    const tbody = document.getElementById('reportTableBody');
    const tfoot = document.getElementById('reportTableFoot');
    const isDaily = currentPeriod === 'daily';
    // إخفاء/إظهار أعمدة الطالب والمديونية حسب نوع التقرير
    document.querySelectorAll('.col-daily').forEach(el => {
      el.style.display = isDaily ? '' : 'none';
    });
    let total = 0, totalDebt = 0;
    const students = new Set();
    if (currentData.length === 0) {
      tbody.innerHTML = `<tr><td colspan="11"><div class="empty-state"><div class="empty-state-title">لا توجد بيانات للفلتر المحدد</div></div></td></tr>`;
      tfoot.innerHTML = '';
    } else {
      tbody.innerHTML = '';
      currentData.forEach((d,i) => {
        total += d.amount || 0;
        totalDebt += d.debt || 0;
        students.add(d.studentName);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="text-muted text-sm">${i+1}</td>
          <td>${d.date}</td>
          <td class="col-daily"><strong>${d.studentName}</strong></td>
          <td><span class="badge badge-primary">${d.stageName || d.stage}</span></td>
          <td>${d.grade}</td>
          <td>${d.paymentItem}</td>
          <td class="text-bold text-primary">${formatCurrency(d.amount)}</td>
          <td class="col-daily" style="color:#c0392b;font-weight:700">${d.debt>0?formatCurrency(d.debt):'-'}</td>
          <td>${d.paymentTypeName || d.paymentType}</td>
          <td class="text-sm text-muted">${d.receiptNumber}</td>
          <td class="text-sm text-muted">${d.notes || '-'}</td>
        `;
        tbody.appendChild(tr);
      });
      const colspan = isDaily ? 6 : 5;
      tfoot.innerHTML = `<tr class="table-footer-total"><td colspan="${colspan}" style="padding:0.75rem 1rem;font-weight:800">الاجمالي (${currentData.length} عملية)</td><td style="padding:0.75rem 1rem;font-weight:900;font-size:1.05rem">${formatCurrency(total)}</td>${isDaily ? `<td style="padding:0.75rem 1rem;font-weight:900;color:#c0392b">${totalDebt>0?formatCurrency(totalDebt):'-'}</td>` : ''}<td colspan="${isDaily?3:4}"></td></tr>`;
    }
    document.getElementById('summaryTotal').textContent = formatCurrency(total);
    document.getElementById('summaryCount').textContent = currentData.length;
    document.getElementById('summaryStudents').textContent = students.size;
    document.getElementById('resultsCount').textContent = currentData.length + ' سجل';
    const { from, to } = getDateRange();
    const periodLabels = { daily:'يومي', weekly:'اسبوعي', monthly:'شهري', custom:'مخصص' };
    document.getElementById('summaryPeriod').textContent = `${periodLabels[currentPeriod]} - من ${from} الى ${to}`;
  }

  // =============== EXPORT EXCEL - يملا التيمبلت بنفس شكل ستانفورد ===============
  async function exportExcel() {
    if (currentData.length === 0) { alert('لا توجد بيانات للتصدير'); return; }
    // جلب المصروفات من Firebase للفترة المختارة
    const { from: fromFetch, to: toFetch } = getDateRange();
    let expensesData = [];
    try {
      const expSnap = await db.collection('expenses')
        .where('schoolId', '==', schoolId)
        .where('date', '>=', fromFetch)
        .where('date', '<=', toFetch)
        .get();
      expSnap.forEach(doc => expensesData.push({ id: doc.id, ...doc.data() }));
      expensesData.sort((a,b) => a.date.localeCompare(b.date));
    } catch(e) { expensesData = []; }

    const school = SESSION.getSchool();
    const { from, to } = getDateRange();
    const periodLabels = { daily: 'يومي', weekly: 'اسبوعي', monthly: 'شهري', custom: 'مخصص' };
    const periodName = periodLabels[currentPeriod];

    if (typeof ExcelJS === 'undefined') {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
      document.head.appendChild(script);
      setTimeout(() => exportExcel(), 2000);
      return;
    }

    // ===== إعداد ألوان التيمبلت =====
    const schoolPrimary = (school?.primaryColor || '#1a2a4a').replace('#','');
    const HDR_BG   = 'FFAD818A';  // لون الهيدر الأصلي من التيمبلت
    const SEC_BG   = 'FFD8E4BC';  // لون العنوان الفرعي
    const TTL_BG   = 'FFDDD9C4';  // لون العنوان الرئيسي
    const schoolName = school?.name || 'اسم المدرسة';
    const YEAR = '2026/2027';

    const wb = new ExcelJS.Workbook();
    wb.creator = 'School Accounting System';

    // تحويل لون hex لـ ExcelJS
    function hexFill(hex) {
      return { type: 'pattern', pattern: 'solid', fgColor: { argb: hex.startsWith('FF') ? hex : 'FF' + hex } };
    }
    function hdrFont(bold=true, sz=11) { return { name: 'Arial', bold, size: sz, color: { argb: 'FF000000' } }; }
    function whtFont(bold=true, sz=11) { return { name: 'Arial', bold, size: sz, color: { argb: 'FFFFFFFF' } }; }
    function centerAlign(wrap=false) { return { horizontal: 'center', vertical: 'middle', wrapText: wrap, readingOrder: 2 }; }
    function rightAlign() { return { horizontal: 'right', vertical: 'middle', readingOrder: 2 }; }

    function styleHdr(row, bgArgb, bold=true, sz=11, fontArgb='FF000000') {
      row.eachCell({ includeEmpty: true }, cell => {
        cell.fill = hexFill(bgArgb);
        cell.font = { name: 'Arial', bold, size: sz, color: { argb: fontArgb } };
        cell.alignment = centerAlign(true);
        cell.border = {
          top: { style: 'thin', color: { argb: 'FFB0A0A0' } },
          bottom: { style: 'thin', color: { argb: 'FFB0A0A0' } },
          left: { style: 'thin', color: { argb: 'FFB0A0A0' } },
          right: { style: 'thin', color: { argb: 'FFB0A0A0' } }
        };
      });
      row.height = row.height || 20;
    }

    function styleData(row, evenRow=false) {
      row.eachCell({ includeEmpty: false }, cell => {
        if (evenRow) cell.fill = hexFill('FFF5F0F0');
        cell.font = { name: 'Arial', size: 10 };
        cell.alignment = centerAlign();
        cell.border = {
          bottom: { style: 'hair', color: { argb: 'FFDDDDDD' } },
          left: { style: 'hair', color: { argb: 'FFDDDDDD' } },
          right: { style: 'hair', color: { argb: 'FFDDDDDD' } }
        };
      });
      row.height = 18;
    }

    const PAYMENT_ITEMS = ['مصروفات دراسية', 'خصم', 'فايل', 'يونيفورم', 'أبليكيشن', 'إيرادات أخرى', 'باص'];
    const DAYS_AR = ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];

    // ====================================================
    // تقرير يومي - بأسماء الطلاب (مثل DAILY sheet)
    // ====================================================
    if (currentPeriod === 'daily') {
      const ws = wb.addWorksheet('يومي', { views: [{ rightToLeft: true }] });
      ws.columns = [
        { width: 6 },   // م
        { width: 30 },  // الاسم
        { width: 14 },  // الصف
        { width: 16 },  // مصروفات دراسية
        { width: 10 },  // خصم
        { width: 10 },  // فايل
        { width: 10 },  // يونيفورم
        { width: 12 },  // أبليكيشن
        { width: 14 },  // إيرادات أخرى
        { width: 10 },  // باص
        { width: 14 },  // رقم الإيصال
        { width: 20 },  // ملاحظات
      ];

      // Row 1: اليوم
      const dayName = new Date(from).toLocaleDateString('ar-EG', { weekday: 'long' });
      const r1 = ws.addRow(['اليوم', dayName, '', `ايراد ${schoolName} عام دراسي ${YEAR}`, '', '', '', '', '', '', 'الاسبوع  رقم', currentPeriod === 'daily' ? 1 : 1]);
      styleHdr(r1, HDR_BG, true, 12);
      ws.mergeCells('D1:J1');
      r1.height = 28;

      // Row 2: التاريخ
      const r2 = ws.addRow(['التاريخ', from]);
      styleHdr(r2, HDR_BG, true, 11);
      r2.height = 22;

      // Row 3: Column headers
      const r3 = ws.addRow(['م', 'الاسم', 'الصف', 'مصروفات دراسية', 'خصم', 'فايل', 'يونيفورم', 'أبليكيشن', 'إيرادات أخرى', 'باص', 'الايصال', 'ملاحظات']);
      styleHdr(r3, HDR_BG, true, 11);
      r3.height = 24;

      // Data rows
      let rowNum = 1;
      const totals = [0, 0, 0, 0, 0, 0, 0]; // D,E,F,G,H,I,J
      currentData.forEach((d, i) => {
        const amt = d.amount || 0;
        const discount = d.discount || 0;
        const itemAmts = [0, 0, 0, 0, 0, 0, 0];
        switch(d.paymentItem) {
          case 'مصروفات دراسية': itemAmts[0] = amt; break;
          case 'فايل': itemAmts[2] = amt; break;
          case 'يونيفورم': itemAmts[3] = amt; break;
          case 'أبليكيشن': itemAmts[4] = amt; break;
          case 'رحلات': case 'امتحانات': itemAmts[5] = amt; break;
          case 'باص': itemAmts[6] = amt; break;
          default: itemAmts[5] = amt;
        }
        if (discount > 0) itemAmts[1] = discount;
        itemAmts.forEach((v,j) => totals[j] += v);

        const row = ws.addRow([rowNum++, d.studentName, d.grade, ...itemAmts, d.receiptNumber || '', d.notes || '']);
        styleData(row, i % 2 === 1);
      });

      // Total row
      const totRow = ws.addRow(['الاجمالي', '', '', ...totals, '', '']);
      styleHdr(totRow, HDR_BG, true, 11);
      totRow.height = 22;

      // Revenue summary
      const revTotal = totals[0] + totals[2] + totals[3] + totals[4] + totals[5] + totals[6];
      const revRow = ws.addRow(['اجمالي الايرادات', '', revTotal]);
      styleHdr(revRow, SEC_BG, true, 12);
      ws.mergeCells(`A${revRow.number}:B${revRow.number}`);
      revRow.height = 22;

      // ===== قسم المصروفات اليومية =====
      ws.addRow([]);
      const expSecRow = ws.addRow(['ثانيا: المصروفات']);
      ws.mergeCells(`A${expSecRow.number}:L${expSecRow.number}`);
      styleHdr(expSecRow, 'FFD8E4BC', true, 13);
      expSecRow.getCell(1).alignment = { horizontal: 'right', vertical: 'middle', readingOrder: 2 };
      expSecRow.height = 22;

      const expHdrRow = ws.addRow(['م', 'التاريخ', 'اسم المستلم', 'المقابل', 'المبلغ', 'ملاحظات', '', '', '', '', '', '']);
      styleHdr(expHdrRow, 'FFAD818A', true, 11);
      ws.mergeCells(`G${expHdrRow.number}:L${expHdrRow.number}`);
      expHdrRow.height = 22;

      let expNum = 1;
      let expTotal = 0;
      const dayExpenses = expensesData.filter(e => e.date === from);
      if (dayExpenses.length === 0) {
        const emptyRow = ws.addRow(['-', '-', 'لا توجد مصروفات في هذا اليوم', '', '', '']);
        styleData(emptyRow, false);
      } else {
        dayExpenses.forEach((e, i) => {
          const row = ws.addRow([expNum++, e.date, e.recipientName, e.categoryLabel || e.category, e.amount || 0, e.notes || '']);
          styleData(row, i % 2 === 1);
          row.getCell(5).font = { name: 'Arial', bold: true, size: 10, color: { argb: 'FFC00000' } };
          expTotal += e.amount || 0;
        });
      }
      const expTotRow = ws.addRow(['الاجمالي', '', '', '', expTotal, '']);
      styleHdr(expTotRow, 'FFAD818A', true, 11);
      expTotRow.height = 22;

      // ===== الموقف المالي للشيت اليومي =====
      ws.addRow([]);
      const finRow = ws.addRow(['الموقف المالي اليومي']);
      ws.mergeCells(`A${finRow.number}:L${finRow.number}`);
      styleHdr(finRow, 'FFDDD9C4', true, 13);
      finRow.getCell(1).alignment = { horizontal: 'center', vertical: 'middle', readingOrder: 2 };
      finRow.height = 24;
      const netRow = ws.addRow(['إجمالي الإيرادات', revTotal, '', 'إجمالي المصروفات', expTotal, '', 'الصافي', revTotal - expTotal]);
      styleHdr(netRow, 'FFD8E4BC', true, 11);
      netRow.getCell(8).font = { name: 'Arial', bold: true, size: 12, color: { argb: (revTotal - expTotal) >= 0 ? 'FF1B5E20' : 'FFC00000' } };
      netRow.height = 24;

    // ====================================================
    // تقرير أسبوعي - ملخص بالأيام (مثل WEEKLY sheet)
    // ====================================================
    } else if (currentPeriod === 'weekly') {
      const ws = wb.addWorksheet('اسبوعي', { views: [{ rightToLeft: true }] });
      ws.columns = [
        { width: 6 },   // م
        { width: 14 },  // اليوم
        { width: 6 }, { width: 6 }, // span
        { width: 14 },  // التاريخ
        { width: 16 },  // مصروفات دراسية
        { width: 10 },  // خصم
        { width: 10 },  // فايل
        { width: 10 },  // يونيفورم
        { width: 10 },  // باص
        { width: 12 },  // أبليكيشن
        { width: 14 },  // إيرادات أخرى
        { width: 16 },  // إجمالي الايرادات
      ];

      // Title row
      const wkNum = 1;
      const titleRow = ws.addRow([`التقرير المالي الاسبوعي ل${schoolName}`]);
      ws.mergeCells('A1:M1');
      styleHdr(titleRow, TTL_BG, true, 16);
      titleRow.height = 34;

      // Info rows - الفترة الزمنية داخل الـ merge على اليمين
      const infoR1 = ws.addRow([`الاسبوع رقم : ${wkNum}`]);
      styleHdr(infoR1, SEC_BG, true, 11);
      ws.mergeCells(`A2:M2`);
      infoR1.getCell(1).alignment = { horizontal: 'right', vertical: 'middle', readingOrder: 'rightToLeft' };
      infoR1.height = 20;

      const infoR2 = ws.addRow([`الفترة الزمنية : ${from}  →  ${to}`]);
      styleHdr(infoR2, SEC_BG, true, 11);
      ws.mergeCells(`A3:M3`);
      infoR2.getCell(1).alignment = { horizontal: 'right', vertical: 'middle', readingOrder: 'rightToLeft' };
      infoR2.height = 20;

      // Section: revenue
      const secRevRow = ws.addRow(['أولا: الايراد الأسبوعي']);
      ws.mergeCells(`A4:M4`);
      styleHdr(secRevRow, SEC_BG, true, 13);
      secRevRow.height = 22;
      secRevRow.getCell(1).alignment = rightAlign();

      // Header row
      const hdr = ws.addRow(['م', 'اليوم', '', '', 'التاريخ', 'مصروفات دراسية', 'خصم', 'فايل', 'يونيفورم', 'باص', 'أبليكيشن', 'إيرادات أخرى', 'إجمالي الايرادات']);
      styleHdr(hdr, HDR_BG, true, 11);
      hdr.height = 28;

      // Group data by day
      const dayGroups = {};
      DAYS_AR.forEach(d => dayGroups[d] = []);
      currentData.forEach(d => {
        const dDate = new Date(d.date);
        const dayAr = dDate.toLocaleDateString('ar-EG', { weekday: 'long' });
        const matchDay = DAYS_AR.find(x => dayAr.includes(x.charAt(0))) || DAYS_AR[dDate.getDay() === 6 ? 0 : dDate.getDay()];
        if (!dayGroups[matchDay]) dayGroups[matchDay] = [];
        dayGroups[matchDay].push(d);
      });

      const weekTotals = [0,0,0,0,0,0,0];
      DAYS_AR.forEach((day, idx) => {
        const dayData = dayGroups[day] || [];
        const dt = [0,0,0,0,0,0,0];
        dayData.forEach(d => {
          const amt = d.amount || 0;
          switch(d.paymentItem) {
            case 'مصروفات دراسية': dt[0]+=amt; break;
            case 'فايل': dt[2]+=amt; break;
            case 'يونيفورم': dt[3]+=amt; break;
            case 'باص': dt[4]+=amt; break;
            case 'أبليكيشن': dt[5]+=amt; break;
            default: dt[6]+=amt;
          }
          dt[1] += d.discount || 0;
        });
        dt.forEach((v,j) => weekTotals[j]+=v);
        const dayDate = dayData.length > 0 ? dayData[0].date : '';
        const dayTotal = dt.reduce((a,b)=>a+b,0);
        const row = ws.addRow([idx+1, day, '', '', dayDate, dt[0], dt[1], dt[2], dt[3], dt[4], dt[5], dt[6], dayTotal]);
        styleData(row, idx % 2 === 1);
      });

      // Total row
      const weekTotal = weekTotals.reduce((a,b)=>a+b,0);
      const totRow = ws.addRow(['الاجمالي','','','','', weekTotals[0], weekTotals[1], weekTotals[2], weekTotals[3], weekTotals[4], weekTotals[5], weekTotals[6], weekTotal]);
      styleHdr(totRow, HDR_BG, true, 11);
      totRow.height = 22;

      // Section: expenses — real data from Firebase
      const secExpRow = ws.addRow(['ثانيا: المصروفات']);
      ws.mergeCells(`A${secExpRow.number}:M${secExpRow.number}`);
      styleHdr(secExpRow, SEC_BG, true, 13);
      secExpRow.getCell(1).alignment = rightAlign();
      secExpRow.height = 22;

      const expHdr = ws.addRow(['م', 'التاريخ', '', '', 'اسم المستلم', 'المقابل', 'المبلغ', '', '', '', '', '', '']);
      styleHdr(expHdr, HDR_BG, true, 11);
      expHdr.height = 24;

      let wkExpTotal = 0;
      if (expensesData.length === 0) {
        const er = ws.addRow(['-', '-', '', '', 'لا توجد مصروفات', '', 0]);
        styleData(er, false);
      } else {
        expensesData.forEach((e, idx) => {
          const row = ws.addRow([idx+1, e.date, '', '', e.recipientName, e.categoryLabel || e.category, e.amount || 0]);
          styleData(row, idx % 2 === 1);
          wkExpTotal += e.amount || 0;
        });
      }
      const expTotRow = ws.addRow(['الاجمالي','','','','','', wkExpTotal]);
      styleHdr(expTotRow, HDR_BG, true, 11);
      expTotRow.height = 22;

      // Section: financial position by grade
      const secPosRow = ws.addRow(['ثالثا: الموقف المالي الحالي']);
      ws.mergeCells(`A${secPosRow.number}:M${secPosRow.number}`);
      styleHdr(secPosRow, SEC_BG, true, 13);
      secPosRow.getCell(1).alignment = rightAlign();
      secPosRow.height = 22;

      const posHdr = ws.addRow(['م', 'المرحلة', '', 'المديونية السابقة', '', '', '', 'المحصل خلال الاسبوع', '', '', '', 'المديونية الحالية', 'المحصل للعام الجديد']);
      styleHdr(posHdr, HDR_BG, true, 11);
      posHdr.height = 28;

      const grades = ['Pre KG','KG 1','KG 2','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Prep 1','Prep 2','Prep 3'];
      const gradeTotals = {};
      currentData.forEach(d => {
        const g = d.grade;
        if (!gradeTotals[g]) gradeTotals[g] = 0;
        gradeTotals[g] += d.amount || 0;
      });

      grades.forEach((grade, idx) => {
        const collected = gradeTotals[grade] || 0;
        const row = ws.addRow([idx+1, grade, '', '', '', '', '', collected, '', '', '', '', '']);
        styleData(row, idx % 2 === 1);
      });

    // ====================================================
    // تقرير شهري - ملخص أسبوعي (مثل MONTHLY sheet)
    // ====================================================
    } else {
      const ws = wb.addWorksheet('شهري', { views: [{ rightToLeft: true }] });
      ws.columns = [
        { width: 6 }, { width: 16 }, { width: 8 }, { width: 8 },
        { width: 12 }, { width: 12 }, // من - الي
        { width: 16 }, { width: 10 }, { width: 10 }, { width: 10 }, { width: 10 }, { width: 14 }, { width: 14 }, { width: 16 }, { width: 16 }
      ];

      // Title
      const monthName = new Date(from).toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });
      const titleRow = ws.addRow([`التقرير المالي الشهري ل${schoolName}`]);
      ws.mergeCells('A1:O1');
      styleHdr(titleRow, TTL_BG, true, 18);
      titleRow.height = 36;

      const mInfoRow = ws.addRow([`شهر : ${monthName}`]);
      ws.mergeCells(`A2:O2`);
      styleHdr(mInfoRow, SEC_BG, true, 12);
      mInfoRow.getCell(1).alignment = { horizontal: 'right', vertical: 'middle', readingOrder: 'rightToLeft' };
      mInfoRow.height = 22;

      const periodRowM = ws.addRow([`الفترة الزمنية : ${from}  →  ${to}`]);
      ws.mergeCells(`A3:O3`);
      styleHdr(periodRowM, SEC_BG, true, 12);
      periodRowM.getCell(1).alignment = { horizontal: 'right', vertical: 'middle', readingOrder: 'rightToLeft' };
      periodRowM.height = 22;

      // Section 1: monthly revenue
      const sec1Row = ws.addRow(['أولا: الايراد الشهري']);
      ws.mergeCells(`A4:O4`);
      styleHdr(sec1Row, SEC_BG, true, 13);
      sec1Row.getCell(1).alignment = rightAlign();
      sec1Row.height = 22;

      const hdrRow = ws.addRow(['م','الاسبوع','','','من','الى','مصروفات دراسية','خصم','فايل','يونيفورم','باص','أبليكيشن','إيرادات أخرى','إجمالي الايرادات','الإجمالي للعامين']);
      styleHdr(hdrRow, HDR_BG, true, 11);
      hdrRow.height = 28;

      // Group by week
      const weekGroups = {};
      currentData.forEach(d => {
        const dDate = new Date(d.date);
        const wkStart = new Date(dDate);
        wkStart.setDate(dDate.getDate() - ((dDate.getDay() + 1) % 7)); // السبت
        const wk = wkStart.toISOString().split('T')[0];
        if (!weekGroups[wk]) weekGroups[wk] = [];
        weekGroups[wk].push(d);
      });

      const sortedWks = Object.keys(weekGroups).sort();
      const monthTotals = [0,0,0,0,0,0,0];

      sortedWks.forEach((wk, idx) => {
        const wkData = weekGroups[wk];
        const wkEnd = new Date(wk);
        wkEnd.setDate(wkEnd.getDate() + 5);
        const wt = [0,0,0,0,0,0,0];
        wkData.forEach(d => {
          const amt = d.amount || 0;
          switch(d.paymentItem) {
            case 'مصروفات دراسية': wt[0]+=amt; break;
            case 'فايل': wt[2]+=amt; break;
            case 'يونيفورم': wt[3]+=amt; break;
            case 'باص': wt[4]+=amt; break;
            case 'أبليكيشن': wt[5]+=amt; break;
            default: wt[6]+=amt;
          }
          wt[1] += d.discount||0;
        });
        wt.forEach((v,j) => monthTotals[j]+=v);
        const wkTotal = wt.reduce((a,b)=>a+b,0);
        const wkEndStr = wkEnd.toISOString().split('T')[0];
        const row = ws.addRow([idx+1, `الاسبوع ${idx+1}`,'','', wk, wkEndStr, wt[0], wt[1], wt[2], wt[3], wt[4], wt[5], wt[6], wkTotal, wkTotal]);
        styleData(row, idx%2===1);
      });

      const monthTotal = monthTotals.reduce((a,b)=>a+b,0);
      const totRowM = ws.addRow(['الاجمالي','','','','','', monthTotals[0], monthTotals[1], monthTotals[2], monthTotals[3], monthTotals[4], monthTotals[5], monthTotals[6], monthTotal, monthTotal]);
      styleHdr(totRowM, HDR_BG, true, 12);
      totRowM.height = 24;

      // Section 2: expenses — real data from Firebase
      const sec2Row = ws.addRow(['ثانيا: المصروفات']);
      ws.mergeCells(`A${sec2Row.number}:O${sec2Row.number}`);
      styleHdr(sec2Row, SEC_BG, true, 13);
      sec2Row.getCell(1).alignment = rightAlign();
      sec2Row.height = 22;

      const expHdrRow = ws.addRow(['م','التاريخ','','','اسم المستلم','المقابل / الفئة','المبلغ','','','','','','','','ملاحظات']);
      styleHdr(expHdrRow, HDR_BG, true, 11);
      expHdrRow.height = 24;

      let mExpTotal = 0;
      if (expensesData.length === 0) {
        const er = ws.addRow(['-','-','','','لا توجد مصروفات','',0]);
        styleData(er, false);
      } else {
        expensesData.forEach((e,idx) => {
          const row = ws.addRow([idx+1, e.date,'','', e.recipientName, e.categoryLabel || e.category, e.amount||0,'','','','','','','', e.notes||'']);
          styleData(row, idx%2===1);
          mExpTotal += e.amount||0;
        });
      }
      const expTotRow = ws.addRow(['الاجمالي','','','','','', mExpTotal]);
      styleHdr(expTotRow, HDR_BG, true, 11);
      expTotRow.height = 22;

      // Section 3: financial position by grade
      const sec3Row = ws.addRow(['ثالثا: الموقف المالي الحالي']);
      ws.mergeCells(`A${sec3Row.number}:O${sec3Row.number}`);
      styleHdr(sec3Row, SEC_BG, true, 13);
      sec3Row.getCell(1).alignment = rightAlign();
      sec3Row.height = 22;

      const posHdrRow = ws.addRow(['م','المرحلة','','المديونية بداية الشهر','','','','المحصل خلال الشهر','','','','خصومات','','المديونية الحالية','المحصل للعام الجديد']);
      styleHdr(posHdrRow, HDR_BG, true, 11);
      posHdrRow.height = 28;

      const grades = ['Pre KG','KG 1','KG 2','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Prep 1','Prep 2','Prep 3'];
      const gradeTotals = {};
      currentData.forEach(d => {
        const g = d.grade;
        if (!gradeTotals[g]) gradeTotals[g] = 0;
        gradeTotals[g] += d.amount||0;
      });
      grades.forEach((grade,idx) => {
        const collected = gradeTotals[grade]||0;
        const row = ws.addRow([idx+1,grade,'','','','','', collected,'','','','','','','']);
        styleData(row, idx%2===1);
      });
    }

    // حفظ وتنزيل
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${periodName}_تقرير_${schoolName}_${from}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);
  }


    // تصدير PDF
  function exportPDF() {
    const school = SESSION.getSchool();
    const { from, to } = getDateRange();
    const isDaily = currentPeriod === 'daily';
    const periodLabels = { daily: 'يومي', weekly: 'اسبوعي', monthly: 'شهري', custom: 'مخصص' };
    let total = currentData.reduce((s, d) => s + (d.amount || 0), 0);
    let totalDebt = currentData.reduce((s, d) => s + (d.debt || 0), 0);
    let tableHTML = '';
    if (isDaily) {
      const rows = currentData.map((d, i) => `<tr><td>${i+1}</td><td>${d.date}</td><td>${d.studentName}</td><td>${d.stageName || d.stage}</td><td>${d.grade}</td><td>${d.paymentItem}</td><td style="font-weight:800">${formatCurrency(d.amount)}</td><td style="color:#c0392b">${d.debt>0?formatCurrency(d.debt):'-'}</td><td>${d.paymentTypeName || d.paymentType}</td><td>${d.receiptNumber}</td><td>${d.notes || '-'}</td></tr>`).join('');
      tableHTML = `<table><thead><tr><th>#</th><th>التاريخ</th><th>الطالب</th><th>المرحلة</th><th>الصف</th><th>البند</th><th>المبلغ</th><th>المديونية</th><th>الدفع</th><th>الايصال</th><th>ملاحظات</th></tr></thead><tbody>${rows}</tbody><tfoot><tr class="total-row"><td colspan="6">الاجمالي (${currentData.length} عملية)</td><td>${formatCurrency(total)}</td><td>${formatCurrency(totalDebt)}</td><td colspan="3"></td></tr></tfoot></table>`;
    } else {
      const itemTotals = {};
      const stageTotals = {};
      currentData.forEach(d => {
        if (!itemTotals[d.paymentItem]) itemTotals[d.paymentItem] = { total: 0, count: 0 };
        itemTotals[d.paymentItem].total += d.amount || 0;
        itemTotals[d.paymentItem].count++;
        const sk = d.stageName || d.stage;
        if (!stageTotals[sk]) stageTotals[sk] = 0;
        stageTotals[sk] += d.amount || 0;
      });
      tableHTML = `<h3>ملخص حسب بند الدفع</h3><table><thead><tr><th>بند الدفع</th><th>عدد العمليات</th><th>اجمالي المحصل</th></tr></thead><tbody>${Object.entries(itemTotals).map(([item,v])=>`<tr><td>${item}</td><td>${v.count}</td><td>${formatCurrency(v.total)}</td></tr>`).join('')}</tbody><tfoot><tr class="total-row"><td>الاجمالي</td><td>${currentData.length}</td><td>${formatCurrency(total)}</td></tr></tfoot></table><h3>ملخص حسب المرحلة</h3><table><thead><tr><th>المرحلة</th><th>اجمالي المحصل</th></tr></thead><tbody>${Object.entries(stageTotals).map(([s,v])=>`<tr><td>${s}</td><td>${formatCurrency(v)}</td></tr>`).join('')}</tbody></table>`;
    }
    const win = window.open('', '_blank');
    win.document.write(`<html dir="rtl"><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif;padding:24px;font-size:12px;direction:rtl}.header{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding-bottom:12px;border-bottom:3px solid #1a3a6b}.school-name{font-size:18px;font-weight:900;color:#1a3a6b}.report-info{font-size:11px;color:#666;margin-top:4px}table{width:100%;border-collapse:collapse;margin-top:12px}th{background:#1a3a6b;color:white;padding:7px 8px;text-align:right;font-size:11px}td{padding:6px 8px;border-bottom:1px solid #eee;font-size:11px}tr:nth-child(even){background:#f8f9fa}.total-row{background:#e8f0fe!important;font-weight:900;color:#1a3a6b}.summary{display:flex;gap:24px;margin:12px 0;background:#1a3a6b;color:white;padding:12px 16px;border-radius:8px}.summary-item .label{font-size:10px;opacity:0.7}.summary-item .value{font-size:18px;font-weight:900}@media print{@page{size:A4 landscape}body{padding:12px}}</style></head><body><div class="header"><img src="${school?.logo}" width="56" height="56" style="object-fit:contain" onerror="this.style.display='none'" /><div><div class="school-name">${school?.name || ''}</div><div class="report-info">كشف تحصيل ${periodLabels[currentPeriod]} | الفترة: ${from} الى ${to} | السنة الدراسية 2026/2027</div><div class="report-info">تاريخ الطباعة: ${new Date().toLocaleDateString('ar-EG')} | بواسطة: ${session.email}</div></div></div><div class="summary"><div class="summary-item"><div class="label">اجمالي التحصيل</div><div class="value">${formatCurrency(total)}</div></div><div class="summary-item"><div class="label">عدد العمليات</div><div class="value">${currentData.length}</div></div><div class="summary-item"><div class="label">عدد الطلاب</div><div class="value">${new Set(currentData.map(d=>d.studentName)).size}</div></div>${totalDebt > 0 ? `<div class="summary-item"><div class="label">اجمالي المديونيات</div><div class="value" style="color:#ffd700">${formatCurrency(totalDebt)}</div></div>` : ''}</div>${tableHTML}<script>window.print();setTimeout(()=>window.close(),800)<\/script></body></html>`);
  }

  init();
</script>
</body>
