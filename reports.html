<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التقارير - نظام المحاسبة</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .export-btn-group { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .filter-section { background:var(--card-bg); border-radius:var(--radius); padding:1.25rem; border:1px solid var(--border); margin-bottom:1rem; }
    .summary-box { background: linear-gradient(135deg, var(--primary), var(--primary-dark, #0d2247)); color: white; border-radius: var(--radius); padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .summary-box .big-num { font-size: 2.5rem; font-weight: 900; }
    .summary-box .sub { font-size: 0.8rem; opacity: 0.7; }
    .table-footer-total { background: var(--accent); font-weight: 800; color: var(--primary); }
  </style>
</head>
<body>

<div class="app-layout">
  <div class="main-content">
    <div id="topbarContainer"></div>
    <div class="page-content">

      <!-- Period Tabs -->
      <div class="report-period-tabs animate-in">
        <button class="period-tab active" onclick="setPeriod('daily', this)"> يومي</button>
        <button class="period-tab" onclick="setPeriod('weekly', this)"> أسبوعي</button>
        <button class="period-tab" onclick="setPeriod('monthly', this)"> شهري</button>
        <button class="period-tab" onclick="setPeriod('custom', this)"> مخصص</button>
      </div>

      <!-- Filters -->
      <div class="filter-section animate-in">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;align-items:end">
          <div id="dailyFilter"><label class="form-label">التاريخ</label><input type="date" class="form-input" id="filterDate" onchange="loadReport()" /></div>
          <div id="weeklyFilter" style="display:none"><label class="form-label">أسبوع من</label><input type="date" class="form-input" id="filterWeekStart" onchange="loadReport()" /></div>
          <div id="monthlyFilter" style="display:none"><label class="form-label">الشهر</label><input type="month" class="form-input" id="filterMonth" onchange="loadReport()" /></div>
          <div id="customFilter" style="display:none;grid-template-columns:1fr 1fr;gap:0.5rem;grid-column:span 2"><div><label class="form-label">من</label><input type="date" class="form-input" id="filterFrom" onchange="loadReport()" /></div><div><label class="form-label">إلى</label><input type="date" class="form-input" id="filterTo" onchange="loadReport()" /></div></div>
          <div><label class="form-label">المرحلة</label><select class="form-select" id="filterStage" onchange="loadReport()"><option value="">كل المراحل</option><option value="pre_kg">Pre-KG</option><option value="kg">KG</option><option value="grade">Grade</option><option value="prep">Prep</option></select></div>
          <div><label class="form-label">بند الدفع</label><select class="form-select" id="filterItem" onchange="loadReport()"><option value="">كل البنود</option><option value="مصروفات دراسية">مصروفات دراسية</option><option value="باص">باص</option><option value="يونيفورم">يونيفورم</option><option value="فايل">فايل</option><option value="أبليكيشن">أبليكيشن</option><option value="رحلات">رحلات</option><option value="امتحانات">امتحانات</option></select></div>
          <div><label class="form-label">طريقة الدفع</label><select class="form-select" id="filterPaymentType" onchange="loadReport()"><option value="">كل الطرق</option><option value="cash">نقدي</option><option value="bank_transfer">تحويل بنكي</option><option value="check">شيك</option><option value="instapay">إنستاباي</option></select></div>
          <div><button class="btn btn-primary w-full" onclick="loadReport()"> بحث</button></div>
        </div>
      </div>

      <!-- Summary Box -->
      <div class="summary-box animate-in" id="summaryBox">
        <div><div class="sub">إجمالي التحصيل</div><div class="big-num" id="summaryTotal">ج.م 0</div><div class="sub" id="summaryPeriod">التقرير اليومي</div></div>
        <div><div style="font-size:2rem;font-weight:900" id="summaryCount">0</div><div class="sub">عملية</div></div>
        <div><div style="font-size:2rem;font-weight:900" id="summaryStudents">0</div><div class="sub">طالب</div></div>
        <div class="export-btn-group no-print"><button class="btn btn-secondary btn-sm" id="exportExcelBtn" style="background:rgba(255,255,255,0.2);color:white;border:1px solid rgba(255,255,255,0.3)"> Excel</button><button class="btn btn-secondary btn-sm" onclick="exportPDF()" style="background:rgba(255,255,255,0.2);color:white;border:1px solid rgba(255,255,255,0.3)"> PDF</button><button class="btn btn-secondary btn-sm" onclick="window.print()" style="background:rgba(255,255,255,0.2);color:white;border:1px solid rgba(255,255,255,0.3)"> طباعة</button></div>
      </div>

      <!-- Results Table -->
      <div class="card animate-in">
        <div class="card-header"><span class="card-title"> نتائج التقرير</span><span class="badge badge-primary" id="resultsCount">0 سجل</span></div>
        <div class="table-wrapper">
          <table class="data-table" id="reportTable">
            <thead><tr><th>#</th><th>التاريخ</th><th class="col-daily">اسم الطالب</th><th>المرحلة</th><th>الصف</th><th>بند الدفع</th><th>المبلغ المدفوع</th><th class="col-daily">المديونية</th><th>طريقة الدفع</th><th>رقم الإيصال</th><th>ملاحظات</th><th class="no-print">إجراء</th></tr></thead>
            <tbody id="reportTableBody"><tr><td colspan="10"><div class="empty-state"><div class="empty-state-icon"></div><div class="empty-state-title">اختر الفلتر وانقر بحث</div></div></td></tr></tbody>
            <tfoot id="reportTableFoot"></tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
  renderLayout('reports', 'التقارير والشيتات');
  const session = SESSION.get();
  const schoolId = session.schoolId;
  let currentPeriod = 'daily';
  let currentData = [];

  function localDateStr(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
  }

  function init() {
    const today = localDateStr(new Date());
    document.getElementById('filterDate').value = today;
    const weekStart = new Date();
    weekStart.setDate(weekStart.getDate() - weekStart.getDay());
    document.getElementById('filterWeekStart').value = localDateStr(weekStart);
    document.getElementById('filterMonth').value = today.substring(0,7);
    document.getElementById('filterFrom').value = today;
    document.getElementById('filterTo').value = today;
    loadReport();
    document.getElementById('exportExcelBtn').onclick = exportExcel;
  }

  function setPeriod(period, btn) {
    currentPeriod = period;
    document.querySelectorAll('.period-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('dailyFilter').style.display = period === 'daily' ? 'block' : 'none';
    document.getElementById('weeklyFilter').style.display = period === 'weekly' ? 'block' : 'none';
    document.getElementById('monthlyFilter').style.display = period === 'monthly' ? 'block' : 'none';
    document.getElementById('customFilter').style.display = period === 'custom' ? 'grid' : 'none';
    loadReport();
  }

  function getDateRange() {
    let from, to;
    const today = new Date();
    if (currentPeriod === 'daily') {
      const d = document.getElementById('filterDate').value || today.toISOString().split('T')[0];
      from = d; to = d;
    } else if (currentPeriod === 'weekly') {
      const start = new Date(document.getElementById('filterWeekStart').value + 'T00:00:00');
      const end = new Date(start); end.setDate(end.getDate() + 6);
      from = localDateStr(start);
      to = localDateStr(end);
    } else if (currentPeriod === 'monthly') {
      const month = document.getElementById('filterMonth').value || today.toISOString().substring(0,7);
      const [y, m] = month.split('-').map(Number);
      const lastDay = new Date(y, m, 0).getDate();
      from = `${month}-01`;
      to = `${month}-${String(lastDay).padStart(2,'0')}`;
    } else {
      from = document.getElementById('filterFrom').value;
      to = document.getElementById('filterTo').value;
    }
    return { from, to };
  }

  async function loadReport() {
    const { from, to } = getDateRange();
    const filterStage = document.getElementById('filterStage').value;
    const filterItem = document.getElementById('filterItem').value;
    const filterPaymentType = document.getElementById('filterPaymentType').value;
    const tbody = document.getElementById('reportTableBody');
    tbody.innerHTML = `<tr><td colspan="10"><div class="loading-spinner"></div></td></tr>`;
    try {
      let query = db.collection('transactions').where('schoolId', '==', schoolId).where('date', '>=', from).where('date', '<=', to);
      const snap = await query.get();
      currentData = [];
      snap.forEach(doc => {
        const d = { id: doc.id, ...doc.data() };
        if (filterStage && d.stage !== filterStage) return;
        // paymentItem can be "بند1 + بند2" for multi-select — check with includes
        if (filterItem && !(d.paymentItem || '').includes(filterItem)) return;
        if (filterPaymentType && d.paymentType !== filterPaymentType) return;
        currentData.push(d);
      });
      currentData.sort((a,b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : 0));
      renderTable();
    } catch(err) { tbody.innerHTML = `<tr><td colspan="10"><div class="alert alert-error">خطأ: ${err.message}</div><tr></tr>`; }
  }

  function renderTable() {
    const tbody = document.getElementById('reportTableBody');
    const tfoot = document.getElementById('reportTableFoot');
    const isDaily = currentPeriod === 'daily';
    // إخفاء/إظهار أعمدة الطالب والمديونية حسب نوع التقرير
    document.querySelectorAll('.col-daily').forEach(el => {
      el.style.display = isDaily ? '' : 'none';
    });
    let total = 0, totalDebt = 0;
    const students = new Set();
    if (currentData.length === 0) {
      tbody.innerHTML = `<tr><td colspan="11"><div class="empty-state"><div class="empty-state-title">لا توجد بيانات للفلتر المحدد</div></div></td></tr>`;
      tfoot.innerHTML = '';
    } else {
      tbody.innerHTML = '';
      currentData.forEach((d,i) => {
        total += d.amount || 0;
        totalDebt += d.debt || 0;
        students.add(d.studentName);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="text-muted text-sm">${i+1}</td>
          <td>${d.date}</td>
          <td class="col-daily"><strong>${d.studentName}</strong></td>
          <td><span class="badge badge-primary">${d.stageName || d.stage}</span></td>
          <td>${d.grade}</td>
          <td>${d.paymentItem}</td>
          <td class="text-bold text-primary">${formatCurrency(d.amount)}</td>
          <td class="col-daily" style="color:#c0392b;font-weight:700">${d.debt>0?formatCurrency(d.debt):'-'}</td>
          <td>${d.paymentTypeName || d.paymentType}</td>
          <td class="text-sm text-muted">${d.receiptNumber}</td>
          <td class="text-sm text-muted">${d.notes || '-'}</td>
          <td class="no-print">
            <button onclick="openEditTxModal('${d.id}')" style="padding:3px 10px;font-size:0.75rem;font-weight:700;color:var(--primary);background:none;border:1.5px solid var(--primary);border-radius:6px;cursor:pointer;font-family:Cairo,sans-serif;white-space:nowrap">✏ تعديل</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
      // الأعمدة الظاهرة:
      // يومي (12): م، تاريخ، طالب، مرحلة، صف، بند، مبلغ، مديونية، دفع، إيصال، ملاحظات، إجراء
      // غير يومي (10): م، تاريخ، مرحلة، صف، بند، مبلغ، دفع، إيصال، ملاحظات، إجراء
      const labelColspan = isDaily ? 6 : 5;   // حتى عمود "بند الدفع"
      const trailColspan = isDaily ? 4 : 4;   // دفع + إيصال + ملاحظات + إجراء
      tfoot.innerHTML = `<tr class="table-footer-total">
        <td colspan="${labelColspan}" style="padding:0.75rem 1rem;font-weight:800">الإجمالي (${currentData.length} عملية)</td>
        <td style="padding:0.75rem 1rem;font-weight:900;font-size:1.05rem">${formatCurrency(total)}</td>
        ${isDaily ? `<td style="padding:0.75rem 1rem;font-weight:900;color:#c0392b">${totalDebt>0?formatCurrency(totalDebt):'-'}</td>` : ''}
        <td colspan="${trailColspan}"></td>
      </tr>`;
    }
    document.getElementById('summaryTotal').textContent = formatCurrency(total);
    document.getElementById('summaryCount').textContent = currentData.length;
    document.getElementById('summaryStudents').textContent = students.size;
    document.getElementById('resultsCount').textContent = currentData.length + ' سجل';
    const { from, to } = getDateRange();
    const periodLabels = { daily:'يومي', weekly:'اسبوعي', monthly:'شهري', custom:'مخصص' };
    document.getElementById('summaryPeriod').textContent = `${periodLabels[currentPeriod]} - من ${from} الى ${to}`;
  }


  // ============================================================
  // EXPORT EXCEL — نفس هيكل الأصلي بتنسيق أجمل وبيانات Firebase
  // ============================================================
  async function exportExcel() {
    if (currentData.length === 0) { alert('لا توجد بيانات للتصدير'); return; }

    const school = SESSION.getSchool();
    const { from, to } = getDateRange();   // ← مرة واحدة بس

    // جلب المصروفات من Firebase
    let expensesData = [];
    try {
      const expSnap = await db.collection('expenses')
        .where('schoolId', '==', schoolId)
        .where('date', '>=', from)
        .where('date', '<=', to)
        .get();
      expSnap.forEach(doc => expensesData.push({ id: doc.id, ...doc.data() }));
      expensesData.sort((a,b) => a.date.localeCompare(b.date));
    } catch(e) { expensesData = []; }

    if (typeof ExcelJS === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
      document.head.appendChild(s);
      s.onload = () => exportExcel();
      return;
    }

    const periodLabels = { daily:'يومي', weekly:'اسبوعي', monthly:'شهري', custom:'مخصص' };
    const schoolName = school?.name || 'المدرسة';
    const YEAR = '2026/2027';
    const DAYS_AR_W = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
    const GRADES_LIST = ['Pre-KG','KG1','KG2','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Prep 1','Prep 2','Prep 3'];

    // ── ألوان المدرسة ──
    const rawPrimary = (school?.primaryColor || '#1E2D5A').replace('#','');
    const rawSecond  = (school?.secondaryColor|| '#4A6FA5').replace('#','');
    const rawAccent  = (school?.accentColor   || '#D6E4F0').replace('#','');

    const PRI  = 'FF' + rawPrimary;
    const SEC  = 'FF' + rawSecond;
    const ACC  = 'FF' + rawAccent;
    const WHT  = 'FFFFFFFF';
    const BLK  = 'FF000000';
    const RED  = 'FFC00000';
    const TOTBG= 'FF' + rawPrimary;

    const wb = new ExcelJS.Workbook();
    wb.creator = 'School Accounting System — ' + schoolName;
    wb.views = [{ x:0, y:0, width:10000, height:20000, firstSheet:0, activeTab:0, visibility:'visible', rightToLeft:true }];

    // ── دوال مساعدة ──
    function hFill(argb) { return { type:'pattern', pattern:'solid', fgColor:{ argb } }; }
    function hBorder(style='medium', c='FF888888') {
      const s = { style, color:{ argb: c } };
      return { top:s, bottom:s, left:s, right:s };
    }
    function medBorder() { return hBorder('medium','FF444444'); }
    function thickBorder() { return hBorder('thick','FF222222'); }
    function cAlign(wrap=false) { return { horizontal:'center', vertical:'middle', wrapText:wrap, readingOrder:2, textRotation:0 }; }
    function rAlign() { return { horizontal:'right', vertical:'middle', readingOrder:2, textRotation:0 }; }
    function lAlign() { return { horizontal:'left',  vertical:'middle', readingOrder:2, textRotation:0 }; }

    function styleRow(row, bg, fontArgb=BLK, bold=false, sz=10, wrap=false) {
      row.eachCell({ includeEmpty:true }, cell => {
        if (bg) cell.fill = hFill(bg);
        cell.font = { name:'Arial', bold, size:sz, color:{ argb: fontArgb } };
        cell.alignment = cAlign(wrap);
        cell.border = hBorder('medium','FF888888');
      });
    }

    function titleRow(ws, text, bg, fontArgb=WHT, sz=13, mergeEnd='') {
      const r = ws.addRow([text]);
      if (mergeEnd) ws.mergeCells(`A${r.number}:${mergeEnd}${r.number}`);
      styleRow(r, bg, fontArgb, true, sz, true);
      r.height = 28;
      return r;
    }

    function sectionRow(ws, num, text, bg, mergeEnd) {
      const r = ws.addRow([num + '    ' + text]);
      ws.mergeCells(`A${r.number}:${mergeEnd}${r.number}`);
      r.getCell(1).fill = hFill(bg);
      r.getCell(1).font = { name:'Arial', bold:true, size:12, color:{ argb: WHT } };
      r.getCell(1).alignment = rAlign();
      r.getCell(1).border = medBorder();
      r.height = 26;
      return r;
    }

    function hdrRow(ws, vals, bg, merges=[]) {
      const r = ws.addRow(vals);
      styleRow(r, bg, WHT, true, 10);
      merges.forEach(([s,e]) => ws.mergeCells(`${s}${r.number}:${e}${r.number}`));
      r.height = 24;
      return r;
    }

    function dataRow(ws, vals, altBg=false, bold=false) {
      const r = ws.addRow(vals);
      r.eachCell({ includeEmpty:true }, cell => {
        cell.fill = hFill(altBg ? ACC : WHT);
        cell.font = { name:'Arial', bold:bold, size:10, color:{ argb: BLK } };
        cell.alignment = cAlign();
        cell.border = hBorder('medium','FF999999');
      });
      r.height = 20;
      return r;
    }

    function totalRow(ws, vals, bg=TOTBG, merges=[]) {
      const r = ws.addRow(vals);
      r.eachCell({ includeEmpty:true }, cell => {
        if (bg) cell.fill = hFill(bg);
        cell.font = { name:'Arial', bold:true, size:11, color:{ argb: WHT } };
        cell.alignment = cAlign();
        cell.border = hBorder('thick','FF444444');
      });
      merges.forEach(([s,e]) => ws.mergeCells(`${s}${r.number}:${e}${r.number}`));
      r.height = 24;
      return r;
    }

    function numFmt(cell) { cell.numFmt = '#,##0;(#,##0);"-"'; }

    // دالة توزيع مبلغ على البنود — بتستخدم paymentItems (array of objects) لو موجودة
    function mapAmounts(d) {
      const out = { fees:0, disc:d.discount||0, file:0, uni:0, bus:0, app:0, other:0 };

      function assignItem(itemName, itemAmt) {
        const name = (itemName || '').trim();
        if      (name === 'مصروفات دراسية' || name === 'مصروفات') { out.fees += itemAmt; }
        else if (name === 'فايل')                                   { out.file += itemAmt; }
        else if (name === 'يونيفورم')                              { out.uni  += itemAmt; }
        else if (name === 'باص')                                    { out.bus  += itemAmt; }
        else if (name === 'أبليكيشن')                              { out.app  += itemAmt; }
        // fallback includes (للأسماء الطويلة أو المختلفة قليلاً)
        else if (name.includes('مصروفات'))  { out.fees += itemAmt; }
        else if (name.includes('فايل'))     { out.file += itemAmt; }
        else if (name.includes('يونيفورم')) { out.uni  += itemAmt; }
        else if (name.includes('باص'))      { out.bus  += itemAmt; }
        else if (name.includes('أبليكيشن')) { out.app  += itemAmt; }
        else { out.other += itemAmt; }
      }

      // paymentItems = [{item, price, discount, netPrice}, ...]
      if (Array.isArray(d.paymentItems) && d.paymentItems.length > 0) {
        d.paymentItems.forEach(pi => {
          if (typeof pi === 'object' && pi.item) {
            assignItem(pi.item, Number(pi.netPrice) || Number(pi.price) || 0);
          } else if (typeof pi === 'string') {
            // قسّم المبلغ بالتساوي لو string فقط
            assignItem(pi, (d.amount || 0) / d.paymentItems.length);
          }
        });
      } else {
        // fallback على paymentItem string
        const amt  = d.amount || 0;
        const itemStr = d.paymentItem || '';
        // لو فيه " + " يعني بنود متعددة — قسّم بالتساوي
        if (itemStr.includes('+')) {
          const parts = itemStr.split('+').map(s => s.trim()).filter(Boolean);
          parts.forEach(part => assignItem(part, amt / parts.length));
        } else {
          assignItem(itemStr, amt);
        }
      }

      return out;
    }

    // =================================================================
    // ① التقرير اليومي — شيت واحد مفصّل
    // =================================================================
    if (currentPeriod === 'daily') {
      const ws = wb.addWorksheet('يومي');
      ws.views = [{ state:'normal', rightToLeft:true }];
      ws.columns = [
        {width:5},{width:28},{width:13},{width:15},{width:10},
        {width:9},{width:11},{width:12},{width:13},{width:10},
        {width:16},{width:22}
      ];
      const MCOL = 'L'; // آخر عمود

      // ── بانر المدرسة ──
      const b1 = titleRow(ws, `إيراد ${schoolName} — العام الدراسي ${YEAR}`, PRI, WHT, 14, MCOL);
      ws.getCell(`A${b1.number}`).alignment = cAlign(true);

      const _d0 = new Date(from+'T00:00:00');
      const _wkNum = Math.ceil(_d0.getDate() / 7);
      const b2 = ws.addRow([`اليوم :  ${_d0.toLocaleDateString('ar-EG',{weekday:'long'})}     التاريخ :  ${from}     الأسبوع رقم : ${_wkNum}`]);
      ws.mergeCells(`A${b2.number}:${MCOL}${b2.number}`);
      styleRow(b2, SEC, WHT, true, 11); b2.height = 22;

      // ── هيدر الأعمدة ──
      hdrRow(ws,
        ['م','الاسم','الصف','مصروفات دراسية','خصم','فايل','يونيفورم','أبليكيشن','إيرادات أخرى','باص','الإيصال','ملاحظات'],
        SEC, []);

      // ── بيانات الطلاب ──
      const totals = {fees:0, disc:0, file:0, uni:0, app:0, other:0, bus:0};

      // ── قسم المصروفات ──
      ws.addRow([]);

      const dayExps = expensesData.filter(e => e.date === from);
      let expTotal = 0;
      if (dayExps.length === 0) {

      } else {
        dayExps.forEach((e,i) => {

          ws.mergeCells(`C${r.number}:D${r.number}`);
          ws.mergeCells(`E${r.number}:F${r.number}`);
          ws.mergeCells(`G${r.number}:${MCOL}${r.number}`);

      const et = totalRow(ws, ['إجمالي المصروفات','','','','','',expTotal,'','','','',''], TOTBG, [['A','F'],['H',MCOL]]);

      // ── الموقف المالي ──
      ws.addRow([]);
      sectionRow(ws, '③', 'الموقف المالي اليومي', SEC, MCOL);
      // Layout: A:B=إجمالي الإيرادات | C=قيمة | D:E=إجمالي المصروفات | F=قيمة | G:I=صافي اليوم | J:L=قيمة
      const mf = ws.addRow(['إجمالي الإيرادات', '', revTotal, 'إجمالي المصروفات', '', expTotal, 'صافي اليوم', '', '', revTotal - expTotal, '', '']);

      ws.mergeCells(`A${mf.number}:B${mf.number}`);
      ws.mergeCells(`D${mf.number}:E${mf.number}`);
      ws.mergeCells(`G${mf.number}:I${mf.number}`);
      ws.mergeCells(`J${mf.number}:${MCOL}${mf.number}`);
      // تنسيق خلايا التسمية
      [[1,ACC,BLK],[4,ACC,BLK],[7,ACC,BLK]].forEach(([ci,bg,fc]) => {
        mf.getCell(ci).fill = hFill(bg);
        mf.getCell(ci).font = {name:'Arial',bold:true,size:11,color:{argb:fc}};
        mf.getCell(ci).alignment = cAlign();
        mf.getCell(ci).border = medBorder();
      });
      // تنسيق خلايا القيمة
      [[3,SEC,WHT],[6,SEC,WHT]].forEach(([ci,bg,fc]) => {
        mf.getCell(ci).fill = hFill(bg);
        mf.getCell(ci).font = {name:'Arial',bold:true,size:12,color:{argb:fc}};
        mf.getCell(ci).alignment = cAlign();
        mf.getCell(ci).border = medBorder();
        numFmt(mf.getCell(ci));
      });
      const net = revTotal - expTotal;
      mf.getCell(10).fill = hFill(net>=0 ? 'FF1B5E20' : 'FFC00000');
      mf.getCell(10).font = {name:'Arial',bold:true,size:14,color:{argb:WHT}};
      mf.getCell(10).alignment = cAlign();
      mf.getCell(10).border = medBorder();
      numFmt(mf.getCell(10));

      ws.views = [{ state:'frozen', rightToLeft:true, xSplit:0, ySplit:3, activeCell:'A4' }];

    // =================================================================
    // ② التقرير الأسبوعي — 4 أقسام كاملة كالأصل
    // =================================================================
    } else if (currentPeriod === 'weekly') {
      const ws = wb.addWorksheet('أسبوعي');
      ws.views = [{ state:'normal', rightToLeft:true }];
      ws.columns = [
        {width:5},{width:13},{width:5},{width:5},{width:14},
        {width:16},{width:10},{width:9},{width:11},{width:10},
        {width:12},{width:14},{width:18},{width:18},{width:5}
      ];
      const MCOL = 'O';

      // ── بانر ──
      const _wkStart = new Date(from + 'T00:00:00');
      const _wkNum = Math.ceil(_wkStart.getDate() / 7);
      titleRow(ws, `التقرير المالي الأسبوعي  •  ${schoolName}`, PRI, WHT, 14, MCOL);
      const infoR = ws.addRow([`الأسبوع رقم : ${_wkNum}          الفترة الزمنية : ${from}   ←   ${to}          العام الدراسي : ${YEAR}`]);
      ws.mergeCells(`A${infoR.number}:${MCOL}${infoR.number}`);
      styleRow(infoR, SEC, WHT, true, 11); infoR.height = 22;
      ws.addRow([]);

      // ── قسم أولاً: الإيراد الأسبوعي ──
      sectionRow(ws, '①', 'أولاً : الإيراد الأسبوعي', SEC, MCOL);
      hdrRow(ws,
        ['م','اليوم','','','التاريخ','مصروفات دراسية','خصم','فايل','يونيفورم','باص','أبليكيشن','إيرادات أخرى','إجمالي الإيرادات','تراكمي',''],
        SEC, [['B','D'],['N','O']]);

      // توزيع البيانات على الأيام
      const dayMap = {};
      DAYS_AR_W.forEach(d => dayMap[d] = { fees:0,disc:0,file:0,uni:0,bus:0,app:0,other:0, date:'' });
      // getDay(): 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
      // DAYS_AR_W:  [السبت, الأحد, الاثنين, الثلاثاء, الأربعاء, الخميس]
      const DAY_MAP_IDX = {6:0, 0:1, 1:2, 2:3, 3:4, 4:5}; // Sat→0,Sun→1,...,Thu→5
      currentData.forEach(d => {
        const dDate = new Date(d.date + 'T00:00:00');
        const jsDay = dDate.getDay();
        const idx = DAY_MAP_IDX[jsDay];
        if (idx === undefined) return; // الجمعة مش في الأسبوع
        const dayAr = DAYS_AR_W[idx];
        if (dayMap[dayAr] !== undefined) {
          const m = mapAmounts(d);
          Object.keys(m).forEach(k => { if(dayMap[dayAr][k] !== undefined) dayMap[dayAr][k] += m[k]; });
          if (!dayMap[dayAr].date) dayMap[dayAr].date = d.date;
        }
      });

      const wkTotals = {fees:0,disc:0,file:0,uni:0,bus:0,app:0,other:0};
      let cumulative = 0;
      DAYS_AR_W.forEach((day, i) => {
        const dm = dayMap[day];
        const dayTotal = dm.fees + dm.file + dm.uni + dm.bus + dm.app + dm.other;
        cumulative += dayTotal;
        Object.keys(wkTotals).forEach(k => wkTotals[k] += dm[k]);
        const r = dataRow(ws,
          [i+1, day, '', '', dm.date||'',
           dm.fees||'', dm.disc||'', dm.file||'',
           dm.uni||'', dm.bus||'', dm.app||'', dm.other||'',
           dayTotal||'', cumulative||'', ''],
          i%2===1);
        ws.mergeCells(`B${r.number}:D${r.number}`);
        ws.mergeCells(`N${r.number}:O${r.number}`);
        [6,7,8,9,10,11,12,13,14].forEach(ci => { if(r.getCell(ci).value) numFmt(r.getCell(ci)); });
      });

      const wkTotal = wkTotals.fees+wkTotals.file+wkTotals.uni+wkTotals.bus+wkTotals.app+wkTotals.other;
      const tr = totalRow(ws,
        ['الإجمالي','','','','',
         wkTotals.fees, wkTotals.disc, wkTotals.file,
         wkTotals.uni, wkTotals.bus, wkTotals.app, wkTotals.other,
         wkTotal, '', ''],
        TOTBG, [['A','E'],['N','O']]);
      [6,7,8,9,10,11,12,13].forEach(ci => numFmt(tr.getCell(ci)));

      ws.addRow([]);

      // ── قسم ثانياً: المصروفات ──
      sectionRow(ws, '②', 'ثانياً : المصروفات الأسبوعية', SEC, MCOL);
      hdrRow(ws, ['م','اليوم','','','التاريخ','إجمالي المصروفات','','','','','','','','',''], SEC, [['B','D'],['F','O']]);

      const expByDay = {};
      DAYS_AR_W.forEach(d => expByDay[d] = 0);
      expensesData.forEach(e => {
        const di = new Date(e.date+'T00:00:00').getDay();
        const idx = DAY_MAP_IDX[di];
        if (idx === undefined) return;
        const dayAr = DAYS_AR_W[idx];
        if (expByDay[dayAr] !== undefined) expByDay[dayAr] += e.amount || 0;
      });

      let expGrandTotal = 0;
      DAYS_AR_W.forEach((day,i) => {
        const amt = expByDay[day] || 0;
        expGrandTotal += amt;
        const r = dataRow(ws, [i+1, day,'','','', amt||'','','','','','','','','',''], i%2===1);
        ws.mergeCells(`B${r.number}:D${r.number}`);
        ws.mergeCells(`F${r.number}:O${r.number}`);
        if (r.getCell(6).value) numFmt(r.getCell(6));
      });

      const et = totalRow(ws, ['الإجمالي','','','','',expGrandTotal,'','','','','','','','',''], TOTBG, [['A','E'],['F','O']]);
      numFmt(et.getCell(6));

      ws.addRow([]);

      // ── قسم ثالثاً: تحصيل المراحل ──
      sectionRow(ws, '③', 'ثالثاً : الموقف المالي — تحصيل المراحل', SEC, MCOL);
      hdrRow(ws,
        ['م','المرحلة','','','المديونية السابقة','','المحصل (مصروفات دراسية)','','خصومات أخوة/خاص','','المديونية الحالية','','ملاحظات','',''],
        SEC, [['B','D'],['E','F'],['G','H'],['I','J'],['K','L'],['M','O']]);

      // تجميع المصروفات الدراسية فقط لكل صف
      const gradeFeesByGrade = {};
      currentData.forEach(d => {
        const g = d.grade;
        if (!gradeFeesByGrade[g]) gradeFeesByGrade[g] = 0;
        const m = mapAmounts(d);
        gradeFeesByGrade[g] += m.fees || 0;
      });

      let stageCollected = 0;
      GRADES_LIST.forEach((grade, i) => {
        const collected = gradeFeesByGrade[grade] || 0;
        stageCollected += collected;
        const r = dataRow(ws,
          [i+1, grade,'','', 0, '', collected||'', '', 0, '', 0, '', '', '', ''],
          i%2===1);
        ws.mergeCells(`B${r.number}:D${r.number}`);
        ws.mergeCells(`E${r.number}:F${r.number}`);
        ws.mergeCells(`G${r.number}:H${r.number}`);
        ws.mergeCells(`I${r.number}:J${r.number}`);
        ws.mergeCells(`K${r.number}:L${r.number}`);
        ws.mergeCells(`M${r.number}:O${r.number}`);
        if(r.getCell(7).value) numFmt(r.getCell(7));
      });

      const st = totalRow(ws, ['الإجمالي','','','', 0,'', stageCollected,'', 0,'', 0,'','','',''], TOTBG,
        [['A','D'],['E','F'],['G','H'],['I','J'],['K','L'],['M','O']]);
      numFmt(st.getCell(7));

      ws.addRow([]);

      // ── قسم رابعاً: الموقف المالي الإجمالي ──
      sectionRow(ws, '④', 'رابعاً : الموقف المالي الإجمالي للأسبوع', SEC, MCOL);
      hdrRow(ws,
        ['المديونية السابقة','','','الإيراد الأسبوعي','','','المصروفات','','خصومات','','صافي الأسبوع','','المديونية الفعلية','',''],
        SEC, [['A','C'],['D','F'],['G','H'],['I','J'],['K','L'],['M','O']]);

      const wkNetRevenue = wkTotal - expGrandTotal;
      const mfRow = ws.addRow([0,'','', wkTotal,'','', expGrandTotal,'', 0,'', wkNetRevenue,'', 0,'','']);
      mfRow.height = 30;
      ws.mergeCells(`A${mfRow.number}:C${mfRow.number}`);
      ws.mergeCells(`D${mfRow.number}:F${mfRow.number}`);
      ws.mergeCells(`G${mfRow.number}:H${mfRow.number}`);
      ws.mergeCells(`I${mfRow.number}:J${mfRow.number}`);
      ws.mergeCells(`K${mfRow.number}:L${mfRow.number}`);
      ws.mergeCells(`M${mfRow.number}:O${mfRow.number}`);
      [[1,ACC,BLK],[4,ACC,BLK],[7,ACC,BLK],[9,ACC,BLK],[13,ACC,BLK]].forEach(([ci,bg,fc]) => {
        mfRow.getCell(ci).fill = hFill(bg);
        mfRow.getCell(ci).font = {name:'Arial',bold:true,size:13,color:{argb:fc}};
        mfRow.getCell(ci).alignment = cAlign();
        mfRow.getCell(ci).border = medBorder();
        numFmt(mfRow.getCell(ci));
      });
      // خلية صافي الأسبوع — لون حسب الإشارة
      mfRow.getCell(11).fill = hFill(wkNetRevenue >= 0 ? 'FF1B5E20' : 'FFC00000');
      mfRow.getCell(11).font = {name:'Arial',bold:true,size:14,color:{argb:WHT}};
      mfRow.getCell(11).alignment = cAlign();
      mfRow.getCell(11).border = medBorder();
      numFmt(mfRow.getCell(11));

      ws.views = [{ state:'frozen', rightToLeft:true, xSplit:0, ySplit:4, activeCell:'A5' }];

    // =================================================================
    // ③ التقرير الشهري
    // =================================================================
    } else if (currentPeriod === 'monthly' || currentPeriod === 'custom') {
      const ws = wb.addWorksheet('شهري');
      ws.views = [{ state:'normal', rightToLeft:true }];
      ws.columns = [
        {width:5},{width:15},{width:13},{width:13},{width:13},
        {width:13},{width:10},{width:13},{width:14},{width:18},{width:12}
      ];
      const MCOL = 'K';
      const monthLabel = currentPeriod === 'monthly'
        ? document.getElementById('filterMonth').value
        : `${from} — ${to}`;

      titleRow(ws, `التقرير المالي الشهري  •  ${schoolName}`, PRI, WHT, 14, MCOL);
      const infoR = ws.addRow([`الشهر : ${monthLabel}          العام الدراسي : ${YEAR}          تاريخ التصدير : ${new Date().toLocaleDateString('ar-EG')}`]);
      ws.mergeCells(`A${infoR.number}:${MCOL}${infoR.number}`);
      styleRow(infoR, SEC, WHT, true, 11); infoR.height = 22;
      ws.addRow([]);

      // ── قسم أولاً: ملخص الإيرادات ──
      sectionRow(ws, '①', 'أولاً : ملخص الإيرادات', SEC, MCOL);
      hdrRow(ws,
        ['م','الأسبوع','مصروفات دراسية','خصم','فايل','يونيفورم','باص','أبليكيشن','إيرادات أخرى','إجمالي الإيرادات','المصروفات'],
        SEC, []);

      // توزيع على 4 أسابيع ثابتة: 1-7 / 8-14 / 15-21 / 22-نهاية الشهر
      const WEEK_RANGES = [
        { key:'الأسبوع الأول  (1-7)',    from:1,  to:7  },
        { key:'الأسبوع الثاني (8-14)',   from:8,  to:14 },
        { key:'الأسبوع الثالث (15-21)', from:15, to:21 },
        { key:'الأسبوع الرابع (22-نهاية)', from:22, to:31 },
      ];
      const weekBuckets = {};
      WEEK_RANGES.forEach(w => { weekBuckets[w.key] = {fees:0,disc:0,file:0,uni:0,bus:0,app:0,other:0}; });

      currentData.forEach(d => {
        const day = new Date(d.date+'T00:00:00').getDate();
        const wr = WEEK_RANGES.find(w => day >= w.from && day <= w.to);
        if (!wr) return;
        const m = mapAmounts(d);
        Object.keys(m).forEach(k => weekBuckets[wr.key][k] += m[k]);
      });

      const expWeekBuckets = {};
      WEEK_RANGES.forEach(w => { expWeekBuckets[w.key] = 0; });
      expensesData.forEach(e => {
        const day = new Date(e.date+'T00:00:00').getDate();
        const wr = WEEK_RANGES.find(w => day >= w.from && day <= w.to);
        if (!wr) return;
        expWeekBuckets[wr.key] += e.amount || 0;
      });

      const monthTotals = {fees:0,disc:0,file:0,uni:0,bus:0,app:0,other:0};
      let monthExpTotal = 0;
      const weeks = WEEK_RANGES.map(w => w.key);
      weeks.forEach((wk,i) => {
        const wkData = weekBuckets[wk] || {};
        const wkExp = expWeekBuckets[wk] || 0;
        const wkRev = (wkData.fees||0)+(wkData.file||0)+(wkData.uni||0)+(wkData.bus||0)+(wkData.app||0)+(wkData.other||0);
        Object.keys(monthTotals).forEach(k => monthTotals[k] += wkData[k]||0);
        monthExpTotal += wkExp;
        const r = dataRow(ws,
          [i+1, wk, wkData.fees||'', wkData.disc||'', wkData.file||'',
           wkData.uni||'', wkData.bus||'', wkData.app||'', wkData.other||'', wkRev||'', wkExp||''],
          i%2===1);
        [3,4,5,6,7,8,9,10,11].forEach(ci => { if(r.getCell(ci).value) numFmt(r.getCell(ci)); });
      });

      const monthRevTotal = monthTotals.fees+monthTotals.file+monthTotals.uni+monthTotals.bus+monthTotals.app+monthTotals.other;
      const mtr = totalRow(ws,
        ['إجمالي الشهر','',
         monthTotals.fees, monthTotals.disc, monthTotals.file,
         monthTotals.uni, monthTotals.bus, monthTotals.app, monthTotals.other,
         monthRevTotal, monthExpTotal],
        TOTBG, [['A','B']]);
      [3,4,5,6,7,8,9,10,11].forEach(ci => numFmt(mtr.getCell(ci)));

      ws.addRow([]);

      // ── قسم ثانياً: تحصيل المراحل ──
      sectionRow(ws, '②', 'ثانياً : تحصيل المراحل الشهري', SEC, MCOL);
      hdrRow(ws,
        ['م','المرحلة','المديونية السابقة','المحصل (مصروفات دراسية)','خصومات','المديونية الحالية','ملاحظات','','','',''],
        SEC, [['G','K']]);

      // تجميع المصروفات الدراسية فقط لكل صف
      const gradeTotalsM = {};
      currentData.forEach(d => {
        if (!gradeTotalsM[d.grade]) gradeTotalsM[d.grade] = 0;
        const m = mapAmounts(d);
        gradeTotalsM[d.grade] += m.fees || 0;
      });
      let totalCollected = 0;
      GRADES_LIST.forEach((grade,i) => {
        const collected = gradeTotalsM[grade] || 0;
        totalCollected += collected;
        const r = dataRow(ws, [i+1, grade, '—', collected||0, '—', '—', '', '', '', '', ''], i%2===1);
        ws.mergeCells(`G${r.number}:K${r.number}`);
        if(r.getCell(4).value) numFmt(r.getCell(4));
        if (collected > 0) {
          r.getCell(4).font = {name:'Arial',bold:true,size:10,color:{argb:'FF1B5E20'}};
        }
      });

      const str = totalRow(ws, ['الإجمالي','', '—', totalCollected, '—', '—','','','','',''], TOTBG, [['A','B'],['G','K']]);
      numFmt(str.getCell(4));

      ws.addRow([]);

      // ── قسم ثالثاً: الملخص المالي الشهري ──
      sectionRow(ws, '③', 'ثالثاً : الملخص المالي الشهري الإجمالي', SEC, MCOL);

      const summaryItems = [
        ['إجمالي الإيرادات الشهرية', monthRevTotal, SEC, WHT],
        ['إجمالي المصروفات الشهرية', monthExpTotal, SEC, WHT],
        ['صافي الإيراد الشهري', monthRevTotal - monthExpTotal, monthRevTotal-monthExpTotal >= 0 ? 'FF1B5E20' : RED, WHT],
        ['عدد العمليات', currentData.length, ACC, BLK],
        ['عدد الطلاب', new Set(currentData.map(d=>d.studentName)).size, ACC, BLK],
      ];
      summaryItems.forEach(([lbl, val, bg, fc]) => {
        const sr = ws.addRow([lbl,'','','','','','','',val,'','']);
        sr.height = 26;
        ws.mergeCells(`A${sr.number}:H${sr.number}`);
        ws.mergeCells(`I${sr.number}:K${sr.number}`);
        sr.getCell(1).fill = hFill(ACC);
        sr.getCell(1).font = {name:'Arial',bold:true,size:12,color:{argb:BLK}};
        sr.getCell(1).alignment = rAlign();
        sr.getCell(1).border = medBorder();
        sr.getCell(9).fill = hFill(bg);
        sr.getCell(9).font = {name:'Arial',bold:true,size:14,color:{argb:fc}};
        sr.getCell(9).alignment = cAlign();
        sr.getCell(9).border = medBorder();
        if (typeof val === 'number') numFmt(sr.getCell(9));
      });

      ws.views = [{ state:'frozen', rightToLeft:true, xSplit:0, ySplit:4, activeCell:'A5' }];
    }

    // ── اسم الملف ──
    const periodName = periodLabels[currentPeriod];
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${periodName}_تقرير_${school?.name || 'المدرسة'}_${from}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ============================================================
  // EXPORT PDF — نفس هيكل الإكسيل بتنسيق PDF احترافي
  // ============================================================
  async function exportPDF() {
    if (currentData.length === 0) { alert('لا توجد بيانات للتصدير'); return; }

    // تحميل مكتبات jsPDF + autoTable
    async function loadScript(src) {
      return new Promise((res, rej) => {
        if (document.querySelector(`script[src="${src}"]`)) { res(); return; }
        const s = document.createElement('script');
        s.src = src; s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');

    const { jsPDF } = window.jspdf;
    const school  = SESSION.getSchool();
    const { from, to } = getDateRange();
    const periodLabels = { daily:'يومي', weekly:'أسبوعي', monthly:'شهري', custom:'مخصص' };
    const schoolName   = school?.name || 'المدرسة';
    const YEAR         = '2026/2027';

    // ألوان المدرسة
    function hexToRgb(hex) {
      hex = (hex || '#1E2D5A').replace('#','');
      const r = parseInt(hex.substring(0,2),16);
      const g = parseInt(hex.substring(2,4),16);
      const b = parseInt(hex.substring(4,6),16);
      return [r,g,b];
    }
    const PRI = hexToRgb(school?.primaryColor);
    const SEC = hexToRgb(school?.secondaryColor || '#4A6FA5');
    const ACC = hexToRgb(school?.accentColor    || '#D6E4F0');

    const total     = currentData.reduce((s,d) => s+(d.amount||0), 0);
    const totalDebt = currentData.reduce((s,d) => s+(d.debt  ||0), 0);

    const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
    const PW = doc.internal.pageSize.getWidth();   // 297
    const PH = doc.internal.pageSize.getHeight();  // 210

    // ── دالة رسم header لكل صفحة ──
    function drawPageHeader(pageNum) {
      // شريط العنوان الرئيسي
      doc.setFillColor(...PRI);
      doc.rect(10, 8, PW-20, 12, 'F');
      doc.setTextColor(255,255,255);
      doc.setFontSize(13); doc.setFont('helvetica','bold');
      const title = `${schoolName}  -  ${YEAR}  |  كشف تحصيل ${periodLabels[currentPeriod]}`;
      doc.text(title, PW-14, 16, { align:'right' });
      doc.setFontSize(8);
      doc.text(`صفحة ${pageNum}`, 14, 16, { align:'left' });

      // شريط المعلومات
      doc.setFillColor(...SEC);
      doc.rect(10, 20, PW-20, 7, 'F');
      doc.setFontSize(8.5); doc.setFont('helvetica','normal');
      const info = `الفترة: ${from}  →  ${to}   |   بواسطة: ${session.email}   |   ${new Date().toLocaleDateString('ar-EG')}`;
      doc.text(info, PW-14, 25, { align:'right' });
    }

    // ── دالة بوكس الملخص ──
    function drawSummaryBox(yStart) {
      const items = [
        { label:'إجمالي التحصيل', value: formatCurrency(total) },
        { label:'عدد العمليات',   value: String(currentData.length) },
        { label:'عدد الطلاب',     value: String(new Set(currentData.map(d=>d.studentName)).size) },
      ];
      if (totalDebt > 0) items.push({ label:'إجمالي المديونيات', value: formatCurrency(totalDebt) });
      const boxW = (PW-20) / items.length;
      items.forEach((item, i) => {
        const x = 10 + i * boxW;
        doc.setFillColor(i===0 ? PRI[0]:SEC[0], i===0 ? PRI[1]:SEC[1], i===0 ? PRI[2]:SEC[2]);
        doc.roundedRect(x+1, yStart, boxW-2, 14, 2, 2, 'F');
        doc.setTextColor(255,255,255);
        doc.setFontSize(7); doc.setFont('helvetica','normal');
        doc.text(item.label, x + boxW - 4, yStart + 5, { align:'right' });
        doc.setFontSize(11); doc.setFont('helvetica','bold');
        doc.text(item.value, x + boxW - 4, yStart + 12, { align:'right' });
      });
    }

    // ── دالة رسم عنوان قسم ──
    function sectionTitle(doc, text, y) {
      doc.setFillColor(...SEC);
      doc.rect(10, y, PW-20, 7, 'F');
      doc.setTextColor(255,255,255);
      doc.setFontSize(9); doc.setFont('helvetica','bold');
      doc.text(text, PW-14, y+5, { align:'right' });
      return y + 9;
    }

    // ── الجداول المشتركة ──
    const autoTableDefaults = {
      styles:       { font:'helvetica', fontSize:8, halign:'right', cellPadding:2.5, textColor:[30,30,30] },
      headStyles:   { fillColor:PRI, textColor:[255,255,255], fontStyle:'bold', fontSize:8.5, halign:'right' },
      alternateRowStyles: { fillColor:[...ACC] },
      footStyles:   { fillColor:PRI, textColor:[255,255,255], fontStyle:'bold', fontSize:9, halign:'right' },
      tableLineColor: [180,180,180], tableLineWidth: 0.2,
      margin: { left:10, right:10 },
    };

    // ==============================================================
    // ① يومي
    // ==============================================================
    if (currentPeriod === 'daily') {
      let pageNum = 1;
      drawPageHeader(pageNum);
      drawSummaryBox(29);

      // ── جدول الإيرادات ──
      let y = sectionTitle(doc, '① الإيرادات اليومية', 46);

      const totC = {fees:0,file:0,uni:0,bus:0,app:0,other:0};
      const bodyRows = currentData.map((d,i) => {
        const m = mapAmounts(d);
        totC.fees +=m.fees; totC.file+=m.file; totC.uni+=m.uni;
        totC.bus  +=m.bus;  totC.app+=m.app;   totC.other+=m.other;
        return [i+1, d.date, d.studentName, d.grade,
                m.fees||'-', m.file||'-', m.uni||'-', m.bus||'-', m.app||'-', m.other||'-',
                formatCurrency(d.amount), d.debt>0?formatCurrency(d.debt):'-',
                d.paymentTypeName||d.paymentType, d.receiptNumber||'-'];
      });
      const revTotal = totC.fees+totC.file+totC.uni+totC.bus+totC.app+totC.other;

      doc.autoTable({
        ...autoTableDefaults,
        startY: y,
        head: [['#','التاريخ','الطالب','الصف','مصروفات','فايل','يونيفورم','باص','أبليكيشن','أخرى','الإجمالي','المديونية','الدفع','الإيصال']],
        body: bodyRows,
        foot: [['الإجمالي','','','',
          totC.fees||'-', totC.file||'-', totC.uni||'-', totC.bus||'-', totC.app||'-', totC.other||'-',
          formatCurrency(revTotal), formatCurrency(totalDebt),'','']],
        columnStyles: {
          0:{cellWidth:8}, 1:{cellWidth:20}, 2:{cellWidth:32},
          3:{cellWidth:18}, 4:{cellWidth:18}, 5:{cellWidth:12},
          6:{cellWidth:16}, 7:{cellWidth:12}, 8:{cellWidth:16}, 9:{cellWidth:12},
          10:{cellWidth:22,fontStyle:'bold'}, 11:{cellWidth:18,textColor:[192,0,0]},
          12:{cellWidth:18}, 13:{cellWidth:20},
        },
        didDrawPage: (data) => {
          pageNum = data.pageNumber;
          drawPageHeader(pageNum);
        }
      });

      // ── الموقف المالي اليومي ──
      let yF = doc.lastAutoTable.finalY + 6;
      if (yF > PH - 30) { doc.addPage(); pageNum++; drawPageHeader(pageNum); yF = 34; }
      yF = sectionTitle(doc, '② الموقف المالي اليومي', yF);

      const expensesSnap2 = await db.collection('expenses')
        .where('schoolId','==',schoolId).where('date','==',from).get();
      let expTotal = 0;
      expensesSnap2.forEach(d => expTotal += d.data().amount||0);

      const finItems = [
        ['إجمالي الإيرادات', formatCurrency(revTotal)],
        ['إجمالي المصروفات', formatCurrency(expTotal)],
        ['صافي اليوم', formatCurrency(revTotal - expTotal)],
      ];
      doc.autoTable({
        ...autoTableDefaults,
        startY: yF,
        head: [['البيان','القيمة']],
        body: finItems,
        columnStyles: { 0:{cellWidth:80}, 1:{cellWidth:60,fontStyle:'bold'} },
        bodyStyles: { fillColor:[245,245,245] },
        didDrawPage: (data) => {
          pageNum = data.pageNumber; drawPageHeader(pageNum);
        }
      });

    // ==============================================================
    // ② أسبوعي
    // ==============================================================
    } else if (currentPeriod === 'weekly') {
      const DAYS_AR = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
      let pageNum = 1;
      drawPageHeader(pageNum);
      drawSummaryBox(29);

      const dayMap = {};
      DAYS_AR.forEach(d => dayMap[d] = {fees:0,file:0,uni:0,bus:0,app:0,other:0,date:''});
      // getDay(): 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
      // DAYS_AR:  [السبت=6, الأحد=0, الاثنين=1, الثلاثاء=2, الأربعاء=3, الخميس=4]
      const DAY_MAP_PDF = {6:0, 0:1, 1:2, 2:3, 3:4, 4:5};
      currentData.forEach(d => {
        const di = new Date(d.date+'T00:00:00').getDay();
        const idx = DAY_MAP_PDF[di];
        if (idx === undefined) return; // الجمعة مش في الأسبوع
        const dayAr = DAYS_AR[idx];
        if (dayMap[dayAr]) {
          const m = mapAmounts(d);
          Object.keys(m).forEach(k => { if(dayMap[dayAr][k] !== undefined) dayMap[dayAr][k] += m[k]; });
          if (!dayMap[dayAr].date) dayMap[dayAr].date = d.date;
        }
      });

      const wkT = {fees:0,file:0,uni:0,bus:0,app:0,other:0};
      let cumulative = 0;
      const wkRows = DAYS_AR.map((day,i) => {
        const dm = dayMap[day];
        const dt = dm.fees+dm.file+dm.uni+dm.bus+dm.app+dm.other;
        cumulative += dt;
        Object.keys(wkT).forEach(k => wkT[k]+=dm[k]);
        return [i+1, day, dm.date||'-', dm.fees||'-', dm.file||'-', dm.uni||'-',
                dm.bus||'-', dm.app||'-', dm.other||'-',
                dt ? formatCurrency(dt):'-', formatCurrency(cumulative)];
      });
      const wkTotal = wkT.fees+wkT.file+wkT.uni+wkT.bus+wkT.app+wkT.other;

      let y = sectionTitle(doc, '① الإيراد الأسبوعي', 46);
      doc.autoTable({
        ...autoTableDefaults, startY: y,
        head: [['#','اليوم','التاريخ','مصروفات','فايل','يونيفورم','باص','أبليكيشن','أخرى','إجمالي اليوم','تراكمي']],
        body: wkRows,
        foot: [['الإجمالي','','', wkT.fees||'-', wkT.file||'-', wkT.uni||'-', wkT.bus||'-', wkT.app||'-', wkT.other||'-', formatCurrency(wkTotal),'']],
        didDrawPage: d => { pageNum = d.pageNumber; drawPageHeader(pageNum); }
      });

      // تحصيل المراحل
      let y2 = doc.lastAutoTable.finalY + 6;
      if (y2 > PH-40) { doc.addPage(); pageNum++; drawPageHeader(pageNum); y2=34; }
      y2 = sectionTitle(doc, '② تحصيل المراحل الأسبوعي', y2);
      const GRADES_LIST2 = ['Pre-KG','KG1','KG2','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Prep 1','Prep 2','Prep 3'];
      const gradeFees2 = {};
      currentData.forEach(d => {
        const m = mapAmounts(d);
        gradeFees2[d.grade] = (gradeFees2[d.grade]||0) + (m.fees||0);
      });
      let stageTotal2 = 0;
      const gradeRows2 = GRADES_LIST2.map((g,i) => {
        const c = gradeFees2[g]||0; stageTotal2+=c;
        return [i+1, g, '-', c?formatCurrency(c):'-', '-', '-'];
      });
      doc.autoTable({
        ...autoTableDefaults, startY: y2,
        head: [['#','المرحلة','المديونية السابقة','المحصل (مصروفات دراسية)','خصومات','ملاحظات']],
        body: gradeRows2,
        foot: [['الإجمالي','','-',formatCurrency(stageTotal2),'-','']],
        didDrawPage: d => { pageNum = d.pageNumber; drawPageHeader(pageNum); }
      });

    // ==============================================================
    // ③ شهري / مخصص
    // ==============================================================
    } else {
      const GRADES_LIST3 = ['Pre-KG','KG1','KG2','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Prep 1','Prep 2','Prep 3'];
      let pageNum = 1;
      drawPageHeader(pageNum);
      drawSummaryBox(29);

      // توزيع أسابيع
      const weekBuckets = {};
      currentData.forEach(d => {
        const wk = `الأسبوع ${Math.ceil(new Date(d.date+'T00:00:00').getDate()/7)}`;
        if (!weekBuckets[wk]) weekBuckets[wk] = {fees:0,disc:0,file:0,uni:0,bus:0,app:0,other:0};
        // استخدم mapAmounts للتوزيع الصحيح
        const m = mapAmounts(d);
        Object.keys(m).forEach(k => { if(weekBuckets[wk][k] !== undefined) weekBuckets[wk][k] += m[k]; });
      });

      const monthTotals = {fees:0,file:0,uni:0,bus:0,app:0,other:0};
      const wkRows3 = Object.entries(weekBuckets).map(([wk,wb2],i) => {
        const rev = wb2.fees+wb2.file+wb2.uni+wb2.bus+wb2.app+wb2.other;
        Object.keys(monthTotals).forEach(k => monthTotals[k]+=wb2[k]||0);
        return [i+1, wk, wb2.fees||'-', wb2.file||'-', wb2.uni||'-',
                wb2.bus||'-', wb2.app||'-', wb2.other||'-',
                rev ? formatCurrency(rev):'-'];
      });
      const mRev = monthTotals.fees+monthTotals.file+monthTotals.uni+monthTotals.bus+monthTotals.app+monthTotals.other;

      let y3 = sectionTitle(doc, '① ملخص الإيرادات الشهرية بالأسابيع', 46);
      doc.autoTable({
        ...autoTableDefaults, startY: y3,
        head: [['#','الأسبوع','مصروفات','فايل','يونيفورم','باص','أبليكيشن','أخرى','إجمالي الأسبوع']],
        body: wkRows3,
        foot: [['الإجمالي','',
          monthTotals.fees||'-', monthTotals.file||'-', monthTotals.uni||'-',
          monthTotals.bus||'-',  monthTotals.app||'-',  monthTotals.other||'-',
          formatCurrency(mRev)]],
        didDrawPage: d => { pageNum = d.pageNumber; drawPageHeader(pageNum); }
      });

      // تحصيل المراحل
      let y4 = doc.lastAutoTable.finalY + 6;
      if (y4 > PH-50) { doc.addPage(); pageNum++; drawPageHeader(pageNum); y4=34; }
      y4 = sectionTitle(doc, '② تحصيل المراحل الشهري', y4);
      const gradeFees3 = {};
      currentData.forEach(d => {
        const m = mapAmounts(d);
        gradeFees3[d.grade] = (gradeFees3[d.grade]||0) + (m.fees||0);
      });
      let totalCollected3 = 0;
      const gradeRows3 = GRADES_LIST3.map((g,i) => {
        const c = gradeFees3[g]||0; totalCollected3+=c;
        return [i+1, g, '-', c?formatCurrency(c):'-', '-', ''];
      });
      doc.autoTable({
        ...autoTableDefaults, startY: y4,
        head: [['#','المرحلة','المديونية السابقة','المحصل (مصروفات دراسية)','خصومات','ملاحظات']],
        body: gradeRows3,
        foot: [['الإجمالي','','-',formatCurrency(totalCollected3),'-','']],
        didDrawPage: d => { pageNum = d.pageNumber; drawPageHeader(pageNum); }
      });

      // ملخص مالي
      let y5 = doc.lastAutoTable.finalY + 6;
      if (y5 > PH-50) { doc.addPage(); pageNum++; drawPageHeader(pageNum); y5=34; }
      y5 = sectionTitle(doc, '③ الملخص المالي الشهري', y5);

      // جلب إجمالي المصروفات
      let mExpTotal = 0;
      try {
        const eSnap = await db.collection('expenses')
          .where('schoolId','==',schoolId).where('date','>=',from).where('date','<=',to).get();
        eSnap.forEach(d => mExpTotal+=d.data().amount||0);
      } catch(e) {}

      doc.autoTable({
        ...autoTableDefaults, startY: y5,
        head: [['البيان','القيمة']],
        body: [
          ['إجمالي الإيرادات الشهرية', formatCurrency(mRev)],
          ['إجمالي المصروفات الشهرية', formatCurrency(mExpTotal)],
          ['صافي الإيراد الشهري',       formatCurrency(mRev - mExpTotal)],
          ['عدد العمليات',              String(currentData.length)],
          ['عدد الطلاب',                String(new Set(currentData.map(d=>d.studentName)).size)],
        ],
        columnStyles: { 0:{cellWidth:100}, 1:{cellWidth:80,fontStyle:'bold'} },
        bodyStyles: { fillColor:[245,245,245] },
        didDrawPage: d => { pageNum = d.pageNumber; drawPageHeader(pageNum); }
      });
    }

    // ── حفظ الملف ──
    const fname = `${periodLabels[currentPeriod]}_تقرير_${schoolName}_${from}.pdf`;
    doc.save(fname);
  }

  // ============================================================
  // EDIT TRANSACTION MODAL — من صفحة التقارير
  // ============================================================
  let editingTxId = null;

  async function openEditTxModal(id) {
    try {
      const docSnap = await db.collection('transactions').doc(id).get();
      if (!docSnap.exists) return alert('لم يتم العثور على السجل');
      const d = docSnap.data();
      editingTxId = id;

      // بيانات الطالب
      document.getElementById('etStudentName').value    = d.studentName   || '';
      document.getElementById('etGrade').value          = d.grade         || '';
      document.getElementById('etDate').value           = d.date          || '';
      document.getElementById('etAmount').value         = d.amount        || '';
      document.getElementById('etPaymentType').value    = d.paymentType   || '';
      document.getElementById('etPaymentItem').value    = d.paymentItem   || '';
      document.getElementById('etReceiptNumber').value  = d.receiptNumber || '';
      document.getElementById('etNotes').value          = d.notes         || '';

      // عنوان المودال يبيّن اسم الطالب والتاريخ
      document.getElementById('etModalTitle').textContent = `✏ تعديل: ${d.studentName} — ${d.date}`;

      document.getElementById('editTxModal').style.display = 'flex';
    } catch(err) {
      alert('خطأ في تحميل البيانات: ' + err.message);
    }
  }

  function closeEditTxModal() {
    document.getElementById('editTxModal').style.display = 'none';
    editingTxId = null;
  }

  async function saveEditTx() {
    if (!editingTxId) return;

    const studentName   = document.getElementById('etStudentName').value.trim();
    const grade         = document.getElementById('etGrade').value.trim();
    const date          = document.getElementById('etDate').value;
    const amount        = parseFloat(document.getElementById('etAmount').value);
    const paymentType   = document.getElementById('etPaymentType').value;
    const paymentItem   = document.getElementById('etPaymentItem').value.trim();
    const receiptNumber = document.getElementById('etReceiptNumber').value.trim();
    const notes         = document.getElementById('etNotes').value.trim();

    if (!studentName)          return showEtAlert('ادخل اسم الطالب');
    if (!amount || amount <= 0) return showEtAlert('ادخل مبلغ صحيح');
    if (!date)                  return showEtAlert('اختر التاريخ');
    if (!paymentType)           return showEtAlert('اختر طريقة الدفع');
    if (!receiptNumber)         return showEtAlert('ادخل رقم الإيصال');

    const btn = document.getElementById('etSaveBtn');
    btn.disabled = true; btn.textContent = 'جاري الحفظ...';

    try {
      // جيب بيانات الـ transaction الأصلية عشان نعرف totalDue
      const origSnap = await db.collection('transactions').doc(editingTxId).get();
      const orig = origSnap.data();
      const totalDue = orig.totalDue || orig.amount || amount; // المبلغ المطلوب الأصلي
      const newDebt = Math.max(0, totalDue - amount);
      const hadDebt = Math.max(0, totalDue - (orig.amount || amount));

      // حفظ التعديل على الـ transaction
      await db.collection('transactions').doc(editingTxId).update({
        studentName, grade, date, amount, paymentType,
        paymentTypeName: PAYMENT_TYPES.find(p => p.value === paymentType)?.label || paymentType,
        paymentItem, receiptNumber, notes,
        debt: newDebt,
        hasDebt: newDebt > 0,
        editedBy: session.email,
        editedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      // ===== مزامنة مع debts collection =====
      if (newDebt > 0) {
        // ابحث عن debt مفتوح لنفس الطالب ونفس البند
        const existingDebtSnap = await db.collection('debts')
          .where('schoolId',    '==', schoolId)
          .where('studentName', '==', studentName)
          .where('paymentItem', '==', paymentItem)
          .get();

        const openDebts = existingDebtSnap.docs.filter(d => (d.data().remaining || 0) > 0);

        if (openDebts.length > 0) {
          // حدّث الـ debt الموجود — فقط غيّر الـ remaining بالفرق
          const existingDebt = openDebts[0];
          const prevData = existingDebt.data();
          // الفرق بين الـ debt القديم (من التعديل السابق) والجديد
          const oldDebtFromThisTx = hadDebt; // الدين القديم من نفس الـ tx
          const diff = newDebt - oldDebtFromThisTx;
          await db.collection('debts').doc(existingDebt.id).update({
            paid:      Math.max(0, (prevData.paid      || 0) - diff),
            remaining: Math.max(0, (prevData.remaining || 0) + diff),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          // أنشئ debt جديد
          await db.collection('debts').add({
            schoolId,
            studentName,
            grade,
            stage:       orig.stage       || '',
            stageName:   orig.stageName   || '',
            paymentItem,
            totalDue,
            paid:        amount,
            remaining:   newDebt,
            date,
            hasDebt:     true,
            createdAt:   firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt:   firebase.firestore.FieldValue.serverTimestamp(),
            sourceEditedTx: editingTxId
          });
        }
      } else if (hadDebt > 0 && newDebt === 0) {
        // كان عنده debt وبقى مسدد — صفّر الـ remaining
        const existingDebtSnap = await db.collection('debts')
          .where('schoolId',    '==', schoolId)
          .where('studentName', '==', studentName)
          .where('paymentItem', '==', paymentItem)
          .get();
        const openDebts = existingDebtSnap.docs.filter(d => (d.data().remaining || 0) > 0);
        if (openDebts.length > 0) {
          await db.collection('debts').doc(openDebts[0].id).update({
            remaining: 0,
            paid: totalDue,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      }
      // ===== نهاية مزامنة debts =====

      // تحديث currentData في الذاكرة
      const idx = currentData.findIndex(d => d.id === editingTxId);
      if (idx !== -1) {
        currentData[idx] = { ...currentData[idx], studentName, grade, date, amount, paymentType,
          paymentTypeName: PAYMENT_TYPES.find(p => p.value === paymentType)?.label || paymentType,
          paymentItem, receiptNumber, notes, debt: newDebt, hasDebt: newDebt > 0 };
      }

      closeEditTxModal();
      renderTable();
    } catch(err) {
      showEtAlert('خطأ في الحفظ: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'حفظ التعديلات';
    }
  }

  function showEtAlert(msg) {
    const el = document.getElementById('etAlert');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
  }

</script>

<!-- ====== EDIT TRANSACTION MODAL ====== -->
<div id="editTxModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;align-items:center;justify-content:center;padding:1rem">
  <div style="background:#fff;border-radius:14px;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;padding:1.75rem;direction:rtl;font-family:Cairo,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,0.3)">

    <!-- Header -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;padding-bottom:0.75rem;border-bottom:2px solid var(--border)">
      <h2 id="etModalTitle" style="font-size:1.05rem;font-weight:800;color:var(--primary);margin:0"></h2>
      <button onclick="closeEditTxModal()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:#aaa;line-height:1">✕</button>
    </div>

    <!-- Alert -->
    <div id="etAlert" style="display:none;background:#fdecea;color:#c0392b;border:1px solid #f5c6cb;border-radius:6px;padding:0.6rem 0.9rem;font-size:0.85rem;margin-bottom:1rem"></div>

    <!-- Fields -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.85rem">

      <div style="display:flex;flex-direction:column;gap:5px">
        <label style="font-size:0.82rem;font-weight:700;color:#333">اسم الطالب <span style="color:#e74c3c">*</span></label>
        <input id="etStudentName" type="text" class="form-input form-input-ar" placeholder="الاسم كاملاً" />
      </div>

      <div style="display:flex;flex-direction:column;gap:5px">
        <label style="font-size:0.82rem;font-weight:700;color:#333">الصف</label>
        <input id="etGrade" type="text" class="form-input" placeholder="مثال: Grade 3" />
      </div>

      <div style="display:flex;flex-direction:column;gap:5px">
        <label style="font-size:0.82rem;font-weight:700;color:#333">التاريخ <span style="color:#e74c3c">*</span></label>
        <input id="etDate" type="date" class="form-input" />
      </div>

      <div style="display:flex;flex-direction:column;gap:5px">
        <label style="font-size:0.82rem;font-weight:700;color:#333">المبلغ المدفوع (ج.م) <span style="color:#e74c3c">*</span></label>
        <input id="etAmount" type="number" class="form-input" placeholder="0" min="0" step="0.01" />
      </div>

      <div style="display:flex;flex-direction:column;gap:5px">
        <label style="font-size:0.82rem;font-weight:700;color:#333">طريقة الدفع <span style="color:#e74c3c">*</span></label>
        <select id="etPaymentType" class="form-select">
          <option value="">اختر</option>
          <option value="cash">نقدي</option>
          <option value="bank_transfer">تحويل بنكي</option>
          <option value="check">شيك</option>
          <option value="instapay">إنستاباي</option>
        </select>
      </div>

      <div style="display:flex;flex-direction:column;gap:5px">
        <label style="font-size:0.82rem;font-weight:700;color:#333">رقم الإيصال <span style="color:#e74c3c">*</span></label>
        <input id="etReceiptNumber" type="text" class="form-input" placeholder="REC-2026-001" />
      </div>

      <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:5px">
        <label style="font-size:0.82rem;font-weight:700;color:#333">بند الدفع</label>
        <input id="etPaymentItem" type="text" class="form-input form-input-ar" placeholder="مثال: مصروفات دراسية + باص" />
        <div style="font-size:0.73rem;color:#888">لو بنود متعددة اكتبها بـ + بينهم</div>
      </div>

      <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:5px">
        <label style="font-size:0.82rem;font-weight:700;color:#333">ملاحظات</label>
        <textarea id="etNotes" class="form-textarea" rows="2" placeholder="أي ملاحظات إضافية..."></textarea>
      </div>

    </div>

    <!-- Buttons -->
    <div style="display:flex;gap:0.75rem;margin-top:1.4rem">
      <button id="etSaveBtn" onclick="saveEditTx()" class="btn btn-primary" style="flex:1;font-size:0.95rem">💾 حفظ التعديلات</button>
      <button onclick="closeEditTxModal()" class="btn btn-secondary" style="padding:0 1.5rem">إلغاء</button>
    </div>

  </div>
</div>

</body>
</html>
