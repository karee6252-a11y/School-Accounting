<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a3a6b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="School System" />

  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<title>تسجيل الدخول - نظام المحاسبة المدرسية</title>
  <link rel="stylesheet" href="styles.css?v=2.6" />
  <style>
    .school-selector-section { margin-bottom: 1.5rem; }
    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-light);
      margin-bottom: 0.75rem;
    }
    .school-option { position: relative; }
    .school-option .color-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .school-option.active::after {
      content: 'v';
      position: absolute;
      left: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      font-weight: 900;
      font-size: 0.9rem;
    }
    .pwd-wrapper { position: relative; }
    .pwd-toggle {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-light);
      font-size: 1rem;
      padding: 0;
      line-height: 1;
    }
    .login-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: var(--text-light);
      font-size: 0.75rem;
    }
    .login-divider::before, .login-divider::after {
      content: 'v';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .admin-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-light);
    }
    .admin-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }
    .admin-link a:hover { text-decoration: underline; }
    .selected-school-preview {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      background: var(--accent);
      border: 2px solid var(--primary-light);
      margin-bottom: 1.25rem;
      opacity: 0;
      transition: var(--transition);
      pointer-events: none;
    }
    .selected-school-preview.show { opacity: 1; }
    .selected-school-preview img { width: 36px; height: 36px; object-fit: contain; border-radius: 6px; }
    .selected-school-preview-name { font-size: 0.875rem; font-weight: 700; color: var(--primary); }
    .admin-toggle-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-light);
      margin-bottom: 1rem;
    }
    .admin-mode-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      background: #fff3cd;
      color: #856404;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      border: 1px solid #ffc107;
    }
  </style>
</head>
<body>

<div class="login-page">
  <div class="login-wrapper">
    <div class="login-card">

      <!-- Header -->
      <div class="login-header">
        <div class="login-logo-area" id="schoolLogos"></div>
        <h1 class="login-title">نظام المحاسبة المدرسية</h1>
        <p class="login-subtitle">تسجيل الدخول للمحاسبين</p>
      </div>

      <!-- Alert -->
      <div class="alert alert-error hidden" id="loginAlert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="loginAlertMsg"></span>
      </div>

      <!-- Admin mode indicator -->
      <div class="admin-toggle-area" id="adminModeArea" style="display:none">
        <span class="admin-mode-badge">وضع الأدمن</span>
        <span>الدخول على كل المدارس</span>
      </div>

      <!-- School Selector -->
      <div class="school-selector-section" id="schoolSelectorSection">
        <div class="section-label">اختر المدرسة</div>
        <div class="school-selector" id="schoolSelector"></div>
      </div>

      <!-- Selected School Preview -->
      <div class="selected-school-preview" id="selectedPreview">
        <img id="previewLogo" src="" alt="" />
        <span class="selected-school-preview-name" id="previewName"></span>
      </div>

      <!-- Login Form -->
      <div>
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني <span class="required">*</span></label>
          <input
            type="email"
            class="form-input"
            id="emailInput"
            placeholder="example@school.com"
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label">كلمة المرور <span class="required">*</span></label>
          <div class="pwd-wrapper">
            <input
              type="password"
              class="form-input"
              id="passwordInput"
              placeholder="••••••••"
              style="padding-left: 2.5rem;"
              autocomplete="current-password"
            />
            <button class="pwd-toggle" onclick="togglePassword()" type="button" id="pwdToggleBtn">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-check mb-2">
          <input type="checkbox" id="rememberMe" checked />
          <label for="rememberMe">تذكرني</label>
        </div>

        <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">
          <span id="loginBtnText">تسجيل الدخول</span>
          <span id="loginBtnLoader" class="hidden">جاري...</span>
        </button>
      </div>

      <div class="admin-link">
        <p>للأدمن فقط: <a href="#" onclick="toggleAdminMode(event)">الدخول كأدمن</a></p>
      </div>

    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=2.7"></script>
<script src="/pwa.js?v=8"></script>
<script>
  let selectedSchool = null;
  let isAdminMode = false;

  function renderSchools() {
    const selector = document.getElementById('schoolSelector');
    selector.innerHTML = '';
    Object.values(SCHOOLS).forEach(school => {
      const div = document.createElement('div');
      div.className = 'school-option';
      div.dataset.id = school.id;
      div.innerHTML = `
        <img src="${school.logo}" alt="${school.name}" onerror="this.style.display='none'" />
        <span class="color-dot" style="background:${school.primaryColor}"></span>
        <span class="school-option-name">${school.name}</span>
      `;
      div.addEventListener('click', () => selectSchool(school));
      selector.appendChild(div);
    });
  }

  function selectSchool(school) {
    selectedSchool = school;
    document.querySelectorAll('.school-option').forEach(el => el.classList.remove('active'));
    document.querySelector(`[data-id="${school.id}"]`).classList.add('active');
    document.getElementById('previewLogo').src = school.logo;
    document.getElementById('previewName').textContent = school.name;
    document.getElementById('selectedPreview').classList.add('show');
    document.documentElement.style.setProperty('--primary', school.primaryColor);
    document.documentElement.style.setProperty('--secondary', school.secondaryColor);
    document.documentElement.style.setProperty('--accent', school.accentColor);
  }

  function toggleAdminMode(e) {
    e.preventDefault();
    isAdminMode = !isAdminMode;
    const schoolSection   = document.getElementById('schoolSelectorSection');
    const adminArea       = document.getElementById('adminModeArea');
    const selectedPreview = document.getElementById('selectedPreview');

    if (isAdminMode) {
      schoolSection.style.display = 'none';
      selectedPreview.classList.remove('show');
      adminArea.style.display = 'flex';
      document.documentElement.style.setProperty('--primary', '#1a3a6b');
      document.documentElement.style.setProperty('--secondary', '#c8a951');
      document.documentElement.style.setProperty('--accent', '#e8f0fe');
    } else {
      schoolSection.style.display = 'block';
      adminArea.style.display = 'none';
    }
  }

  function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon  = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      input.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  function showAlert(msg, type = 'error') {
    const alert = document.getElementById('loginAlert');
    const msgEl = document.getElementById('loginAlertMsg');
    alert.className = `alert alert-${type}`;
    msgEl.textContent = msg;
    alert.classList.remove('hidden');
    setTimeout(() => alert.classList.add('hidden'), 5000);
  }

  async function handleLogin() {
    const email    = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const btn      = document.getElementById('loginBtn');
    const btnText  = document.getElementById('loginBtnText');
    const btnLoader= document.getElementById('loginBtnLoader');

    if (!email || !password) {
      showAlert('من فضلك ادخل البريد الإلكتروني وكلمة المرور');
      return;
    }
    if (!isAdminMode && !selectedSchool) {
      showAlert('من فضلك اختر المدرسة أولاً');
      return;
    }

    btn.disabled = true;
    btnText.textContent = 'جاري الدخول...';
    btnLoader.classList.remove('hidden');

    try {
      const remember = !!document.getElementById('rememberMe')?.checked;
      // Firebase: LOCAL يخلي الدخول يفضل بعد إغلاق الـ PWA
      await auth.setPersistence(
        remember
          ? firebase.auth.Auth.Persistence.LOCAL
          : firebase.auth.Auth.Persistence.SESSION
      );

      const result = await auth.signInWithEmailAndPassword(email, password);
      const user = result.user;

      const saveRememberMeta = (schoolId) => {
        try {
          if (remember) {
            localStorage.setItem('remembered_email', email);
            if (schoolId) localStorage.setItem('remembered_school', schoolId);
            localStorage.setItem(SESSION_PERSIST_KEY, '1');
          } else {
            localStorage.removeItem('remembered_email');
            localStorage.removeItem('remembered_school');
            localStorage.setItem(SESSION_PERSIST_KEY, '0');
          }
        } catch (_) { /* ignore */ }
      };

      // ── ADMIN ──
      if (ADMINS.includes(email)) {
        const schoolId = isAdminMode
          ? Object.keys(SCHOOLS)[0]
          : (selectedSchool?.id || Object.keys(SCHOOLS)[0]);
        SESSION.set(
          { uid: user.uid, email, role: 'admin', schoolId, name: 'مدير النظام' },
          { persist: remember }
        );
        saveRememberMeta(schoolId);
        window.location.href = 'admin.html';
        return;
      }

      if (!selectedSchool) {
        showAlert('من فضلك اختر المدرسة');
        return;
      }

      // ── HR ──
      if (selectedSchool.hrUsers?.includes(email)) {
        SESSION.set({
          uid: user.uid, email, role: 'hr',
          schoolId: selectedSchool.id,
          schoolName: selectedSchool.name,
          name: email.split('@')[0]
        }, { persist: remember });
        saveRememberMeta(selectedSchool.id);
        window.location.href = 'hr.html';
        return;
      }

      // ── شئون الطلاب ──
      if (selectedSchool.shu2onUsers?.includes(email)) {
        SESSION.set({
          uid: user.uid, email, role: 'shu2on',
          schoolId: selectedSchool.id,
          schoolName: selectedSchool.name,
          name: email.split('@')[0]
        }, { persist: remember });
        saveRememberMeta(selectedSchool.id);
        window.location.href = 'student-affairs.html';
        return;
      }

      // ── الموردون والمقاولون ──
      if (selectedSchool.contractorsUsers?.includes(email)) {
        SESSION.set({
          uid: user.uid, email, role: 'contractors',
          schoolId: selectedSchool.id,
          schoolName: selectedSchool.name,
          name: email.split('@')[0]
        }, { persist: remember });
        saveRememberMeta(selectedSchool.id);
        window.location.href = 'contractors.html';
        return;
      }

      // ── ACCOUNTANT ──
      if (!selectedSchool.users.includes(email)) {
        showAlert('هذا الحساب غير مصرح له بالدخول على هذه المدرسة');
        auth.signOut();
        return;
      }

      SESSION.set({
        uid: user.uid, email, role: 'accountant',
        schoolId: selectedSchool.id,
        schoolName: selectedSchool.name,
        name: email.split('@')[0]
      }, { persist: remember });
      saveRememberMeta(selectedSchool.id);

      window.location.href = 'dashboard.html';

    } catch (error) {
      let msg = 'حدث خطأ في تسجيل الدخول';
      if (error.code === 'auth/user-not-found')              msg = 'البريد الإلكتروني غير مسجل';
      else if (error.code === 'auth/wrong-password')         msg = 'كلمة المرور غير صحيحة';
      else if (error.code === 'auth/too-many-requests')      msg = 'تم تجاوز عدد المحاولات، حاول لاحقاً';
      else if (error.code === 'auth/network-request-failed') msg = 'تحقق من الاتصال بالإنترنت';
      showAlert(msg);
    } finally {
      btn.disabled = false;
      btnText.textContent = 'تسجيل الدخول';
      btnLoader.classList.add('hidden');
    }
  }

  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });

  // PWA الإجباري + الأيقونة من pwa.js
  if (window.MohasbaPWA) MohasbaPWA.init();

  renderSchools();

  const rememberedEmail  = localStorage.getItem('remembered_email');
  const rememberedSchool = localStorage.getItem('remembered_school');
  if (rememberedEmail) {
    document.getElementById('emailInput').value = rememberedEmail;
    document.getElementById('rememberMe').checked = true;
  }
  if (rememberedSchool && SCHOOLS[rememberedSchool]) {
    selectSchool(SCHOOLS[rememberedSchool]);
  }

  function redirectBySession(session) {
    if (!session) return;
    if (session.role === 'admin') window.location.href = 'admin.html';
    else if (session.role === 'hr') window.location.href = 'hr.html';
    else if (session.role === 'shu2on') window.location.href = 'student-affairs.html';
    else if (session.role === 'contractors') window.location.href = 'contractors.html';
    else window.location.href = 'dashboard.html';
  }

  // جلسة محفوظة (تذكرني / PWA) → دخول مباشر
  const session = SESSION.get();
  if (session) {
    redirectBySession(session);
  } else {
    // Firebase لسه مسجّل (LOCAL) لكن الـ SESSION اتمسحت → ابنِ الجلسة وكمّل
    auth.onAuthStateChanged((user) => {
      if (!user) return;
      if (SESSION.get()) {
        redirectBySession(SESSION.get());
        return;
      }
      const rebuilt = buildSessionFromUser(user);
      if (rebuilt) {
        SESSION.set(rebuilt, { persist: SESSION.shouldPersist() });
        redirectBySession(rebuilt);
      }
    });
  }
</script>
</body>
</html>
