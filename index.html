<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a3a6b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="المحاسبة" />

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />
  <link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128.png" />

  <!-- iOS Splash Screens -->
  <link rel="apple-touch-startup-image" href="/icons/splash-iphone-14-pro-max.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/icons/splash-iphone-14-pro.png"     media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/icons/splash-iphone-12-14.png"      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/icons/splash-iphone-xr-11.png"      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
  <link rel="apple-touch-startup-image" href="/icons/splash-iphone-8.png"          media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
  <link rel="apple-touch-startup-image" href="/icons/splash-ipad-pro-11.png"       media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2)" />
  <link rel="apple-touch-startup-image" href="/icons/splash-ipad-pro-12.png"       media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" />
<title>تسجيل الدخول - نظام المحاسبة المدرسية</title>
  <link rel="stylesheet" href="styles.css?v=1.1" />
  <style>
    .login-page { background: linear-gradient(135deg, #1a2a4a 0%, #0d1b35 60%, #050d1a 100%); }
    .school-selector-section { margin-bottom: 1.5rem; }
    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-light);
      margin-bottom: 0.75rem;
    }
    .school-option { position: relative; }
    .school-option .color-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .school-option.active::after {
      content: 'v';
      position: absolute;
      left: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      font-weight: 900;
      font-size: 0.9rem;
    }
    .pwd-wrapper { position: relative; }
    .pwd-toggle {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-light);
      font-size: 1rem;
      padding: 0;
      line-height: 1;
    }
    .login-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: var(--text-light);
      font-size: 0.75rem;
    }
    .login-divider::before, .login-divider::after {
      content: 'v';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .admin-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-light);
    }
    .admin-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }
    .admin-link a:hover { text-decoration: underline; }
    .selected-school-preview {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      background: var(--accent);
      border: 2px solid var(--primary-light);
      margin-bottom: 1.25rem;
      opacity: 0;
      transition: var(--transition);
      pointer-events: none;
    }
    .selected-school-preview.show { opacity: 1; }
    .selected-school-preview img { width: 36px; height: 36px; object-fit: contain; border-radius: 6px; }
    .selected-school-preview-name { font-size: 0.875rem; font-weight: 700; color: var(--primary); }
    .admin-toggle-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-light);
      margin-bottom: 1rem;
    }
    .admin-mode-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      background: #fff3cd;
      color: #856404;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      border: 1px solid #ffc107;
    }
  </style>
</head>
<body>

<div class="login-page">
  <div class="login-wrapper">
    <div class="login-card">

      <!-- Header -->
      <div class="login-header">
        <div class="login-logo-area" id="schoolLogos"></div>
        <h1 class="login-title">نظام المحاسبة المدرسية</h1>
        <p class="login-subtitle">تسجيل الدخول للمحاسبين</p>
      </div>

      <!-- Alert -->
      <div class="alert alert-error hidden" id="loginAlert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="loginAlertMsg"></span>
      </div>

      <!-- Admin mode indicator -->
      <div class="admin-toggle-area" id="adminModeArea" style="display:none">
        <span class="admin-mode-badge">وضع الأدمن</span>
        <span>الدخول على كل المدارس</span>
      </div>

      <!-- School Selector -->
      <div class="school-selector-section" id="schoolSelectorSection">
        <div class="section-label">اختر المدرسة</div>
        <div class="school-selector" id="schoolSelector"></div>
      </div>

      <!-- Selected School Preview -->
      <div class="selected-school-preview" id="selectedPreview">
        <img id="previewLogo" src="" alt="" />
        <span class="selected-school-preview-name" id="previewName"></span>
      </div>

      <!-- Login Form -->
      <div>
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني <span class="required">*</span></label>
          <input
            type="email"
            class="form-input"
            id="emailInput"
            placeholder="example@school.com"
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label">كلمة المرور <span class="required">*</span></label>
          <div class="pwd-wrapper">
            <input
              type="password"
              class="form-input"
              id="passwordInput"
              placeholder="••••••••"
              style="padding-left: 2.5rem;"
              autocomplete="current-password"
            />
            <button class="pwd-toggle" onclick="togglePassword()" type="button" id="pwdToggleBtn">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-check mb-2">
          <input type="checkbox" id="rememberMe" />
          <label for="rememberMe">تذكرني</label>
        </div>

        <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">
          <span id="loginBtnText">تسجيل الدخول</span>
          <span id="loginBtnLoader" class="hidden">جاري...</span>
        </button>
      </div>

      <div class="admin-link">
        <p>للأدمن فقط: <a href="#" onclick="toggleAdminMode(event)">الدخول كأدمن</a></p>
      </div>

    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  let selectedSchool = null;
  let isAdminMode = false;

  function renderSchools() {
    const selector = document.getElementById('schoolSelector');
    selector.innerHTML = '';
    Object.values(SCHOOLS).forEach(school => {
      const div = document.createElement('div');
      div.className = 'school-option';
      div.dataset.id = school.id;
      div.innerHTML = `
        <img src="${school.logo}" alt="${school.name}" onerror="this.style.display='none'" />
        <span class="color-dot" style="background:${school.primaryColor}"></span>
        <span class="school-option-name">${school.name}</span>
      `;
      div.addEventListener('click', () => selectSchool(school));
      selector.appendChild(div);
    });
  }

  function selectSchool(school) {
    selectedSchool = school;
    document.querySelectorAll('.school-option').forEach(el => el.classList.remove('active'));
    document.querySelector(`[data-id="${school.id}"]`).classList.add('active');
    document.getElementById('previewLogo').src = school.logo;
    document.getElementById('previewName').textContent = school.name;
    document.getElementById('selectedPreview').classList.add('show');
    document.documentElement.style.setProperty('--primary', school.primaryColor);
    document.documentElement.style.setProperty('--secondary', school.secondaryColor);
    document.documentElement.style.setProperty('--accent', school.accentColor);
  }

  function toggleAdminMode(e) {
    e.preventDefault();
    isAdminMode = !isAdminMode;
    const schoolSection   = document.getElementById('schoolSelectorSection');
    const adminArea       = document.getElementById('adminModeArea');
    const selectedPreview = document.getElementById('selectedPreview');

    if (isAdminMode) {
      schoolSection.style.display = 'none';
      selectedPreview.classList.remove('show');
      adminArea.style.display = 'flex';
      document.documentElement.style.setProperty('--primary', '#1a3a6b');
      document.documentElement.style.setProperty('--secondary', '#c8a951');
      document.documentElement.style.setProperty('--accent', '#e8f0fe');
    } else {
      schoolSection.style.display = 'block';
      adminArea.style.display = 'none';
    }
  }

  function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon  = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      input.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  function showAlert(msg, type = 'error') {
    const alert = document.getElementById('loginAlert');
    const msgEl = document.getElementById('loginAlertMsg');
    alert.className = `alert alert-${type}`;
    msgEl.textContent = msg;
    alert.classList.remove('hidden');
    setTimeout(() => alert.classList.add('hidden'), 5000);
  }

  async function handleLogin() {
    const email    = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const btn      = document.getElementById('loginBtn');
    const btnText  = document.getElementById('loginBtnText');
    const btnLoader= document.getElementById('loginBtnLoader');

    if (!email || !password) {
      showAlert('من فضلك ادخل البريد الإلكتروني وكلمة المرور');
      return;
    }
    if (!isAdminMode && !selectedSchool) {
      showAlert('من فضلك اختر المدرسة أولاً');
      return;
    }

    btn.disabled = true;
    btnText.textContent = 'جاري الدخول...';
    btnLoader.classList.remove('hidden');

    try {
      const result = await auth.signInWithEmailAndPassword(email, password);
      const user = result.user;

      // ── ADMIN ──
      if (ADMINS.includes(email)) {
        const schoolId = isAdminMode
          ? Object.keys(SCHOOLS)[0]
          : (selectedSchool?.id || Object.keys(SCHOOLS)[0]);
        SESSION.set({ uid: user.uid, email, role: 'admin', schoolId, name: 'مدير النظام' });
        window.location.href = 'admin.html';
        return;
      }

      if (!selectedSchool) {
        showAlert('من فضلك اختر المدرسة');
        return;
      }

      // ── HR ──
      if (selectedSchool.hrUsers?.includes(email)) {
        SESSION.set({
          uid: user.uid, email, role: 'hr',
          schoolId: selectedSchool.id,
          schoolName: selectedSchool.name,
          name: email.split('@')[0]
        });
        window.location.href = 'hr.html';
        return;
      }

      // ── شئون الطلاب ──
      if (selectedSchool.shu2onUsers?.includes(email)) {
        SESSION.set({
          uid: user.uid, email, role: 'shu2on',
          schoolId: selectedSchool.id,
          schoolName: selectedSchool.name,
          name: email.split('@')[0]
        });
        window.location.href = 'student-affairs.html';
        return;
      }

      // ── ACCOUNTANT ──
      if (!selectedSchool.users.includes(email)) {
        showAlert('هذا الحساب غير مصرح له بالدخول على هذه المدرسة');
        auth.signOut();
        return;
      }

      SESSION.set({
        uid: user.uid, email, role: 'accountant',
        schoolId: selectedSchool.id,
        schoolName: selectedSchool.name,
        name: email.split('@')[0]
      });

      if (document.getElementById('rememberMe').checked) {
        localStorage.setItem('remembered_email', email);
        localStorage.setItem('remembered_school', selectedSchool.id);
      }

      window.location.href = 'dashboard.html';

    } catch (error) {
      let msg = 'حدث خطأ في تسجيل الدخول';
      if (error.code === 'auth/user-not-found')              msg = 'البريد الإلكتروني غير مسجل';
      else if (error.code === 'auth/wrong-password')         msg = 'كلمة المرور غير صحيحة';
      else if (error.code === 'auth/too-many-requests')      msg = 'تم تجاوز عدد المحاولات، حاول لاحقاً';
      else if (error.code === 'auth/network-request-failed') msg = 'تحقق من الاتصال بالإنترنت';
      showAlert(msg);
    } finally {
      btn.disabled = false;
      btnText.textContent = 'تسجيل الدخول';
      btnLoader.classList.add('hidden');
    }
  }

  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });

  // ============================================================
  //  PWA — Service Worker + Install Banners
  //  يشتغل على Android/Chrome و iOS/Safari
  // ============================================================

  // 1. تسجيل Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
        .then(reg => {
          console.log('[SW] مسجل بنجاح، scope:', reg.scope);
          // لو في تحديث جديد — بلّغ المستخدم
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('[SW] تحديث جديد متاح');
              }
            });
          });
        })
        .catch(err => console.warn('[SW] فشل التسجيل:', err));
    });
  }

  // 2. Android / Chrome — beforeinstallprompt
  let _deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    _deferredPrompt = e;
    showAndroidBanner();
  });

  window.addEventListener('appinstalled', () => {
    const btn = document.getElementById('pwa-android-btn');
    if (btn) btn.remove();
    _deferredPrompt = null;
    console.log('[PWA] تم التثبيت بنجاح');
  });

  function showAndroidBanner() {
    if (document.getElementById('pwa-android-btn')) return;
    const btn = document.createElement('button');
    btn.id = 'pwa-android-btn';
    btn.innerHTML = '📲 تثبيت التطبيق';
    btn.style.cssText = [
      'position:fixed', 'bottom:1.5rem', 'left:1.5rem',
      'background:rgba(26,58,107,0.92)', 'backdrop-filter:blur(8px)',
      'color:white', 'border:2px solid rgba(255,255,255,0.35)',
      'border-radius:14px', 'padding:0.65rem 1.2rem',
      'font-family:Cairo,sans-serif', 'font-size:0.85rem', 'font-weight:700',
      'cursor:pointer', 'z-index:9998',
      'box-shadow:0 6px 24px rgba(0,0,0,0.4)',
      'transition:transform 0.2s,opacity 0.2s'
    ].join(';');
    btn.onmouseenter = () => btn.style.transform = 'scale(1.04)';
    btn.onmouseleave = () => btn.style.transform = 'scale(1)';
    btn.onclick = async () => {
      if (!_deferredPrompt) return;
      _deferredPrompt.prompt();
      const { outcome } = await _deferredPrompt.userChoice;
      if (outcome === 'accepted') btn.remove();
      _deferredPrompt = null;
    };
    document.body.appendChild(btn);
  }

  // 3. iOS Safari — banner إرشادي يدوي
  (function showIOSBanner() {
    const isIOS      = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                       (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isStandalone = ('standalone' in navigator) && navigator.standalone;
    const dismissed    = sessionStorage.getItem('pwa_ios_dismissed');

    if (!isIOS || isStandalone || dismissed) return;

    // أضف الـ CSS
    const style = document.createElement('style');
    style.textContent = `
      #ios-pwa-banner {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: linear-gradient(135deg, #1a3a6b 0%, #0d2247 100%);
        color: white;
        padding: 1rem 1rem 1.5rem;
        z-index: 9999;
        font-family: 'Cairo', Arial, sans-serif;
        direction: rtl;
        box-shadow: 0 -6px 30px rgba(0,0,0,0.4);
        border-top: 1px solid rgba(255,255,255,0.15);
        border-radius: 20px 20px 0 0;
        animation: iosBannerUp 0.4s cubic-bezier(0.34,1.56,0.64,1);
      }
      @keyframes iosBannerUp {
        from { transform: translateY(100%); opacity: 0; }
        to   { transform: translateY(0);   opacity: 1; }
      }
      #ios-pwa-banner .ios-banner-close {
        position: absolute;
        top: 0.75rem; left: 0.85rem;
        background: rgba(255,255,255,0.15);
        border: none; color: white;
        width: 26px; height: 26px;
        border-radius: 50%;
        font-size: 0.85rem;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        line-height: 1;
      }
      #ios-pwa-banner .ios-banner-title {
        font-size: 0.95rem;
        font-weight: 800;
        margin: 0 0 0.5rem;
        text-align: center;
      }
      #ios-pwa-banner .ios-banner-steps {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }
      #ios-pwa-banner .ios-step {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.82rem;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 0.45rem 0.75rem;
      }
      #ios-pwa-banner .ios-step-num {
        background: rgba(255,255,255,0.25);
        border-radius: 50%;
        width: 22px; height: 22px;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.75rem; font-weight: 800;
        flex-shrink: 0;
      }
      #ios-pwa-banner .share-icon {
        display: inline-block;
        width: 18px; height: 18px;
        vertical-align: middle;
        fill: white;
        flex-shrink: 0;
      }
    `;
    document.head.appendChild(style);

    const banner = document.createElement('div');
    banner.id = 'ios-pwa-banner';
    // أيقونة المشاركة SVG الأصلية على iOS
    const shareIconSVG = `<svg class="share-icon" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
      <path d="M30.3 13.7L25 8.4l-5.3 5.3-1.4-1.4L25 5.6l6.7 6.7z"/>
      <path d="M24 7h2v21h-2z"/>
      <path d="M35 40H15c-1.7 0-3-1.3-3-3V19c0-1.7 1.3-3 3-3h7v2h-7c-.6 0-1 .4-1 1v18c0 .6.4 1 1 1h20c.6 0 1-.4 1-1V19c0-.6-.4-1-1-1h-7v-2h7c1.7 0 3 1.3 3 3v18c0 1.7-1.3 3-3 3z"/>
    </svg>`;

    banner.innerHTML = `
      <button class="ios-banner-close" onclick="document.getElementById('ios-pwa-banner').remove();sessionStorage.setItem('pwa_ios_dismissed','1')">✕</button>
      <p class="ios-banner-title">📲 ثبّت التطبيق على جهازك</p>
      <div class="ios-banner-steps">
        <div class="ios-step">
          <span class="ios-step-num">1</span>
          ${shareIconSVG}
          <span>اضغط على زر <strong>المشاركة</strong> في الشريط السفلي</span>
        </div>
        <div class="ios-step">
          <span class="ios-step-num">2</span>
          <span style="font-size:1.1rem">➕</span>
          <span>اختر <strong>"إضافة إلى الشاشة الرئيسية"</strong></span>
        </div>
        <div class="ios-step">
          <span class="ios-step-num">3</span>
          <span style="font-size:1.1rem">✅</span>
          <span>اضغط <strong>إضافة</strong> وهيتثبت فوراً</span>
        </div>
      </div>
    `;
    // أظهر بعد ثانيتين بس لو المستخدم على صفحة اللوجن
    setTimeout(() => {
      if (!document.getElementById('ios-pwa-banner')) {
        document.body.appendChild(banner);
      }
    }, 2500);
  })();

  renderSchools();

  const rememberedEmail  = localStorage.getItem('remembered_email');
  const rememberedSchool = localStorage.getItem('remembered_school');
  if (rememberedEmail) {
    document.getElementById('emailInput').value = rememberedEmail;
    document.getElementById('rememberMe').checked = true;
  }
  if (rememberedSchool && SCHOOLS[rememberedSchool]) {
    selectSchool(SCHOOLS[rememberedSchool]);
  }

  // If already logged in → redirect to correct page
  const session = SESSION.get();
  if (session) {
    if (session.role === 'admin')        window.location.href = 'admin.html';
    else if (session.role === 'hr')      window.location.href = 'hr.html';
    else if (session.role === 'shu2on')  window.location.href = 'student-affairs.html';
    else                                 window.location.href = 'dashboard.html';
  }
</script>
</body>
</html>
