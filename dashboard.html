<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a3a6b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="School System" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<title>الرئيسية - نظام المحاسبة</title>
  <link rel="stylesheet" href="styles.css?v=2.3" />
</head>
<body>

<div class="app-layout">
  <!-- Sidebar injected by layout.js -->

  <div class="main-content">
    <div id="topbarContainer"></div>

    <div class="page-content">

      <!-- Stats -->
      <div class="stats-grid animate-in" id="statsGrid">
        <div class="stat-card">
          <div class="stat-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          </div>
          <div>
            <div class="stat-value" id="statTodayTotal">0</div>
            <div class="stat-label">إجمالي تحصيل اليوم</div>
            <div class="stat-change up" id="statTodayCount">0 عملية</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div>
            <div class="stat-value" id="statMonthTotal">0</div>
            <div class="stat-label">إجمالي الشهر</div>
            <div class="stat-change" id="statMonthCount">0 عملية</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div>
            <div class="stat-value" id="statStudents">0</div>
            <div class="stat-label">طلاب دفعوا اليوم</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          </div>
          <div>
            <div class="stat-value" id="statPending">0</div>
            <div class="stat-label">معاملات هذا الأسبوع</div>
          </div>
        </div>
      </div>

      <!-- Cache bar -->
      <div id="cacheBar" style="display:none;align-items:center;gap:0.5rem;justify-content:flex-end;font-size:0.75rem;color:var(--text-light);margin-bottom:0.5rem">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span id="cacheMsg"></span>
        <button onclick="forceRefresh()" style="background:none;border:none;cursor:pointer;color:var(--primary);font-size:0.75rem;text-decoration:underline;padding:0">تحديث الآن</button>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem" class="animate-in">

        <!-- Recent Transactions -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">آخر التحصيلات</span>
            <a href="collection.html" class="btn btn-sm btn-secondary">إضافة جديد +</a>
          </div>
          <div class="table-wrapper">
            <table class="data-table" id="recentTable">
              <thead>
                <tr>
                  <th>الطالب</th>
                  <th>البند</th>
                  <th>المبلغ</th>
                  <th>التاريخ</th>
                </tr>
              </thead>
              <tbody id="recentTableBody">
                <tr><td colspan="4"><div class="loading-spinner"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Payment Items Breakdown -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">توزيع المدفوعات - الشهر الحالي</span>
          </div>
          <div class="card-body" id="breakdownArea">
            <div class="loading-spinner"></div>
          </div>
        </div>

      </div>

      <!-- Stage summary -->
      <div class="card mt-2 animate-in">
        <div class="card-header">
          <span class="card-title">ملخص المراحل</span>
          <a href="reports.html" class="btn btn-sm btn-secondary">التقارير الكاملة</a>
        </div>
        <div class="card-body">
          <div class="stats-grid" id="stageStats">
            <div class="loading-spinner"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="layout.js"></script>
<script src="/pwa.js?v=8"></script>
<script>
  renderLayout('dashboard', 'الرئيسية');

  const session  = SESSION.get();
  const schoolId = session.schoolId;

  // ─────────────────────────────────────────
  // CACHE — sessionStorage لمدة 10 دقائق
  // كل مستخدم عنده cache منفصل بالـ schoolId
  // ─────────────────────────────────────────
  const CACHE_KEY    = `dash_v2_${schoolId}`;
  const CACHE_TTL_MS = 10 * 60 * 1000;

  function getCached() {
    try {
      const raw = sessionStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (Date.now() - obj.ts > CACHE_TTL_MS) { sessionStorage.removeItem(CACHE_KEY); return null; }
      return obj;
    } catch { return null; }
  }

  function setCache(payload) {
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ ...payload, ts: Date.now() })); }
    catch { /* storage full */ }
  }

  function showCacheBar(ts) {
    const bar  = document.getElementById('cacheBar');
    const msg  = document.getElementById('cacheMsg');
    const mins = Math.floor((Date.now() - ts) / 60000);
    bar.style.display = 'flex';
    msg.textContent = mins < 1 ? 'بيانات محدّثة للتو' : `آخر تحديث من Firebase منذ ${mins} د`;
  }

  function forceRefresh() {
    sessionStorage.removeItem(CACHE_KEY);
    document.getElementById('cacheBar').style.display = 'none';
    document.getElementById('recentTableBody').innerHTML = '<tr><td colspan="4"><div class="loading-spinner"></div></td></tr>';
    document.getElementById('breakdownArea').innerHTML  = '<div class="loading-spinner"></div>';
    document.getElementById('stageStats').innerHTML     = '<div class="loading-spinner"></div>';
    loadDashboard();
  }

  // ─────────────────────────────────────────
  // حساب التواريخ
  // ─────────────────────────────────────────
  function buildDateRanges() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const toStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const todayStr     = toStr(now);
    const firstOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const lastOfMonth  = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    const firstOfWeek  = new Date(now);
    firstOfWeek.setDate(now.getDate() - now.getDay());
    return { todayStr, firstOfMonthStr: toStr(firstOfMonth),
             lastOfMonthStr: toStr(lastOfMonth), firstOfWeekStr: toStr(firstOfWeek) };
  }

  // ─────────────────────────────────────────
  // showError
  // ─────────────────────────────────────────
  function showError(msg) {
    ['recentTableBody','breakdownArea','stageStats'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = `<div class="empty-state"><div class="empty-state-title" style="color:var(--danger)">خطأ: ${msg}</div></div>`;
    });
    ['statTodayTotal','statMonthTotal','statStudents','statPending','statTodayCount','statMonthCount']
      .forEach(id => { const el = document.getElementById(id); if (el) el.textContent = '—'; });
  }

  // ─────────────────────────────────────────
  // renderAll — يرسم كل الـ UI من object جاهز
  // ─────────────────────────────────────────
  function renderAll(d) {
    document.getElementById('statTodayTotal').textContent = formatCurrency(d.todayTotal);
    document.getElementById('statTodayCount').textContent = `${d.todayCount} عملية`;
    document.getElementById('statStudents').textContent   = d.todayStudents;
    document.getElementById('statPending').textContent    = d.weekCount;
    document.getElementById('statMonthTotal').textContent = formatCurrency(d.monthTotal);
    document.getElementById('statMonthCount').textContent = `${d.monthCount} عملية`;

    // آخر التحصيلات
    const tbody = document.getElementById('recentTableBody');
    if (!d.recentDocs.length) {
      tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state"><div class="empty-state-title">لا توجد تحصيلات بعد</div></div></td></tr>`;
    } else {
      tbody.innerHTML = '';
      d.recentDocs.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${r.studentName}</strong><br><span class="text-sm text-muted">${r.grade}</span></td>
          <td><span class="badge badge-primary">${r.paymentItem}</span></td>
          <td class="text-bold text-primary">${formatCurrency(r.amount)}</td>
          <td class="text-sm text-muted">${r.date}</td>`;
        tbody.appendChild(tr);
      });
    }

    // توزيع المدفوعات
    const area = document.getElementById('breakdownArea');
    if (!Object.keys(d.itemTotals).length) {
      area.innerHTML = `<div class="empty-state"><div class="empty-state-title">لا توجد بيانات</div></div>`;
    } else {
      const maxVal = Math.max(...Object.values(d.itemTotals)) || 1;
      area.innerHTML = Object.entries(d.itemTotals).map(([item, total]) => `
        <div style="margin-bottom:0.75rem">
          <div class="d-flex justify-between mb-1">
            <span class="text-sm text-bold">${item}</span>
            <span class="text-sm text-primary text-bold">${formatCurrency(total)}</span>
          </div>
          <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${Math.round(total/maxVal*100)}%;background:var(--primary);border-radius:4px;transition:width 1s ease"></div>
          </div>
        </div>`).join('');
    }

    // ملخص المراحل
    const icons = {
      pre_kg: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
      kg:     '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
      grade:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
      prep:   '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>'
    };
    const defIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>';
    document.getElementById('stageStats').innerHTML = Object.entries(STAGES).map(([key, stage]) => {
      const sd = d.stageTotals[key] || { total: 0, count: 0 };
      return `<div class="stat-card">
        <div class="stat-icon">${icons[key] || defIcon}</div>
        <div>
          <div class="stat-value" style="font-size:1.1rem">${formatCurrency(sd.total)}</div>
          <div class="stat-label">${stage.labelAr}</div>
          <div class="stat-change">${sd.count} عملية</div>
        </div>
      </div>`;
    }).join('');
  }

  // ─────────────────────────────────────────
  // loadDashboard
  // التحسينات:
  //  ✅ Cache 10 دقائق — صفر reads لو المستخدم رجع للصفحة
  //  ✅ Query واحد للشهر بدل 3 queries (اليوم + الشهر + الأسبوع)
  //  ✅ اليوم والأسبوع محسوبين من monthSnap في الميموري
  //  ✅ recentSnap مع fallback لو مفيش index
  // ─────────────────────────────────────────
  async function loadDashboard() {
    // 1. جرب الـ cache الأول
    const cached = getCached();
    if (cached) {
      renderAll(cached);
      showCacheBar(cached.ts);
      return; // ✅ صفر reads من Firebase
    }

    // 2. جيب من Firebase
    const { todayStr, firstOfMonthStr, lastOfMonthStr, firstOfWeekStr } = buildDateRanges();
    const col = db.collection('transactions').where('schoolId', '==', schoolId);

    try {
      // query الشهر + آخر التحصيلات فقط — 2 بدل 4
      const [monthSnap, recentSnap] = await Promise.all([
        col.where('date', '>=', firstOfMonthStr)
           .where('date', '<=', lastOfMonthStr)
           .get(),
        col.orderBy('createdAt', 'desc').limit(8).get()
           .catch(() => null)
      ]);

      // حساب كل الإحصائيات من monthSnap في loop واحد
      let todayTotal = 0, todayCount = 0, monthTotal = 0, weekCount = 0;
      const todayStudentsSet = new Set();
      const itemTotals  = {};
      const stageTotals = {};

      monthSnap.forEach(doc => {
        const d      = doc.data();
        const amount = Number(d.amount) || 0;
        monthTotal  += amount;

        if (d.date === todayStr) {
          todayTotal += amount;
          todayCount++;
          if (d.studentName) todayStudentsSet.add(d.studentName);
        }
        if (d.date >= firstOfWeekStr && d.date <= todayStr) weekCount++;

        if (d.paymentItem)
          itemTotals[d.paymentItem] = (itemTotals[d.paymentItem] || 0) + amount;

        if (d.stage) {
          if (!stageTotals[d.stage]) stageTotals[d.stage] = { total: 0, count: 0 };
          stageTotals[d.stage].total += amount;
          stageTotals[d.stage].count++;
        }
      });

      // آخر التحصيلات — بيانات خام (plain objects) عشان تتحفظ في cache
      let recentDocs;
      if (recentSnap) {
        recentDocs = recentSnap.docs.map(doc => doc.data());
      } else {
        recentDocs = [...monthSnap.docs]
          .sort((a, b) => (b.data().createdAt?.seconds || 0) - (a.data().createdAt?.seconds || 0))
          .slice(0, 8)
          .map(doc => doc.data());
      }

      const payload = {
        todayTotal, todayCount,
        todayStudents: todayStudentsSet.size,
        weekCount,
        monthTotal, monthCount: monthSnap.size,
        recentDocs, itemTotals, stageTotals
      };

      setCache(payload);
      renderAll(payload);
      showCacheBar(Date.now());

    } catch (err) {
      console.error('Dashboard error:', err);
      showError('حدث خطأ في تحميل البيانات، حاول مرة أخرى');
    }
  }

  loadDashboard();
</script>
</body>
</html>
