<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بند الباصات - نظام المحاسبة</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .bus-section-wrapper {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 2px solid var(--primary);
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .bus-panel {
      background: var(--bg, #f5f7fa);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      padding: 1.25rem;
    }
    .bus-panel-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .bus-input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .bus-input-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-mid, #555);
      margin-bottom: 0.3rem;
    }
    .bus-input-group input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'Cairo', sans-serif;
      font-size: 0.875rem;
      background: white;
      transition: border-color 0.2s;
    }
    .bus-input-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--accent);
    }
    .bus-result-box {
      background: var(--primary);
      color: white;
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
    }
    .bus-result-box .label { font-size: 0.8rem; opacity: 0.85; }
    .bus-result-box .value { font-size: 1.3rem; font-weight: 900; }
    .bus-save-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 0.6rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Cairo', sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .bus-save-btn:hover { opacity: 0.85; }
    .bus-note {
      font-size: 0.72rem;
      color: var(--text-light, #999);
      margin-top: 0.5rem;
      text-align: center;
      font-style: italic;
    }

    /* Summary bar at top */
    .bus-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .bus-stat-card {
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      box-shadow: var(--shadow);
    }
    .bus-stat-card.cost   { background: linear-gradient(135deg, #c62828, #b71c1c); }
    .bus-stat-card.rev    { background: linear-gradient(135deg, #2e7d32, #1b5e20); }
    .bus-stat-card.diff   { background: linear-gradient(135deg, var(--primary), var(--primary-dark, #0d2247)); }
    .bus-stat-card .lbl   { font-size: 0.8rem; opacity: 0.8; font-weight: 600; }
    .bus-stat-card .val   { font-size: 1.8rem; font-weight: 900; line-height: 1; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: var(--card-bg);
      border-radius: var(--radius);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }
    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--card-bg);
      z-index: 1;
    }
    .modal-title { font-size: 1rem; font-weight: 800; color: var(--text-dark); }
    .modal-close {
      background: none; border: none; font-size: 1.2rem;
      cursor: pointer; color: var(--text-light);
      padding: 0.25rem 0.5rem; border-radius: 6px;
    }
    .modal-close:hover { background: var(--border); }
    .modal-body   { padding: 1.5rem; }
    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex; gap: 0.75rem; justify-content: flex-end;
    }

    @media (max-width: 768px) {
      .bus-stats-grid   { grid-template-columns: 1fr; }
      .bus-input-row    { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="app-layout">
  <div class="main-content">
    <div id="topbarContainer"></div>

    <div class="page-content">

      <!-- Stats Summary -->
      <div class="bus-stats-grid animate-in" id="busStatsGrid">
        <div class="bus-stat-card cost">
          <div class="lbl"> إجمالي تكلفة الباصات</div>
          <div class="val" id="statTotalCost">0 ج.م</div>
        </div>
        <div class="bus-stat-card rev">
          <div class="lbl"> إجمالي اشتراكات الطلاب</div>
          <div class="val" id="statTotalRev">0 ج.م</div>
        </div>
        <div class="bus-stat-card diff">
          <div class="lbl" id="statDiffLabel"> الفارق</div>
          <div class="val" id="statTotalDiff">0 ج.م</div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="d-flex align-center gap-1 mb-2 animate-in" style="flex-wrap:wrap">
        <button class="btn btn-primary" onclick="openAddCompanyModal()">
           إضافة شركة جديدة
        </button>
        <button class="btn btn-secondary" onclick="saveBusData()">
           حفظ كل الشركات
        </button>
        <div style="flex:1"></div>
        <button class="btn btn-outline btn-sm" onclick="exportBusExcel()"> Excel</button>
        <button class="btn btn-outline btn-sm" onclick="exportBusPDF()"> PDF</button>
      </div>

      <!-- Companies List -->
      <div class="card animate-in">
        <div class="card-header">
          <span class="card-title"> شركات الباصات</span>
          <span class="badge badge-primary" id="companiesCount">0 شركات</span>
        </div>
        <div class="card-body" id="busCompaniesContainer">
          <div class="loading-spinner"></div>
        </div>
      </div>

      <!-- Total summary box -->
      <div id="busTotalSummary" style="display:none;margin-top:1rem;padding:1rem;background:var(--accent);border-radius:var(--radius-sm);border:2px solid var(--primary)" class="animate-in">
        <div style="font-size:0.85rem;font-weight:800;color:var(--primary);margin-bottom:0.75rem;text-align:center"> ملخص إجمالي الباصات</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.75rem">
          <div style="text-align:center;padding:0.5rem;background:white;border-radius:var(--radius-sm)">
            <div style="font-size:0.72rem;color:var(--text-light)">إجمالي التكلفة</div>
            <div style="font-size:1.1rem;font-weight:900;color:#c0392b" id="busTotalCost">0 ج.م</div>
          </div>
          <div style="text-align:center;padding:0.5rem;background:white;border-radius:var(--radius-sm)">
            <div style="font-size:0.72rem;color:var(--text-light)">إجمالي الاشتراكات</div>
            <div style="font-size:1.1rem;font-weight:900;color:#2e7d32" id="busTotalRevenue">0 ج.م</div>
          </div>
          <div style="text-align:center;padding:0.5rem;background:white;border-radius:var(--radius-sm)">
            <div style="font-size:0.72rem;color:var(--text-light)">الفارق (فائض/عجز)</div>
            <div style="font-size:1.1rem;font-weight:900" id="busTotalDiff">0 ج.م</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal: إضافة/تعديل شركة -->
<div class="modal-overlay hidden" id="busCompanyModal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="busCompanyModalTitle"> إضافة شركة باص</span>
      <button class="modal-close" onclick="closeBusCompanyModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="busCompanyEditId" value="" />
      <div class="form-group">
        <label class="form-label">اسم الشركة <span class="required">*</span></label>
        <input type="text" class="form-input form-input-ar" id="busCompanyName" placeholder="مثال: شركة النيل للنقل" />
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
        <div class="form-group">
          <label class="form-label">عدد السيارات</label>
          <input type="number" class="form-input" id="busCompanyCars" placeholder="0" min="0" oninput="calcCompanyModal()" />
        </div>
        <div class="form-group">
          <label class="form-label">عدد أيام الشهر</label>
          <input type="number" class="form-input" id="busCompanyDays" placeholder="0" min="0" oninput="calcCompanyModal()" />
        </div>
        <div class="form-group">
          <label class="form-label">قيمة اليوم للسيارة (ج.م)</label>
          <input type="number" class="form-input" id="busCompanyDayVal" placeholder="0.00" step="0.01" oninput="calcCompanyModal()" />
        </div>
        <div class="form-group">
          <label class="form-label">عدد المشتركين</label>
          <input type="number" class="form-input" id="busCompanySubCount" placeholder="0" oninput="calcCompanyModal()" />
        </div>
        <div class="form-group">
          <label class="form-label">قيمة الاشتراك / شخص (ج.م)</label>
          <input type="number" class="form-input" id="busCompanySubVal" placeholder="0.00" step="0.01" oninput="calcCompanyModal()" />
        </div>
      </div>
      <div style="padding:0.75rem;background:var(--accent);border-radius:var(--radius-sm);border:1px solid var(--primary-light,#c5d8f5);margin-top:0.5rem" id="busModalCalc">
        <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:0.25rem">
          <span>تكلفة الشركة</span><span id="mCalcCost" style="font-weight:800;color:#c0392b">0 ج.م</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:0.25rem">
          <span>إيرادات الاشتراكات</span><span id="mCalcRev" style="font-weight:800;color:#2e7d32">0 ج.م</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:0.9rem;font-weight:900;border-top:1px solid var(--border);padding-top:0.25rem">
          <span id="mCalcDiffLabel">الفارق</span><span id="mCalcDiff">0 ج.م</span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeBusCompanyModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveBusCompany()"> حفظ الشركة</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="layout.js"></script>
<script>
  renderLayout('buses', 'بند الباصات');

  const session  = SESSION.get();
  const schoolId = session.schoolId;
  let busCompanies = [];

  // ---- حساب المودال ----
  function calcCompanyModal() {
    const cars   = parseFloat(document.getElementById('busCompanyCars').value)    || 0;
    const days   = parseFloat(document.getElementById('busCompanyDays').value)    || 0;
    const dayVal = parseFloat(document.getElementById('busCompanyDayVal').value)  || 0;
    const subCnt = parseFloat(document.getElementById('busCompanySubCount').value)|| 0;
    const subVal = parseFloat(document.getElementById('busCompanySubVal').value)  || 0;
    const cost   = cars * days * dayVal;
    const rev    = subCnt * subVal;
    const diff   = rev - cost;
    document.getElementById('mCalcCost').textContent      = formatCurrency(cost);
    document.getElementById('mCalcRev').textContent       = formatCurrency(rev);
    document.getElementById('mCalcDiff').textContent      = formatCurrency(Math.abs(diff));
    document.getElementById('mCalcDiff').style.color      = diff >= 0 ? '#2e7d32' : '#c0392b';
    document.getElementById('mCalcDiffLabel').textContent = diff >= 0 ? 'فائض' : 'عجز';
  }

  // ---- فتح مودال إضافة ----
  function openAddCompanyModal() {
    document.getElementById('busCompanyEditId').value   = '';
    document.getElementById('busCompanyName').value     = '';
    document.getElementById('busCompanyCars').value     = '';
    document.getElementById('busCompanyDays').value     = '';
    document.getElementById('busCompanyDayVal').value   = '';
    document.getElementById('busCompanySubCount').value = '';
    document.getElementById('busCompanySubVal').value   = '';
    document.getElementById('busCompanyModalTitle').textContent = ' إضافة شركة باص';
    calcCompanyModal();
    document.getElementById('busCompanyModal').classList.remove('hidden');
  }

  // ---- فتح مودال تعديل ----
  function openEditCompanyModal(companyId) {
    const company = busCompanies.find(c => c.id === companyId);
    if (!company) return;
    document.getElementById('busCompanyEditId').value   = companyId;
    document.getElementById('busCompanyName').value     = company.name     || '';
    document.getElementById('busCompanyCars').value     = company.cars     || '';
    document.getElementById('busCompanyDays').value     = company.days     || '';
    document.getElementById('busCompanyDayVal').value   = company.dayVal   || '';
    document.getElementById('busCompanySubCount').value = company.subCount || '';
    document.getElementById('busCompanySubVal').value   = company.subVal   || '';
    document.getElementById('busCompanyModalTitle').textContent = ' تعديل: ' + company.name;
    calcCompanyModal();
    document.getElementById('busCompanyModal').classList.remove('hidden');
  }

  function closeBusCompanyModal() {
    document.getElementById('busCompanyModal').classList.add('hidden');
  }

  // ---- حفظ شركة ----
  async function saveBusCompany() {
    const name     = document.getElementById('busCompanyName').value.trim();
    const cars     = parseFloat(document.getElementById('busCompanyCars').value)    || 0;
    const days     = parseFloat(document.getElementById('busCompanyDays').value)    || 0;
    const dayVal   = parseFloat(document.getElementById('busCompanyDayVal').value)  || 0;
    const subCount = parseFloat(document.getElementById('busCompanySubCount').value)|| 0;
    const subVal   = parseFloat(document.getElementById('busCompanySubVal').value)  || 0;
    if (!name) { alert('من فضلك ادخل اسم الشركة'); return; }
    const monthly  = cars * days * dayVal;
    const subTotal = subCount * subVal;
    const editId   = document.getElementById('busCompanyEditId').value;

    const data = {
      schoolId, name, cars, days, dayVal, monthly,
      subCount, subVal, subTotal,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: session.email
    };

    try {
      const colRef = db.collection('busCompanies').doc(schoolId).collection('companies');
      if (editId) {
        await colRef.doc(editId).set(data, { merge: true });
      } else {
        data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await colRef.add(data);
      }
      closeBusCompanyModal();
      await loadBusData();
    } catch(err) {
      alert('خطأ في الحفظ: ' + err.message);
    }
  }

  // ---- حذف شركة ----
  async function deleteBusCompany(companyId) {
    if (!confirm('هل تريد حذف هذه الشركة؟')) return;
    try {
      await db.collection('busCompanies').doc(schoolId).collection('companies').doc(companyId).delete();
      await loadBusData();
    } catch(err) {
      alert('خطأ في الحذف: ' + err.message);
    }
  }

  // ---- حفظ كل الشركات (batch) ----
  async function saveBusData() {
    if (busCompanies.length === 0) { alert('لا توجد شركات لحفظها. أضف شركة أولاً.'); return; }
    try {
      const batch  = db.batch();
      const colRef = db.collection('busCompanies').doc(schoolId).collection('companies');
      busCompanies.forEach(c => {
        batch.update(colRef.doc(c.id), { updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      });
      await batch.commit();
      const btn = document.querySelector('.btn-secondary[onclick="saveBusData()"]');
      if (btn) { const o=btn.innerHTML; btn.innerHTML=' تم الحفظ!'; btn.style.background='#2e7d32'; setTimeout(()=>{btn.innerHTML=o;btn.style.background='';},2000); }
    } catch(err) {
      alert('خطأ في الحفظ: ' + err.message);
    }
  }

  // ---- تحميل الشركات ----
  async function loadBusData() {
    const container = document.getElementById('busCompaniesContainer');
    container.innerHTML = '<div class="loading-spinner"></div>';
    try {
      const snap = await db.collection('busCompanies').doc(schoolId).collection('companies')
        .orderBy('createdAt', 'asc').get();
      busCompanies = [];
      snap.forEach(doc => busCompanies.push({ id: doc.id, ...doc.data() }));
    } catch(e) {
      busCompanies = [];
    }
    renderBusCompanies();
  }

  // ---- رندر الشركات ----
  function renderBusCompanies() {
    const container = document.getElementById('busCompaniesContainer');
    document.getElementById('companiesCount').textContent = busCompanies.length + ' شركات';

    if (busCompanies.length === 0) {
      container.innerHTML = `
        <div style="text-align:center;padding:3rem;color:var(--text-light)">
          <div style="font-size:3rem;margin-bottom:0.75rem"></div>
          <div style="font-weight:700;font-size:1rem">لا توجد شركات باصات بعد</div>
          <div style="font-size:0.8rem;margin-top:0.25rem">اضغط "إضافة شركة جديدة" لإضافة أول شركة</div>
        </div>`;
      document.getElementById('busTotalSummary').style.display = 'none';
      updateStats(0, 0);
      return;
    }

    let totalCost = 0, totalRevenue = 0;
    const cards = busCompanies.map(c => {
      const cost    = c.monthly    || (c.cars * c.days * c.dayVal) || 0;
      const revenue = c.subTotal   || (c.subCount * c.subVal)      || 0;
      const diff    = revenue - cost;
      totalCost    += cost;
      totalRevenue += revenue;
      const diffColor = diff >= 0 ? '#2e7d32' : '#c0392b';
      const diffLabel = diff >= 0 ? 'فائض' : 'عجز';
      return `
        <div style="background:var(--bg,#f5f7fa);border-radius:var(--radius-sm);border:1px solid var(--border);padding:1rem;margin-bottom:0.75rem">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem">
            <div style="font-size:0.95rem;font-weight:800;color:var(--primary)">${c.name}</div>
            <div style="display:flex;gap:0.5rem">
              <button onclick="openEditCompanyModal('${c.id}')" style="padding:0.25rem 0.75rem;border:1px solid var(--primary);background:transparent;color:var(--primary);border-radius:4px;cursor:pointer;font-size:0.78rem;font-family:Cairo,sans-serif;font-weight:700"> تعديل</button>
              <button onclick="deleteBusCompany('${c.id}')" style="padding:0.25rem 0.75rem;border:1px solid #c0392b;background:transparent;color:#c0392b;border-radius:4px;cursor:pointer;font-size:0.78rem;font-family:Cairo,sans-serif;font-weight:700"> حذف</button>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:0.5rem;text-align:center">
            <div style="background:white;padding:0.4rem;border-radius:4px;border:1px solid var(--border)">
              <div style="font-size:0.65rem;color:var(--text-light)">السيارات</div>
              <div style="font-size:0.9rem;font-weight:800">${c.cars || 0}</div>
            </div>
            <div style="background:white;padding:0.4rem;border-radius:4px;border:1px solid var(--border)">
              <div style="font-size:0.65rem;color:var(--text-light)">الأيام</div>
              <div style="font-size:0.9rem;font-weight:800">${c.days || 0}</div>
            </div>
            <div style="background:white;padding:0.4rem;border-radius:4px;border:1px solid var(--border)">
              <div style="font-size:0.65rem;color:var(--text-light)">قيمة اليوم</div>
              <div style="font-size:0.9rem;font-weight:800">${formatCurrency(c.dayVal || 0)}</div>
            </div>
            <div style="background:white;padding:0.4rem;border-radius:4px;border:1px solid var(--border)">
              <div style="font-size:0.65rem;color:var(--text-light)">المشتركون</div>
              <div style="font-size:0.9rem;font-weight:800">${c.subCount || 0}</div>
            </div>
            <div style="background:white;padding:0.4rem;border-radius:4px;border:1px solid var(--border)">
              <div style="font-size:0.65rem;color:var(--text-light)">اشتراك/شخص</div>
              <div style="font-size:0.9rem;font-weight:800">${formatCurrency(c.subVal || 0)}</div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;margin-top:0.5rem">
            <div style="background:#fdecea;padding:0.5rem;border-radius:4px;text-align:center">
              <div style="font-size:0.7rem;color:#c0392b">تكلفة الشهر</div>
              <div style="font-weight:900;color:#c0392b">${formatCurrency(cost)}</div>
            </div>
            <div style="background:#e8f5e9;padding:0.5rem;border-radius:4px;text-align:center">
              <div style="font-size:0.7rem;color:#2e7d32">إيرادات الاشتراكات</div>
              <div style="font-weight:900;color:#2e7d32">${formatCurrency(revenue)}</div>
            </div>
            <div style="background:var(--accent);padding:0.5rem;border-radius:4px;text-align:center">
              <div style="font-size:0.7rem;color:${diffColor}">${diffLabel}</div>
              <div style="font-weight:900;color:${diffColor}">${formatCurrency(Math.abs(diff))}</div>
            </div>
          </div>
        </div>`;
    }).join('');

    container.innerHTML = cards;

    // ملخص الإجماليات
    const totalDiff = totalRevenue - totalCost;
    document.getElementById('busTotalCost').textContent    = formatCurrency(totalCost);
    document.getElementById('busTotalRevenue').textContent = formatCurrency(totalRevenue);
    document.getElementById('busTotalDiff').textContent    = formatCurrency(Math.abs(totalDiff));
    document.getElementById('busTotalDiff').style.color    = totalDiff >= 0 ? '#2e7d32' : '#c0392b';
    document.getElementById('busTotalSummary').style.display = 'block';

    updateStats(totalCost, totalRevenue);
  }

  function updateStats(totalCost, totalRevenue) {
    const diff = totalRevenue - totalCost;
    document.getElementById('statTotalCost').textContent  = formatCurrency(totalCost);
    document.getElementById('statTotalRev').textContent   = formatCurrency(totalRevenue);
    document.getElementById('statTotalDiff').textContent  = formatCurrency(Math.abs(diff));
    document.getElementById('statDiffLabel').textContent  = diff >= 0 ? ' فائض' : ' عجز';
    const diffCard = document.querySelector('.bus-stat-card.diff');
    if (diff < 0) diffCard.style.background = 'linear-gradient(135deg,#c62828,#b71c1c)';
    else          diffCard.style.background = '';
  }

  // ---- PDF Export ----
  function exportBusPDF() {
    if (busCompanies.length === 0) { alert('لا توجد بيانات للتصدير'); return; }
    const school = SESSION.getSchool();
    let totalCost = 0, totalRev = 0;
    const rows = busCompanies.map((c, i) => {
      const cost = c.monthly  || (c.cars * c.days * c.dayVal) || 0;
      const rev  = c.subTotal || (c.subCount * c.subVal)      || 0;
      const diff = rev - cost;
      totalCost += cost; totalRev += rev;
      return `<tr>
        <td>${i+1}</td>
        <td>${c.name}</td>
        <td>${c.cars||0}</td>
        <td>${c.days||0}</td>
        <td>${formatCurrency(c.dayVal||0)}</td>
        <td style="color:#c0392b;font-weight:800">${formatCurrency(cost)}</td>
        <td>${c.subCount||0}</td>
        <td>${formatCurrency(c.subVal||0)}</td>
        <td style="color:#2e7d32;font-weight:800">${formatCurrency(rev)}</td>
        <td style="font-weight:900;color:${diff>=0?'#2e7d32':'#c0392b'}">${diff>=0?'فائض':'عجز'}: ${formatCurrency(Math.abs(diff))}</td>
      </tr>`;
    }).join('');
    const totalDiff = totalRev - totalCost;
    const win = window.open('', '_blank');
    win.document.write(`<html dir="rtl"><head><meta charset="UTF-8">
      <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
      <style>
        body{font-family:Cairo,sans-serif;padding:20px;font-size:12px;direction:rtl}
        h2{color:var(--primary,#1a3a6b)}
        table{width:100%;border-collapse:collapse;margin-top:12px}
        th{background:#1a3a6b;color:white;padding:7px 8px;text-align:right}
        td{padding:6px 8px;border-bottom:1px solid #eee}
        tr:nth-child(even){background:#f8f9fa}
        .summary{display:flex;gap:24px;background:#1a3a6b;color:white;padding:12px 16px;border-radius:8px;margin:12px 0;flex-wrap:wrap}
        .sum-item .lbl{font-size:10px;opacity:0.7}
        .sum-item .val{font-size:16px;font-weight:900}
        @media print{@page{size:A4 landscape}body{padding:10px}}
      </style></head><body>
      <h2>${school?.name || ''} — بيان بند الباصات — السنة الدراسية 2026/2027</h2>
      <div class="summary">
        <div class="sum-item"><div class="lbl">إجمالي التكلفة</div><div class="val">${formatCurrency(totalCost)}</div></div>
        <div class="sum-item"><div class="lbl">إجمالي الاشتراكات</div><div class="val">${formatCurrency(totalRev)}</div></div>
        <div class="sum-item"><div class="lbl">${totalDiff>=0?'فائض':'عجز'}</div><div class="val">${formatCurrency(Math.abs(totalDiff))}</div></div>
        <div class="sum-item"><div class="lbl">عدد الشركات</div><div class="val">${busCompanies.length}</div></div>
      </div>
      <table>
        <thead><tr>
          <th>#</th><th>الشركة</th><th>السيارات</th><th>الأيام</th><th>قيمة اليوم</th>
          <th>تكلفة الشهر</th><th>المشتركون</th><th>اشتراك/شخص</th><th>الإيرادات</th><th>الفارق</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr style="background:#1a3a6b;color:white;font-weight:900">
            <td colspan="5">الإجمالي</td>
            <td>${formatCurrency(totalCost)}</td>
            <td colspan="2"></td>
            <td>${formatCurrency(totalRev)}</td>
            <td style="color:${totalDiff>=0?'#90EE90':'#FF9999'}">${totalDiff>=0?'فائض':'عجز'}: ${formatCurrency(Math.abs(totalDiff))}</td>
          </tr>
        </tfoot>
      </table>
      <script>window.print();setTimeout(()=>window.close(),900)<\/script>
    </body></html>`);
  }

  // ---- Excel Export ----
  async function exportBusExcel() {
    if (busCompanies.length === 0) { alert('لا توجد بيانات للتصدير'); return; }
    if (typeof ExcelJS === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
      document.head.appendChild(s);
      await new Promise(r => s.onload = r);
    }
    const school = SESSION.getSchool();
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Eng. Kareem Ali Mousa';
    const ws = wb.addWorksheet('بند الباصات', { views: [{ rightToLeft: true }] });
    ws.columns = [
      {width:5},{width:24},{width:10},{width:10},{width:14},
      {width:16},{width:14},{width:14},{width:14},{width:14}
    ];
    const hStyle = (bg, fc='FFFFFF') => ({
      font: { name:'Arial', bold:true, size:11, color:{argb:'FF'+fc} },
      fill: { type:'pattern', pattern:'solid', fgColor:{argb:'FF'+bg} },
      alignment: { horizontal:'center', vertical:'middle', readingOrder:2 },
      border: { top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'} }
    });

    // Title
    ws.mergeCells('A1:J1');
    const r1 = ws.getRow(1); r1.height = 32;
    r1.getCell(1).value = `بند الباصات  —  ${school?.name||''}  —  السنة الدراسية 2026/2027`;
    r1.getCell(1).style = hStyle('DDD9C4', 'C00000');
    r1.getCell(1).font  = { name:'Arial', bold:true, size:14, color:{argb:'FFC00000'} };

    // Header
    const hdr = ws.addRow(['م','اسم الشركة','السيارات','الأيام','قيمة اليوم','تكلفة الشهر','المشتركون','اشتراك/شخص','الإيرادات','فائض/عجز']);
    hdr.height = 24;
    hdr.eachCell({includeEmpty:true}, cell => { cell.style = hStyle('AD818A'); });

    let totalCost=0, totalRev=0;
    busCompanies.forEach((c, i) => {
      const cost = c.monthly  || (c.cars*c.days*c.dayVal) || 0;
      const rev  = c.subTotal || (c.subCount*c.subVal)    || 0;
      const diff = rev - cost;
      totalCost += cost; totalRev += rev;
      const row = ws.addRow([i+1,c.name,c.cars||0,c.days||0,c.dayVal||0,cost,c.subCount||0,c.subVal||0,rev,diff]);
      row.height = 20;
      const bg = i%2===1 ? 'FFF5F0F0' : null;
      row.eachCell({includeEmpty:true}, (cell, col) => {
        cell.style = { font:{name:'Arial',size:10}, fill: bg?{type:'pattern',pattern:'solid',fgColor:{argb:bg}}:undefined, alignment:{horizontal:'center',vertical:'middle',readingOrder:2} };
        if([5,6,8,9,10].includes(col)) cell.numFmt='#,##0';
        if(col===10) cell.font={name:'Arial',bold:true,size:10,color:{argb:diff>=0?'FF1B5E20':'FFC00000'}};
      });
    });

    const totalDiff = totalRev - totalCost;
    const tot = ws.addRow(['','الإجمالي','','','',totalCost,'','',totalRev,totalDiff]);
    tot.height = 24;
    tot.eachCell({includeEmpty:true}, (cell, col) => {
      cell.style = { font:{name:'Arial',bold:true,size:12,color:{argb:'FFFFFFFF'}}, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FF1A3A6B'}}, alignment:{horizontal:'center',vertical:'middle',readingOrder:2} };
      if([6,9,10].includes(col)) { cell.numFmt='#,##0'; if(col===10) cell.font.color={argb:totalDiff>=0?'FF90EE90':'FFFF9999'}; }
    });

    const buffer = await wb.xlsx.writeBuffer();
    const blob   = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url    = URL.createObjectURL(blob);
    const a      = document.createElement('a');
    a.href=url; a.download=`بند_الباصات_${school?.name||''}.xlsx`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---- Init ----
  loadBusData();
</script>
