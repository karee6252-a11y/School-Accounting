<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الموارد البشرية</title>
  <link rel="stylesheet" href="styles.css?v=1.1" />
  <style>
    /*  HR-specific styles  */
    .hr-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0;
    }
    .hr-tab {
      padding: 0.6rem 1.25rem;
      font-family: 'Cairo', sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--text-light);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: var(--transition);
      border-radius: 8px 8px 0 0;
    }
    .hr-tab:hover { color: var(--primary); background: var(--accent); }
    .hr-tab.active { color: var(--primary); border-bottom-color: var(--primary); background: var(--accent); }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeInUp 0.3s ease; }

    /* Employee card in list */
    .emp-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: var(--transition);
      cursor: pointer;
      margin-bottom: 0.75rem;
    }
    .emp-card:hover { border-color: var(--primary); box-shadow: var(--shadow); transform: translateY(-1px); }
    .emp-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--primary-light);
      flex-shrink: 0;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 800; color: var(--primary);
      overflow: hidden;
    }
    .emp-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .emp-info { flex: 1; min-width: 0; }
    .emp-name { font-size: 0.95rem; font-weight: 800; color: var(--text-dark); }
    .emp-meta { font-size: 0.78rem; color: var(--text-light); margin-top: 0.15rem; }
    .emp-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.4rem; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.2rem 0.65rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .status-active   { background: #e8f5e9; color: #2e7d32; }
    .status-resigned { background: #fdecea; color: #c62828; }
    .status-expired  { background: #fff3e0; color: #e65100; }

    /* Doc checklist */
    .doc-checklist {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-top: 0.75rem;
    }
    .doc-item {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.82rem; color: var(--text-mid);
    }
    .doc-item input[type=checkbox] { accent-color: var(--primary); width: 16px; height: 16px; flex-shrink: 0; }

    /* Photo upload */
    .photo-upload-area {
      width: 100px; height: 100px;
      border: 2px dashed var(--border);
      border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; margin: 0 auto 1rem;
      background: var(--bg);
      overflow: hidden; position: relative;
      transition: var(--transition);
    }
    .photo-upload-area:hover { border-color: var(--primary); background: var(--accent); }
    .photo-upload-area img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .photo-upload-area span { font-size: 0.7rem; color: var(--text-light); text-align: center; line-height: 1.3; }

    /* Section heading inside modal */
    .form-section-title {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 0.4rem;
      margin: 1.25rem 0 0.75rem;
    }

    /* Stats bar */
    .hr-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .hr-stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
    }
    .hr-stat-num { font-size: 1.8rem; font-weight: 900; color: var(--primary); }
    .hr-stat-label { font-size: 0.75rem; color: var(--text-light); font-weight: 600; margin-top: 0.2rem; }

    /* Filter row */
    .search-filter-row {
      display: flex; gap: 0.75rem; flex-wrap: wrap;
      align-items: center; margin-bottom: 1rem;
    }
    .search-filter-row .form-input { max-width: 280px; }
    .search-filter-row select.form-input { direction: rtl; text-align: right; max-width: 180px; }

    /* Full employee detail modal */
    .emp-detail-section {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;
    }
    .emp-detail-item { font-size: 0.85rem; }
    .emp-detail-item .lbl { color: var(--text-light); font-size: 0.75rem; font-weight: 600; margin-bottom: 0.15rem; }
    .emp-detail-item .val { font-weight: 700; color: var(--text-dark); }

    .large-modal { max-width: 820px; }

    .dept-badge {
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      background: var(--accent);
      color: var(--primary);
      border: 1px solid var(--primary-light);
    }

    @media (max-width: 768px) {
      .hr-stats { grid-template-columns: repeat(2, 1fr); }
      .doc-checklist { grid-template-columns: 1fr; }
      .emp-detail-section { grid-template-columns: 1fr; }
      .search-filter-row .form-input { max-width: 100%; width: 100%; }
    }
  </style>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar injected by renderHRLayout() -->
  <div class="main-content" style="margin-right: var(--sidebar-width);">
    <div id="topbarContainer"></div>
    <div class="page-content">

      <!-- Tabs -->
      <div class="hr-tabs">
        <button class="hr-tab active" onclick="switchTab('register')"> تسجيل موظف جديد</button>
        <button class="hr-tab" onclick="switchTab('list')"> سجل الموظفين</button>
        <button class="hr-tab" onclick="switchTab('resigned')"> تاركو العمل</button>
      </div>

      <!--  TAB 1: REGISTER  -->
      <div class="tab-pane active" id="tab-register">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">تسجيل موظف جديد</h2>
          </div>
          <div class="card-body">
            <div class="alert alert-error hidden" id="regAlert"><span id="regAlertMsg"></span></div>
            <div class="alert alert-success hidden" id="regSuccess"><span id="regSuccessMsg"></span></div>

            <!-- Photo -->
            <div class="photo-upload-area" id="photoArea" onclick="document.getElementById('photoInput').click()">
              <img id="photoPreview" src="" alt="" style="display:none"/>
              <span id="photoPlaceholder"><br/>صورة شخصية</span>
            </div>
            <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="previewPhoto(event)"/>

            <!-- Personal Info -->
            <div class="form-section-title">البيانات الشخصية</div>
            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label">الاسم بالعربية <span class="required">*</span></label>
                <input type="text" class="form-input form-input-ar" id="nameAr" placeholder="الاسم الرباعي بالعربية"/>
              </div>
              <div class="form-group">
                <label class="form-label">الاسم بالإنجليزية <span class="required">*</span></label>
                <input type="text" class="form-input" id="nameEn" placeholder="Full Name in English" style="direction:ltr;text-align:left"/>
              </div>
              <div class="form-group">
                <label class="form-label">الرقم القومي <span class="required">*</span></label>
                <input type="text" class="form-input" id="nationalId" placeholder="14 رقم" maxlength="14" style="direction:ltr;text-align:left"/>
              </div>
              <div class="form-group">
                <label class="form-label">تاريخ الميلاد <span class="required">*</span></label>
                <input type="date" class="form-input" id="birthDate"/>
              </div>
              <div class="form-group">
                <label class="form-label">رقم الهاتف <span class="required">*</span></label>
                <input type="tel" class="form-input" id="phone" placeholder="01XXXXXXXXX" style="direction:ltr;text-align:left"/>
              </div>
              <div class="form-group">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" class="form-input" id="email" placeholder="email@example.com" style="direction:ltr;text-align:left"/>
              </div>
              <div class="form-group" style="grid-column: 1/-1">
                <label class="form-label">العنوان</label>
                <input type="text" class="form-input form-input-ar" id="address" placeholder="المدينة، الحي، الشارع"/>
              </div>
            </div>

            <!-- Job Info -->
            <div class="form-section-title">بيانات الوظيفة</div>
            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label">القسم <span class="required">*</span></label>
                <select class="form-input" id="dept" onchange="updateJobTitles()">
                  <option value="">-- اختر القسم --</option>
                  <option value="administrative">إدارية</option>
                  <option value="academic">أكاديمية</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">الوظيفة <span class="required">*</span></label>
                <select class="form-input" id="jobTitle">
                  <option value="">-- اختر الوظيفة --</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">تاريخ بداية التعيين <span class="required">*</span></label>
                <input type="date" class="form-input" id="startDate"/>
              </div>
              <div class="form-group">
                <label class="form-label">تاريخ انتهاء التعيين</label>
                <input type="date" class="form-input" id="endDate"/>
              </div>
            </div>

            <!-- Documents -->
            <div class="form-section-title">المستندات المسلّمة</div>
            <div class="doc-checklist" id="docsChecklist">
              <label class="doc-item"><input type="checkbox" id="doc_cert"/>أصل شهادة المؤهل</label>
              <label class="doc-item"><input type="checkbox" id="doc_birth"/>أصل شهادة الميلاد</label>
              <label class="doc-item"><input type="checkbox" id="doc_military"/>أصل شهادة الخدمة العامة (إناث) / الجيش (ذكور)</label>
              <label class="doc-item"><input type="checkbox" id="doc_id"/>صورة بطاقة شخصية سارية</label>
              <label class="doc-item"><input type="checkbox" id="doc_criminal"/>فيش جنائي</label>
              <label class="doc-item"><input type="checkbox" id="doc_medical"/>كشف طبي</label>
              <label class="doc-item"><input type="checkbox" id="doc_heel"/>كعب عمل</label>
            </div>

            <div style="margin-top:1.5rem; display:flex; justify-content:flex-end; gap:0.75rem">
              <button class="btn btn-secondary" onclick="resetForm()">مسح</button>
              <button class="btn btn-primary" onclick="saveEmployee()" id="saveBtn" style="width:auto;padding:0.75rem 2rem">
                <span id="saveBtnText"> حفظ الموظف</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!--  TAB 2: LIST  -->
      <div class="tab-pane" id="tab-list">
        <!-- Stats -->
        <div class="hr-stats">
          <div class="hr-stat-card">
            <div class="hr-stat-num" id="statTotal">0</div>
            <div class="hr-stat-label">إجمالي الموظفين</div>
          </div>
          <div class="hr-stat-card">
            <div class="hr-stat-num" id="statActive" style="color:var(--success)">0</div>
            <div class="hr-stat-label">موظفون نشطون</div>
          </div>
          <div class="hr-stat-card">
            <div class="hr-stat-num" id="statAdmin" style="color:var(--info)">0</div>
            <div class="hr-stat-label">قسم إداري</div>
          </div>
          <div class="hr-stat-card">
            <div class="hr-stat-num" id="statAcademic" style="color:var(--warning)">0</div>
            <div class="hr-stat-label">قسم أكاديمي</div>
          </div>
        </div>

        <!-- Filters -->
        <div class="search-filter-row">
          <input type="text" class="form-input" id="searchInput" placeholder="  ابحث بالاسم أو الرقم القومي..." oninput="filterEmployees()" style="flex:1;max-width:320px"/>
          <select class="form-input" id="filterDept" onchange="filterEmployees()">
            <option value="">كل الأقسام</option>
            <option value="administrative">إداري</option>
            <option value="academic">أكاديمي</option>
          </select>
          <select class="form-input" id="filterJob" onchange="filterEmployees()">
            <option value="">كل الوظائف</option>
          </select>
          <select class="form-input" id="filterStatus" onchange="filterEmployees()">
            <option value="">كل الحالات</option>
            <option value="active">نشط</option>
            <option value="expired">منتهي التعيين</option>
          </select>
        </div>

        <!-- List -->
        <div id="empList">
          <div class="empty-state">
            <div class="empty-state-icon"></div>
            <div class="empty-state-title">جاري التحميل...</div>
          </div>
        </div>
      </div>

      <!--  TAB 3: RESIGNED  -->
      <div class="tab-pane" id="tab-resigned">
        <div class="search-filter-row">
          <input type="text" class="form-input" id="searchResigned" placeholder="  ابحث في تاركي العمل..." oninput="filterResigned()" style="flex:1;max-width:320px"/>
        </div>
        <div id="resignedList">
          <div class="empty-state">
            <div class="empty-state-icon"></div>
            <div class="empty-state-title">لا يوجد موظفون تاركو العمل</div>
          </div>
        </div>
      </div>

    </div><!-- /page-content -->
  </div><!-- /main-content -->
</div><!-- /app-layout -->

<!--  EMPLOYEE DETAIL MODAL  -->
<div class="modal-overlay hidden" id="detailModal">
  <div class="modal large-modal">
    <div class="modal-header">
      <span class="modal-title" id="detailModalTitle">بيانات الموظف</span>
      <button class="btn-close" onclick="closeDetailModal()"></button>
    </div>
    <div class="modal-body" id="detailModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" onclick="resignEmployee()" id="resignBtn">تسجيل ترك العمل</button>
      <button class="btn btn-secondary btn-sm" onclick="openEditModal()"> تعديل</button>
      <button class="btn btn-outline btn-sm" onclick="closeDetailModal()">إغلاق</button>
    </div>
  </div>
</div>

<!--  EDIT MODAL  -->
<div class="modal-overlay hidden" id="editModal">
  <div class="modal large-modal">
    <div class="modal-header">
      <span class="modal-title">تعديل بيانات الموظف</span>
      <button class="btn-close" onclick="closeEditModal()"></button>
    </div>
    <div class="modal-body" id="editModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="saveEdit()" style="width:auto;padding:0.75rem 2rem"> حفظ التعديلات</button>
      <button class="btn btn-outline btn-sm" onclick="closeEditModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="layout.js"></script>
<script>

// 
// JOB TITLES DATA
// 
const JOB_TITLES = {
  administrative: [
    "مدير مدرسة","وكيل مدرسة","مدير أكاديمي","مدير رياض أطفال",
    "شؤون طلاب","شؤون عاملين","محاسبين","سكرتارية",
    "علاقات عامة","أمن وخدمات","IT",
    "مشرفين أدوار","أخصائي نفسي"
  ],
  academic: [
    "مشرف مواد - عربي","مشرف مواد - إنجليزي","مشرف مواد - ماث",
    "مشرف مواد - علوم","مشرف مواد - دراسات اجتماعية",
    "مشرف مواد - ألماني","مشرف مواد - فرنش","مشرف مواد - PE","مشرف مواد - ART",
    "مدرس عربي","مدرس إنجليزي","مدرس ماث","مدرس علوم",
    "مدرس دراسات اجتماعية","مدرس ألماني","مدرس فرنش","مدرس PE","مدرس ART",
    "أخصائي مكتبات"
  ]
};

// 
// AUTH & LAYOUT
// 
let currentSession = null;
let currentSchoolId = null;
let allEmployees = [];
let selectedEmployee = null;
let photoBase64 = null;

document.addEventListener('DOMContentLoaded', () => {
  const session = SESSION.get();
  if (!session) { window.location.href = 'index.html'; return; }

  // HR check — only HR role allowed here
  if (session.role !== 'hr' && session.role !== 'admin') {
    window.location.href = 'index.html';
    return;
  }

  currentSession = session;
  currentSchoolId = session.schoolId;

  renderHRLayout(session);
  loadEmployees();
  populateFilterJobs();

  // Set today as default start date
  document.getElementById('startDate').value = localDateStr();
});

// 
// SIDEBAR — HR only (no accounting links)
// 
function renderHRLayout(session) {
  const school = SESSION.getSchool();
  if (school) applySchoolTheme(school);

  // Auth watcher
  auth.onAuthStateChanged(user => {
    if (!user) { SESSION.clear(); window.location.href = 'index.html'; }
  });

  const sidebarHTML = `
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img class="sidebar-logo" id="school-logo"
          src="${school?.logo || ''}" alt="${school?.name || ''}"
          onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23ffffff33%22/></svg>'"
        />
        <div class="sidebar-school-name" id="school-name">${school?.name || 'النظام'}</div>
        <div class="sidebar-user">${session.email}</div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-title">الموارد البشرية</div>
        <a class="nav-item active" href="hr.html">
          <span class="nav-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </span>
          <span>الموارد البشرية</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info-mini">
          <div class="user-avatar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="user-details-mini">
            <div class="user-name-mini">${session.name || session.email.split('@')[0]}</div>
            <div class="user-role-mini">موارد بشرية</div>
          </div>
        </div>
        <button class="btn btn-outline w-full btn-sm" onclick="logout()" style="justify-content:center">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:6px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          تسجيل الخروج
        </button>
      </div>
    </aside>`;

  const topbarHTML = `
    <div class="topbar">
      <div class="d-flex align-center gap-1">
        <button class="btn btn-icon" id="sidebarToggle" onclick="toggleSidebar()" style="display:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="topbar-title">الموارد البشرية</h1>
      </div>
      <div class="topbar-actions">
        <div class="badge badge-primary">${school?.name || ''}</div>
        <div style="font-size:0.8rem;color:var(--text-light)">${new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div>
      </div>
    </div>`;

  document.body.insertAdjacentHTML('afterbegin', sidebarHTML);
  document.getElementById('topbarContainer').innerHTML = topbarHTML;

  const tb = document.getElementById('sidebarToggle');
  if (tb) tb.style.display = window.innerWidth <= 768 ? 'flex' : 'none';
}

// 
// TABS
// 
function switchTab(name) {
  document.querySelectorAll('.hr-tab').forEach((t,i) => {
    const tabs = ['register','list','resigned'];
    t.classList.toggle('active', tabs[i] === name);
  });
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'list' || name === 'resigned') renderEmployeeLists();
}

// 
// JOB TITLES DYNAMIC
// 
function updateJobTitles(selectId = 'jobTitle', deptId = 'dept') {
  const dept = document.getElementById(deptId).value;
  const sel = document.getElementById(selectId);
  sel.innerHTML = '<option value="">-- اختر الوظيفة --</option>';
  (JOB_TITLES[dept] || []).forEach(j => {
    const o = document.createElement('option'); o.value = j; o.textContent = j; sel.appendChild(o);
  });
}

function populateFilterJobs() {
  const sel = document.getElementById('filterJob');
  [...JOB_TITLES.administrative, ...JOB_TITLES.academic].forEach(j => {
    const o = document.createElement('option'); o.value = j; o.textContent = j; sel.appendChild(o);
  });
}

// 
// PHOTO PREVIEW
// 
function previewPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    photoBase64 = ev.target.result;
    document.getElementById('photoPreview').src = photoBase64;
    document.getElementById('photoPreview').style.display = 'block';
    document.getElementById('photoPlaceholder').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

// 
// SAVE EMPLOYEE
// 
async function saveEmployee() {
  const nameAr    = document.getElementById('nameAr').value.trim();
  const nameEn    = document.getElementById('nameEn').value.trim();
  const nationalId= document.getElementById('nationalId').value.trim();
  const birthDate = document.getElementById('birthDate').value;
  const phone     = document.getElementById('phone').value.trim();
  const email     = document.getElementById('email').value.trim();
  const address   = document.getElementById('address').value.trim();
  const dept      = document.getElementById('dept').value;
  const jobTitle  = document.getElementById('jobTitle').value;
  const startDate = document.getElementById('startDate').value;
  const endDate   = document.getElementById('endDate').value;

  const docs = {
    cert:     document.getElementById('doc_cert').checked,
    birth:    document.getElementById('doc_birth').checked,
    military: document.getElementById('doc_military').checked,
    idCard:   document.getElementById('doc_id').checked,
    criminal: document.getElementById('doc_criminal').checked,
    medical:  document.getElementById('doc_medical').checked,
    heel:     document.getElementById('doc_heel').checked
  };

  // Validation
  if (!nameAr || !nameEn || !nationalId || !birthDate || !phone || !dept || !jobTitle || !startDate) {
    showRegAlert('من فضلك أكمل الحقول المطلوبة (*)');
    return;
  }
  if (nationalId.length !== 14 || isNaN(nationalId)) {
    showRegAlert('الرقم القومي لازم يكون 14 رقم');
    return;
  }

  const btn = document.getElementById('saveBtn');
  const btnText = document.getElementById('saveBtnText');
  btn.disabled = true;
  btnText.textContent = 'جاري الحفظ...';

  try {
    // Check duplicate national ID
    const existing = await db.collection('schools').doc(currentSchoolId)
      .collection('employees').where('nationalId','==',nationalId).get();
    if (!existing.empty) {
      showRegAlert('هذا الرقم القومي مسجل بالفعل');
      return;
    }

    const employeeData = {
      nameAr, nameEn, nationalId, birthDate, phone, email, address,
      dept, jobTitle, startDate, endDate: endDate || null,
      docs,
      photo: photoBase64 || null,
      status: 'active',
      schoolId: currentSchoolId,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdBy: currentSession.email,
      resignedAt: null,
      resignedNote: null
    };

    await db.collection('schools').doc(currentSchoolId)
      .collection('employees').add(employeeData);

    showRegSuccess(` تم حفظ بيانات "${nameAr}" بنجاح`);
    resetForm();
    loadEmployees();
  } catch(err) {
    showRegAlert('حدث خطأ أثناء الحفظ: ' + err.message);
  } finally {
    btn.disabled = false;
    btnText.textContent = ' حفظ الموظف';
  }
}

function showRegAlert(msg) {
  const a = document.getElementById('regAlert');
  document.getElementById('regAlertMsg').textContent = msg;
  a.classList.remove('hidden');
  setTimeout(() => a.classList.add('hidden'), 5000);
}
function showRegSuccess(msg) {
  const a = document.getElementById('regSuccess');
  document.getElementById('regSuccessMsg').textContent = msg;
  a.classList.remove('hidden');
  setTimeout(() => a.classList.add('hidden'), 5000);
}

function resetForm() {
  ['nameAr','nameEn','nationalId','birthDate','phone','email','address','startDate','endDate'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('dept').value = '';
  document.getElementById('jobTitle').innerHTML = '<option value="">-- اختر الوظيفة --</option>';
  ['doc_cert','doc_birth','doc_military','doc_id','doc_criminal','doc_medical','doc_heel'].forEach(id => {
    document.getElementById(id).checked = false;
  });
  photoBase64 = null;
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('photoPlaceholder').style.display = '';
  document.getElementById('startDate').value = localDateStr();
}

// 
// LOAD & RENDER
// 
async function loadEmployees() {
  try {
    const snap = await db.collection('schools').doc(currentSchoolId)
      .collection('employees').orderBy('createdAt','desc').get();
    allEmployees = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderEmployeeLists();
    updateStats();
  } catch(e) {
    console.error(e);
  }
}

function updateStats() {
  const active = allEmployees.filter(e => e.status === 'active');
  const today = localDateStr();
  document.getElementById('statTotal').textContent   = allEmployees.length;
  document.getElementById('statActive').textContent  = active.filter(e => !e.endDate || e.endDate >= today).length;
  document.getElementById('statAdmin').textContent   = active.filter(e => e.dept === 'administrative').length;
  document.getElementById('statAcademic').textContent= active.filter(e => e.dept === 'academic').length;
}

function getEmployeeStatus(emp) {
  if (emp.status === 'resigned') return { label: 'تارك العمل', cls: 'status-resigned' };
  const today = localDateStr();
  if (emp.endDate && emp.endDate < today) return { label: 'منتهي التعيين', cls: 'status-expired' };
  return { label: 'نشط', cls: 'status-active' };
}

function renderEmployeeLists() {
  const search     = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const deptF      = document.getElementById('filterDept')?.value || '';
  const jobF       = document.getElementById('filterJob')?.value || '';
  const statusF    = document.getElementById('filterStatus')?.value || '';
  const searchRes  = (document.getElementById('searchResigned')?.value || '').toLowerCase();

  const today = localDateStr();

  // Active list
  const activeEmps = allEmployees.filter(e => {
    if (e.status === 'resigned') return false;
    if (deptF   && e.dept     !== deptF)   return false;
    if (jobF    && e.jobTitle !== jobF)    return false;
    if (statusF === 'active'  && e.endDate && e.endDate < today) return false;
    if (statusF === 'expired' && (!e.endDate || e.endDate >= today)) return false;
    if (search) {
      const s = search;
      if (!e.nameAr?.toLowerCase().includes(s) &&
          !e.nameEn?.toLowerCase().includes(s) &&
          !e.nationalId?.includes(s)) return false;
    }
    return true;
  });

  const listEl = document.getElementById('empList');
  if (listEl) {
    if (!activeEmps.length) {
      listEl.innerHTML = `<div class="empty-state"><div class="empty-state-icon"></div><div class="empty-state-title">لا يوجد موظفون مطابقون</div></div>`;
    } else {
      listEl.innerHTML = activeEmps.map(e => empCardHTML(e)).join('');
    }
  }

  // Resigned list
  const resignedEmps = allEmployees.filter(e => {
    if (e.status !== 'resigned') return false;
    if (searchRes) {
      const s = searchRes;
      if (!e.nameAr?.toLowerCase().includes(s) &&
          !e.nameEn?.toLowerCase().includes(s) &&
          !e.nationalId?.includes(s)) return false;
    }
    return true;
  });

  const resignedEl = document.getElementById('resignedList');
  if (resignedEl) {
    if (!resignedEmps.length) {
      resignedEl.innerHTML = `<div class="empty-state"><div class="empty-state-icon"></div><div class="empty-state-title">لا يوجد موظفون تاركو العمل</div></div>`;
    } else {
      resignedEl.innerHTML = resignedEmps.map(e => empCardHTML(e)).join('');
    }
  }
}

function empCardHTML(emp) {
  const st = getEmployeeStatus(emp);
  const initial = emp.nameAr ? emp.nameAr.charAt(0) : '?';
  const photoHTML = emp.photo
    ? `<img src="${emp.photo}" alt="${emp.nameAr}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>`
    : initial;
  const deptLabel = emp.dept === 'administrative' ? 'إداري' : 'أكاديمي';
  return `
    <div class="emp-card" onclick="openDetail('${emp.id}')">
      <div class="emp-avatar">${photoHTML}</div>
      <div class="emp-info">
        <div class="emp-name">${emp.nameAr} <span style="font-size:0.78rem;color:var(--text-light);font-weight:400">${emp.nameEn}</span></div>
        <div class="emp-meta">${emp.jobTitle} &nbsp;|&nbsp; ${emp.phone}</div>
        <div class="emp-badges">
          <span class="status-badge ${st.cls}">${st.label}</span>
          <span class="dept-badge">${deptLabel}</span>
          ${emp.startDate ? `<span style="font-size:0.72rem;color:var(--text-light)">منذ ${emp.startDate}</span>` : ''}
        </div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-light);flex-shrink:0"><polyline points="15 18 9 12 15 6"/></svg>
    </div>`;
}

function filterEmployees() { renderEmployeeLists(); }
function filterResigned()  { renderEmployeeLists(); }

// 
// DETAIL MODAL
// 
function openDetail(empId) {
  selectedEmployee = allEmployees.find(e => e.id === empId);
  if (!selectedEmployee) return;
  const emp = selectedEmployee;
  const st = getEmployeeStatus(emp);

  const photoHTML = emp.photo
    ? `<img src="${emp.photo}" alt="" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--primary-light);display:block;margin:0 auto 1rem"/>`
    : `<div style="width:80px;height:80px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:var(--primary);margin:0 auto 1rem">${emp.nameAr?.charAt(0)||'?'}</div>`;

  const docsMap = {
    cert:'أصل شهادة المؤهل', birth:'أصل شهادة الميلاد',
    military:'خدمة عامة/جيش', idCard:'بطاقة شخصية سارية',
    criminal:'فيش جنائي', medical:'كشف طبي', heel:'كعب عمل'
  };
  const docsHTML = Object.entries(docsMap).map(([k,v]) =>
    `<label class="doc-item" style="pointer-events:none">
      <input type="checkbox" ${emp.docs?.[k] ? 'checked' : ''} disabled/>${v}
    </label>`
  ).join('');

  document.getElementById('detailModalTitle').textContent = emp.nameAr;
  document.getElementById('detailModalBody').innerHTML = `
    ${photoHTML}
    <div style="text-align:center;margin-bottom:1rem">
      <span class="status-badge ${st.cls}" style="font-size:0.85rem">${st.label}</span>
    </div>
    <div class="form-section-title">البيانات الشخصية</div>
    <div class="emp-detail-section">
      <div class="emp-detail-item"><div class="lbl">الاسم عربي</div><div class="val">${emp.nameAr||'-'}</div></div>
      <div class="emp-detail-item"><div class="lbl">الاسم إنجليزي</div><div class="val">${emp.nameEn||'-'}</div></div>
      <div class="emp-detail-item"><div class="lbl">الرقم القومي</div><div class="val">${emp.nationalId||'-'}</div></div>
      <div class="emp-detail-item"><div class="lbl">تاريخ الميلاد</div><div class="val">${emp.birthDate||'-'}</div></div>
      <div class="emp-detail-item"><div class="lbl">الهاتف</div><div class="val">${emp.phone||'-'}</div></div>
      <div class="emp-detail-item"><div class="lbl">البريد الإلكتروني</div><div class="val">${emp.email||'-'}</div></div>
      <div class="emp-detail-item" style="grid-column:1/-1"><div class="lbl">العنوان</div><div class="val">${emp.address||'-'}</div></div>
    </div>
    <div class="form-section-title">بيانات الوظيفة</div>
    <div class="emp-detail-section">
      <div class="emp-detail-item"><div class="lbl">القسم</div><div class="val">${emp.dept==='administrative'?'إداري':'أكاديمي'}</div></div>
      <div class="emp-detail-item"><div class="lbl">الوظيفة</div><div class="val">${emp.jobTitle||'-'}</div></div>
      <div class="emp-detail-item"><div class="lbl">تاريخ التعيين</div><div class="val">${emp.startDate||'-'}</div></div>
      <div class="emp-detail-item"><div class="lbl">تاريخ انتهاء التعيين</div><div class="val">${emp.endDate||'غير محدد'}</div></div>
      ${emp.resignedAt ? `<div class="emp-detail-item"><div class="lbl">تاريخ ترك العمل</div><div class="val">${emp.resignedAt}</div></div>` : ''}
      ${emp.resignedNote ? `<div class="emp-detail-item"><div class="lbl">سبب الترك</div><div class="val">${emp.resignedNote}</div></div>` : ''}
    </div>
    <div class="form-section-title">المستندات</div>
    <div class="doc-checklist">${docsHTML}</div>`;

  // Hide resign button if already resigned
  document.getElementById('resignBtn').style.display = emp.status === 'resigned' ? 'none' : '';
  document.getElementById('detailModal').classList.remove('hidden');
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.add('hidden');
  selectedEmployee = null;
}

// 
// RESIGN
// 
async function resignEmployee() {
  if (!selectedEmployee) return;
  const note = prompt('سبب ترك العمل (اختياري):') || '';
  if (!confirm(`هل تأكد تسجيل ترك عمل "${selectedEmployee.nameAr}"؟`)) return;

  try {
    await db.collection('schools').doc(currentSchoolId)
      .collection('employees').doc(selectedEmployee.id)
      .update({ status: 'resigned', resignedAt: localDateStr(), resignedNote: note });
    closeDetailModal();
    await loadEmployees();
    alert(' تم تسجيل ترك العمل');
  } catch(e) {
    alert('خطأ: ' + e.message);
  }
}

// 
// EDIT MODAL
// 
function openEditModal() {
  if (!selectedEmployee) return;
  const emp = selectedEmployee;
  closeDetailModal();

  const deptOptions = ['administrative','academic'].map(d =>
    `<option value="${d}" ${emp.dept===d?'selected':''}>${d==='administrative'?'إداري':'أكاديمي'}</option>`
  ).join('');

  const jobOptions = [...(JOB_TITLES[emp.dept]||[])].map(j =>
    `<option value="${j}" ${emp.jobTitle===j?'selected':''}>${j}</option>`
  ).join('');

  document.getElementById('editModalBody').innerHTML = `
    <div class="form-grid-2">
      <div class="form-group"><label class="form-label">الاسم عربي *</label>
        <input class="form-input form-input-ar" id="e_nameAr" value="${emp.nameAr||''}"/></div>
      <div class="form-group"><label class="form-label">الاسم إنجليزي *</label>
        <input class="form-input" id="e_nameEn" value="${emp.nameEn||''}" style="direction:ltr;text-align:left"/></div>
      <div class="form-group"><label class="form-label">الرقم القومي *</label>
        <input class="form-input" id="e_nationalId" value="${emp.nationalId||''}" style="direction:ltr;text-align:left"/></div>
      <div class="form-group"><label class="form-label">تاريخ الميلاد</label>
        <input type="date" class="form-input" id="e_birthDate" value="${emp.birthDate||''}"/></div>
      <div class="form-group"><label class="form-label">الهاتف</label>
        <input class="form-input" id="e_phone" value="${emp.phone||''}" style="direction:ltr;text-align:left"/></div>
      <div class="form-group"><label class="form-label">البريد الإلكتروني</label>
        <input class="form-input" id="e_email" value="${emp.email||''}" style="direction:ltr;text-align:left"/></div>
      <div class="form-group" style="grid-column:1/-1"><label class="form-label">العنوان</label>
        <input class="form-input form-input-ar" id="e_address" value="${emp.address||''}"/></div>
      <div class="form-group"><label class="form-label">القسم</label>
        <select class="form-input" id="e_dept" onchange="updateJobTitles('e_jobTitle','e_dept')">${deptOptions}</select></div>
      <div class="form-group"><label class="form-label">الوظيفة</label>
        <select class="form-input" id="e_jobTitle">${jobOptions}</select></div>
      <div class="form-group"><label class="form-label">تاريخ التعيين</label>
        <input type="date" class="form-input" id="e_startDate" value="${emp.startDate||''}"/></div>
      <div class="form-group"><label class="form-label">تاريخ انتهاء التعيين</label>
        <input type="date" class="form-input" id="e_endDate" value="${emp.endDate||''}"/></div>
    </div>
    <div class="form-section-title">المستندات</div>
    <div class="doc-checklist">
      <label class="doc-item"><input type="checkbox" id="e_doc_cert"     ${emp.docs?.cert?'checked':''}/>أصل شهادة المؤهل</label>
      <label class="doc-item"><input type="checkbox" id="e_doc_birth"    ${emp.docs?.birth?'checked':''}/>أصل شهادة الميلاد</label>
      <label class="doc-item"><input type="checkbox" id="e_doc_military" ${emp.docs?.military?'checked':''}/>خدمة عامة/جيش</label>
      <label class="doc-item"><input type="checkbox" id="e_doc_id"       ${emp.docs?.idCard?'checked':''}/>بطاقة شخصية سارية</label>
      <label class="doc-item"><input type="checkbox" id="e_doc_criminal" ${emp.docs?.criminal?'checked':''}/>فيش جنائي</label>
      <label class="doc-item"><input type="checkbox" id="e_doc_medical"  ${emp.docs?.medical?'checked':''}/>كشف طبي</label>
      <label class="doc-item"><input type="checkbox" id="e_doc_heel"     ${emp.docs?.heel?'checked':''}/>كعب عمل</label>
    </div>`;

  document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

async function saveEdit() {
  if (!selectedEmployee) return;
  const updated = {
    nameAr:     document.getElementById('e_nameAr').value.trim(),
    nameEn:     document.getElementById('e_nameEn').value.trim(),
    nationalId: document.getElementById('e_nationalId').value.trim(),
    birthDate:  document.getElementById('e_birthDate').value,
    phone:      document.getElementById('e_phone').value.trim(),
    email:      document.getElementById('e_email').value.trim(),
    address:    document.getElementById('e_address').value.trim(),
    dept:       document.getElementById('e_dept').value,
    jobTitle:   document.getElementById('e_jobTitle').value,
    startDate:  document.getElementById('e_startDate').value,
    endDate:    document.getElementById('e_endDate').value || null,
    docs: {
      cert:     document.getElementById('e_doc_cert').checked,
      birth:    document.getElementById('e_doc_birth').checked,
      military: document.getElementById('e_doc_military').checked,
      idCard:   document.getElementById('e_doc_id').checked,
      criminal: document.getElementById('e_doc_criminal').checked,
      medical:  document.getElementById('e_doc_medical').checked,
      heel:     document.getElementById('e_doc_heel').checked
    },
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedBy: currentSession.email
  };

  try {
    await db.collection('schools').doc(currentSchoolId)
      .collection('employees').doc(selectedEmployee.id).update(updated);
    closeEditModal();
    await loadEmployees();
    alert(' تم حفظ التعديلات بنجاح');
  } catch(e) {
    alert('خطأ: ' + e.message);
  }
}
