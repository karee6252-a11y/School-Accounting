<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a3a6b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="المحاسبة" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<title>التحصيل اليومي - نظام المحاسبة</title>
  <link rel="stylesheet" href="styles.css?v=2.1" />
  <style>
    .payment-item-card { position: relative; cursor: pointer; transition: var(--transition); }
    .payment-item-card.selected { background: var(--accent); border-color: var(--primary); }
    .item-check {
      position: absolute; top: 6px; left: 6px;
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-radius: 4px;
      background: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; color: var(--primary);
    }
    .payment-item-card.selected .item-check { background: var(--primary); color: white; border-color: var(--primary); }
    .amount-input-wrapper { position: relative; }
    .amount-currency { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); font-size: 0.8rem; font-weight: 700; color: var(--text-light); }
    #amountInput { padding-left: 3rem; }
    .receipt-number-gen { display: flex; gap: 0.5rem; }
    .receipt-number-gen input { flex: 1; }
    .stage-indicator { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700; background: var(--accent); color: var(--primary); margin-bottom: 0.75rem; }
    .today-panel { position: sticky; top: calc(var(--header-height) + 1.5rem); max-height: calc(100vh - var(--header-height) - 3rem); overflow-y: auto; }
    .today-item { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem; border-bottom: 1px solid var(--border); transition: var(--transition); }
    .today-item:hover { background: var(--accent); }
    .today-item:last-child { border-bottom: none; }
    .today-amount { font-size: 0.875rem; font-weight: 800; color: var(--primary); white-space: nowrap; }
    .today-student { font-size: 0.8rem; font-weight: 700; }
    .today-details { font-size: 0.72rem; color: var(--text-light); }
    .total-badge { background: var(--primary); color: white; border-radius: var(--radius); padding: 1rem 1.25rem; text-align: center; margin-bottom: 1rem; }
    .total-badge .label { font-size: 0.8rem; opacity: 0.8; }
    .total-badge .amount { font-size: 1.5rem; font-weight: 900; }
    .selected-items-summary { background: var(--accent); border: 1px solid var(--primary-light, #aac); border-radius: var(--radius-sm); padding: 0.75rem 1rem; margin-top: 0.75rem; display: none; }
    .selected-items-summary.show { display: block; }
    .selected-item-row { display: flex; justify-content: space-between; align-items: center; padding: 0.3rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .selected-item-row:last-child { border: none; }
    .selected-total-row { display: flex; justify-content: space-between; padding-top: 0.5rem; font-weight: 800; font-size: 0.9rem; color: var(--primary); }
    .discount-result { font-size: 0.75rem; color: #c0392b; font-weight: 700; }
    .debt-badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
    .payment-summary-box { background: #f8f9fa; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1rem; margin-top: 0.75rem; }
    .payment-summary-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.2rem 0; }
    .payment-summary-total { display: flex; justify-content: space-between; font-weight: 900; font-size: 1rem; color: var(--primary); border-top: 2px solid var(--primary); padding-top: 0.5rem; margin-top: 0.5rem; }
  </style>
</head>
<body>

<div class="app-layout">
  <div class="main-content">
    <div id="topbarContainer"></div>
    <div class="page-content">
      <div style="display:grid;grid-template-columns:1fr 340px;gap:1.5rem;align-items:start">

        <!-- FORM -->
        <div>
          <div class="alert hidden" id="formAlert"></div>

          <!-- Student Info -->
          <div class="card mb-2 animate-in">
            <div class="card-header">
              <span class="card-title">بيانات الطالب</span>
              <span class="badge badge-primary" id="receiptBadge">ايصال جديد</span>
            </div>
            <div class="card-body">
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label">اسم الطالب <span class="required">*</span></label>
                  <input type="text" class="form-input form-input-ar" id="studentName" placeholder="الاسم كاملا" list="studentSuggestions" oninput="checkStudentDebt()" />
                  <datalist id="studentSuggestions"></datalist>
                  <div id="debtIndicator" style="margin-top:4px;display:none"></div>
                </div>
                <div class="form-group">
                  <label class="form-label">المرحلة الدراسية <span class="required">*</span></label>
                  <select class="form-select" id="stageSelect" onchange="onStageChange()">
                    <option value="">اختر المرحلة</option>
                  </select>
                </div>
                <!-- دفعة Cardiff فقط -->
                <div class="form-group hidden" id="paymentTierGroup">
                  <label class="form-label">نوع الدفعة <span class="required">*</span></label>
                  <select class="form-select" id="paymentTierSelect" onchange="onPaymentTierChange()">
                    <option value="">اختر نوع الدفعة</option>
                    <option value="normal">دفعة عادية</option>
                    <option value="golden">دفعة ذهبية ⭐</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">الصف <span class="required">*</span></label>
                  <select class="form-select" id="gradeSelect" onchange="onGradeChange()">
                    <option value="">اختر الصف اولا</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">التاريخ <span class="required">*</span></label>
                  <input type="date" class="form-input" id="dateInput" />
                </div>
              </div>
            </div>
          </div>

          <!-- Payment Items (multi-select) -->
          <div class="card mb-2 animate-in">
            <div class="card-header">
              <span class="card-title">بنود الدفع <span class="required">*</span></span>
              <div style="display:flex;align-items:center;gap:0.5rem">
                <div class="stage-indicator" id="stageIndicator" style="display:none"><span id="stageIndicatorText"></span></div>
                <span class="badge badge-primary" id="selectedCountBadge" style="display:none">0 بنود</span>
              </div>
            </div>
            <div class="card-body">
              <p style="font-size:0.8rem;color:var(--text-light);margin-bottom:0.75rem">يمكنك اختيار اكثر من بند في نفس الوقت</p>
              <div class="payment-items-grid" id="paymentItemsGrid"></div>
              <div class="selected-items-summary" id="selectedSummary">
                <div style="font-size:0.8rem;font-weight:700;margin-bottom:0.5rem;color:var(--primary)">البنود المختارة:</div>
                <div id="selectedItemsList"></div>
                <div class="selected-total-row">
                  <span>الاجمالي المقترح</span>
                  <span id="suggestedTotal">0 ج.م</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Payment Details -->
          <div class="card mb-2 animate-in">
            <div class="card-header">
              <span class="card-title">تفاصيل الدفع</span>
            </div>
            <div class="card-body">
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label">المبلغ المدفوع (جنيه) <span class="required">*</span></label>
                  <div class="amount-input-wrapper">
                    <input type="number" class="form-input" id="amountInput" placeholder="0.00" min="0" step="0.01" oninput="calcDebt()" />
                    <span class="amount-currency">ج.م</span>
                  </div>
                  <div id="debtPreview" style="margin-top:4px;display:none"></div>
                </div>
                <div class="form-group">
                  <label class="form-label">طريقة الدفع <span class="required">*</span></label>
                  <select class="form-select" id="paymentType">
                    <option value="">اختر طريقة الدفع</option>
                    <option value="cash">نقدي</option>
                    <option value="bank_transfer">تحويل بنكي</option>
                    <option value="check">شيك</option>
                    <option value="instapay">انستاباي</option>
                  </select>
                </div>
                <div class="form-group" style="grid-column: 1 / -1" id="discountSection" style="display:none">
                  <label class="form-label">الخصومات (اختياري - %)</label>
                  <div id="discountFields"></div>
                </div>
                <div class="form-group">
                  <label class="form-label">رقم الايصال <span class="required">*</span></label>
                  <div class="receipt-number-gen">
                    <input type="text" class="form-input form-input-ar" id="receiptNumber" placeholder="REC-2026-001" />
                    <button class="btn btn-secondary btn-sm" onclick="generateReceiptNumber()">تلقائي</button>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">ملاحظات</label>
                  <textarea class="form-textarea" id="notes" placeholder="اي ملاحظات اضافية..."></textarea>
                </div>
              </div>
              <div class="payment-summary-box" id="paymentSummaryBox" style="display:none">
                <div style="font-size:0.85rem;font-weight:700;color:var(--primary);margin-bottom:0.5rem">ملخص العملية</div>
                <div id="paymentSummaryContent"></div>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button class="btn btn-primary flex-1" id="saveBtn" onclick="saveTransaction()">حفظ التحصيل</button>
            <button class="btn btn-secondary" onclick="resetForm()">تفريغ</button>
            <button class="btn btn-outline" onclick="previewReceipt()">معاينة الايصال</button>
          </div>
        </div>

        <!-- TODAY'S PANEL -->
        <div class="today-panel">
          <div class="total-badge">
            <div class="label">اجمالي تحصيل اليوم</div>
            <div class="amount" id="todayTotalDisplay">ج.م 0</div>
            <div style="font-size:0.75rem;opacity:0.7;margin-top:0.25rem" id="todayCountDisplay">0 عملية</div>
          </div>
          <div class="card">
            <div class="card-header">
              <span class="card-title">تحصيلات اليوم</span>
              <button class="btn btn-sm btn-secondary" onclick="exportTodayPDF()">PDF</button>
            </div>
            <div id="todayTransactions"><div class="loading-spinner"></div></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Receipt Modal -->
<div class="modal-overlay hidden" id="receiptModal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <span class="modal-title">معاينة الايصال</span>
      <button class="btn-close" onclick="closeModal('receiptModal')">X</button>
    </div>
    <div class="modal-body"><div class="receipt-preview" id="receiptPreviewContent"></div></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('receiptModal')">اغلاق</button>
      <button class="btn btn-primary" onclick="printReceipt()">طباعة</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="layout.js"></script>
<script>
  renderLayout('collection', 'التحصيل اليومي');
  const session = SESSION.get();
  const schoolId = session.schoolId;
  let selectedItems = {};
  let todayTransactions = [];
  let _shu2onStudentId = null;  // يتعبّى لما يجي من شئون الطلاب

  const isCardiff = schoolId === 'cardiff';

  function init() {
    document.getElementById('dateInput').value = localDateStr();
    generateReceiptNumber();
    // بناء المراحل حسب المدرسة
    const stageSelect = document.getElementById('stageSelect');
    stageSelect.innerHTML = '<option value="">اختر المرحلة</option>';
    if (isCardiff) {
      Object.entries(CARDIFF_STAGES).forEach(([key, s]) => {
        stageSelect.innerHTML += `<option value="${key}">${s.label} - ${s.labelAr}</option>`;
      });
    } else {
      stageSelect.innerHTML += `
        <option value="pre_kg">Pre-KG - ما قبل الروضة</option>
        <option value="kg">KG - الروضة</option>
        <option value="grade">Grade - الابتدائي</option>
        <option value="prep">Prep - الاعدادي</option>`;
    }
    renderPaymentItems(null);
    loadTodayTransactions();
    loadStudentSuggestions();

    // ══ تعبئة أوتوماتيك من شئون الطلاب ══
    const prefillRaw = sessionStorage.getItem('shu2on_prefill');
    if (prefillRaw) {
      try {
        const prefill = JSON.parse(prefillRaw);
        // نمسح الـ key عشان ما يتعبّيش تاني لو رجع المحاسب
        sessionStorage.removeItem('shu2on_prefill');

        // اسم الطالب
        if (prefill.studentName) {
          document.getElementById('studentName').value = prefill.studentName;
          checkStudentDebt();
        }

        // تحديد المرحلة حسب الصف
        if (prefill.grade) {
          let stageKey = null;
          if (isCardiff) {
            // Cardiff: ابحث في CARDIFF_STAGES
            for (const [key, stageData] of Object.entries(CARDIFF_STAGES)) {
              if (stageData.grades.includes(prefill.grade)) { stageKey = key; break; }
            }
          } else {
            // Bristol / Stanford
            if (prefill.grade === 'Pre-KG')                                            stageKey = 'pre_kg';
            else if (['KG1','KG2'].includes(prefill.grade))                            stageKey = 'kg';
            else if (prefill.grade.startsWith('Grade'))                                stageKey = 'grade';
            else if (prefill.grade.startsWith('Prep'))                                 stageKey = 'prep';
          }
          if (stageKey) {
            document.getElementById('stageSelect').value = stageKey;
            onStageChange();   // يبني الـ grades ويحدّث الأسعار
            // بعد onStageChange نختار الصف
            setTimeout(() => {
              const gradeEl = document.getElementById('gradeSelect');
              if (gradeEl) { gradeEl.value = prefill.grade; onGradeChange(); }
            }, 50);
          }
        }

        // إشعار بصري إن البيانات اتملت من الشئون
        const alertEl = document.getElementById('formAlert');
        alertEl.className = 'alert alert-success';
        alertEl.innerHTML = `✅ تم جلب بيانات الطالب <strong>${prefill.studentName}</strong> من شئون الطلاب — أكمل بيانات الدفع`;
        alertEl.classList.remove('hidden');
        setTimeout(() => alertEl.classList.add('hidden'), 6000);

        // حفظ الـ studentDocId بس — من غير تغيير الـ status
        if (prefill.studentDocId) {
          _shu2onStudentId = prefill.studentDocId;
        }
      } catch(e) { console.warn('prefill parse error:', e); }
    }
  }

  function getStageData(stage) {
    if (isCardiff) return CARDIFF_STAGES[stage] || null;
    return STAGES[stage] || null;
  }

  function getStagePrice(stage, item, grade) {
    if (isCardiff) {
      const stageData = CARDIFF_STAGES[stage];
      if (!stageData) return null;
      // المصروفات الدراسية لها منطق خاص — بترجع null عشان renderPaymentItems تتعامل معها منفصل
      if (item === 'مصروفات دراسية') return null;
      // أبليكيشن وفايل
      if (item === 'أبليكيشن' || item === 'فايل') {
        if (stage === 'international') return stageData.fees?.[item] || null;
        const tier = document.getElementById('paymentTierSelect')?.value || 'normal';
        return stageData.fees?.[tier]?.[item] || null;
      }
      // باقي البنود (باص، يونيفورم، امتحانات، رحلات)
      if (item === 'يونيفورم' && stageData.uniformByGrade) {
        return stageData.uniformByGrade(grade);
      }
      return stageData.otherPrices?.[item] ?? null;
    }
    return STAGES[stage]?.prices?.[item] || null;
  }

  // يرجع بيانات الأقساط للمصروفات الدراسية في Cardiff
  function getCardiffInstallments(stage, grade) {
    const stageData = CARDIFF_STAGES[stage];
    if (!stageData) return null;
    if (stage === 'international') {
      return stageData.gradeFees?.[grade] || null;
    }
    // semi_international
    const tier = document.getElementById('paymentTierSelect')?.value || 'normal';
    const gradeGroup = stageData.getGradeGroup(grade);
    const fees = stageData.gradeFees?.[tier]?.[gradeGroup];
    if (!fees) return null;
    return fees;
  }

  function onPaymentTierChange() {
    const stage = document.getElementById('stageSelect').value;
    selectedItems = {};
    renderPaymentItems(stage);
    updateSelectedSummary();
    updateDiscountFields();
  }

  function onGradeChange() {
    const stage = document.getElementById('stageSelect').value;
    // لو Cardiff: أعد رسم الأقساط بالأسعار الجديدة للصف المختار
    if (isCardiff && stage) {
      selectedItems = {};
      renderPaymentItems(stage);
      updateSelectedSummary();
      updateDiscountFields();
    }
  }

  function onStageChange() {
    const stage = document.getElementById('stageSelect').value;
    const gradeSelect = document.getElementById('gradeSelect');
    const tierGroup = document.getElementById('paymentTierGroup');
    gradeSelect.innerHTML = '<option value="">اختر الصف</option>';
    const stageData = getStageData(stage);
    if (stageData) {
      stageData.grades.forEach(g => { gradeSelect.innerHTML += `<option value="${g}">${g}</option>`; });
    }
    // Cardiff: اظهر نوع الدفعة للسيمي فقط — American Section مش محتاجاها
    if (isCardiff && stage === 'semi_international') {
      tierGroup.classList.remove('hidden');
      document.getElementById('paymentTierSelect').value = '';
    } else {
      tierGroup.classList.add('hidden');
      if (document.getElementById('paymentTierSelect')) document.getElementById('paymentTierSelect').value = '';
    }
    const indicator = document.getElementById('stageIndicator');
    if (stage && stageData) {
      indicator.style.display = 'inline-flex';
      document.getElementById('stageIndicatorText').textContent = stageData.labelAr;
    } else { indicator.style.display = 'none'; }
    selectedItems = {};
    renderPaymentItems(stage);
    updateSelectedSummary();
    updateDiscountFields();
  }

  function renderPaymentItems(stage) {
    const grid = document.getElementById("paymentItemsGrid");
    grid.innerHTML = "";
    const grade = document.getElementById('gradeSelect')?.value || '';

    // Cardiff: المصروفات الدراسية تتعرض كأقساط منفصلة
    if (isCardiff && stage) {
      const instData = grade ? getCardiffInstallments(stage, grade) : null;
      const numInst  = CARDIFF_STAGES[stage]?.installments || 2;
      const instLabels = numInst === 3
        ? ['مصروفات - قسط 1', 'مصروفات - قسط 2', 'مصروفات - قسط 3']
        : ['مصروفات - قسط 1', 'مصروفات - قسط 2'];
      const instKeys = numInst === 3
        ? ['inst1', 'inst2', 'inst3']
        : ['inst1', 'inst2'];

      instLabels.forEach((label, idx) => {
        const instKey  = instKeys[idx];
        const instPrice = instData ? (instData[instKey] || 0) : 0;
        const isSelected = !!selectedItems[label];
        const cardEl = document.createElement('div');
        cardEl.className = 'payment-item-card ' + (isSelected ? 'selected' : '');
        cardEl.onclick = () => toggleInstallment(label, instPrice, instData?.total || 0);
        let html = `<div class="item-check">${isSelected ? '&#10003;' : ''}</div>`;
        html += `<div class="item-name">${label}</div>`;
        html += instData
          ? `<div class="item-price">${formatCurrency(instPrice)}</div>`
          : `<div class="item-price text-muted">اختر الصف أولا</div>`;
        cardEl.innerHTML = html;
        grid.appendChild(cardEl);
      });

      // باقي البنود (بدون مصروفات دراسية)
      const otherItems = ['باص', 'يونيفورم', 'فايل', 'أبليكيشن', 'رحلات', 'امتحانات', 'سمر كورس'];
      otherItems.forEach(item => {
        const price = getStagePrice(stage, item, grade);
        const isSelected = !!selectedItems[item];
        const isVariable = selectedItems[item]?.variable || false;
        const customPrice = selectedItems[item]?.customPrice || '';
        const forceVariable = (item === 'رحلات' || item === 'سمر كورس');
        const cardEl = document.createElement('div');
        cardEl.className = 'payment-item-card ' + (isSelected ? 'selected' : '');
        cardEl.onclick = () => togglePaymentItem(item, price || 0);
        let html = `<div class="item-check">${isSelected ? '&#10003;' : ''}</div><div class="item-name">${item}</div>`;
        if (forceVariable) html += `<div class="item-price text-muted">سعر متغير</div>`;
        else html += price ? `<div class="item-price">${formatCurrency(price)}</div>` : `<div class="item-price text-muted">اختر المرحلة أولا</div>`;
        if (isSelected && !forceVariable) html += `<div onclick="event.stopPropagation()" style="margin-top:6px;display:flex;align-items:center;gap:6px;font-size:0.75rem"><input type="checkbox" id="var_${item}" ${isVariable ? 'checked' : ''} onchange="toggleVariablePrice('${item}', this.checked)"/><label for="var_${item}" style="cursor:pointer;color:var(--text-light)">سعر متغير</label></div>`;
        if (isSelected && (isVariable || forceVariable)) html += `<div onclick="event.stopPropagation()" style="margin-top:6px"><input type="number" class="form-input" style="font-size:0.8rem;padding:0.3rem 0.5rem;height:auto" placeholder="ادخل السعر" min="0" value="${customPrice}" oninput="setCustomPrice('${item}', this.value)"/></div>`;
        cardEl.innerHTML = html;
        grid.appendChild(cardEl);
      });
      return;
    }

    // باقي المدارس (عادي)
    PAYMENT_ITEMS.forEach(item => {
      const price = stage ? getStagePrice(stage, item) : null;
      const isSelected = !!selectedItems[item];
      const isVariable = selectedItems[item]?.variable || false;
      const customPrice = selectedItems[item]?.customPrice || "";
      const isFree = selectedItems[item]?.free || false;
      const forceVariable = (item === "رحلات" || item === "إيرادات أخرى");
      const isApp = (item === "أبليكيشن");
      const cardEl = document.createElement("div");
      cardEl.className = "payment-item-card " + (isSelected ? "selected" : "");
      cardEl.onclick = () => togglePaymentItem(item, price || 0);
      let html = `<div class="item-check">${isSelected ? "&#10003;" : ""}</div><div class="item-name">${item}</div>`;
      if (forceVariable) html += `<div class="item-price text-muted">سعر متغير</div>`;
      else if (isApp && isSelected && isFree) html += `<div class="item-price" style="color:var(--success,#27ae60)">مجاني</div>`;
      else html += price ? `<div class="item-price">${formatCurrency(price)}</div>` : `<div class="item-price text-muted">اختر المرحلة اولا</div>`;
      if (isSelected && isApp) html += `<div onclick="event.stopPropagation()" style="margin-top:6px;display:flex;align-items:center;gap:6px;font-size:0.75rem"><input type="checkbox" id="free_${item}" ${isFree ? "checked" : ""} onchange="toggleFreeItem('${item}', this.checked)"/><label for="free_${item}" style="cursor:pointer;color:var(--text-light)">مجاني</label></div>`;
      if (isSelected && !forceVariable && !isApp) html += `<div onclick="event.stopPropagation()" style="margin-top:6px;display:flex;align-items:center;gap:6px;font-size:0.75rem"><input type="checkbox" id="var_${item}" ${isVariable ? "checked" : ""} onchange="toggleVariablePrice('${item}', this.checked)"/><label for="var_${item}" style="cursor:pointer;color:var(--text-light)">سعر متغير</label></div>`;
      if (isSelected && (isVariable || forceVariable)) html += `<div onclick="event.stopPropagation()" style="margin-top:6px"><input type="number" class="form-input" style="font-size:0.8rem;padding:0.3rem 0.5rem;height:auto" placeholder="ادخل السعر" min="0" value="${customPrice}" oninput="setCustomPrice('${item}', this.value)"/></div>`;
      cardEl.innerHTML = html;
      grid.appendChild(cardEl);
    });
  }

  // Cardiff: toggle قسط المصروفات الدراسية
  const FULL_FEES_ITEM = 'مصروفات دراسية';
  const INSTALLMENT_ITEMS = ['مصروفات - قسط 1', 'مصروفات - قسط 2'];

  function clearConflictingFeeItems(item) {
    if (item === FULL_FEES_ITEM) {
      INSTALLMENT_ITEMS.forEach(i => delete selectedItems[i]);
    } else if (INSTALLMENT_ITEMS.includes(item)) {
      delete selectedItems[FULL_FEES_ITEM];
    }
  }

  function toggleInstallment(label, instPrice, totalFees) {
    const stage = document.getElementById('stageSelect').value;
    const grade = document.getElementById('gradeSelect').value;
    if (!stage) { showAlert('من فضلك اختر المرحلة اولا'); return; }
    if (!grade) { showAlert('من فضلك اختر الصف أولا'); return; }
    if (stage === 'semi_international' && !document.getElementById('paymentTierSelect').value) {
      showAlert('من فضلك اختر نوع الدفعة أولا'); return;
    }
    if (selectedItems[label]) { delete selectedItems[label]; }
    else {
      clearConflictingFeeItems(label);
      delete selectedItems[FULL_FEES_ITEM];
      selectedItems[label] = { price: instPrice, discount: 0, totalFees, isInstallment: true };
    }
    renderPaymentItems(stage);
    updateSelectedSummary();
    updateDiscountFields();
    calcDebt();
  }

  function togglePaymentItem(item, price) {
    const stage = document.getElementById('stageSelect').value;
    if (!stage) { showAlert('من فضلك اختر المرحلة اولا'); return; }
    if (isCardiff && stage === 'semi_international' && !document.getElementById('paymentTierSelect').value) {
      showAlert('من فضلك اختر نوع الدفعة اولا'); return;
    }
    if (selectedItems[item]) { delete selectedItems[item]; }
    else {
      clearConflictingFeeItems(item);
      selectedItems[item] = { price: price||0, discount: 0 };
    }
    renderPaymentItems(stage);
    updateSelectedSummary();
    updateDiscountFields();
    calcDebt();
  }

  function toggleFreeItem(item, isFree) {
    if (!selectedItems[item]) return;
    const stage = document.getElementById('stageSelect').value;
    selectedItems[item].free = isFree;
    selectedItems[item].price = isFree ? 0 : (getStagePrice(stage, item) || 0);
    selectedItems[item].customPrice = '';
    renderPaymentItems(stage);
    updateSelectedSummary();
    calcDebt();
  }

  function toggleVariablePrice(item, isVariable) {
    if (!selectedItems[item]) return;
    const stage = document.getElementById('stageSelect').value;
    selectedItems[item].variable = isVariable;
    if (isVariable) {
      selectedItems[item].customPrice = '';
      selectedItems[item].price = 0;
    } else {
      selectedItems[item].price = getStagePrice(stage, item) || 0;
      selectedItems[item].customPrice = '';
    }
    renderPaymentItems(stage);
    updateSelectedSummary();
    calcDebt();
  }

  function setCustomPrice(item, val) {
    if (!selectedItems[item]) return;
    selectedItems[item].customPrice = val;
    selectedItems[item].price = parseFloat(val) || 0;
    updateSelectedSummary();
    calcDebt();
  }

  function updateSelectedSummary() {
    const summary = document.getElementById('selectedSummary');
    const list = document.getElementById('selectedItemsList');
    const badge = document.getElementById('selectedCountBadge');
    const keys = Object.keys(selectedItems);
    if (keys.length === 0) { summary.classList.remove('show'); badge.style.display='none'; return; }
    summary.classList.add('show');
    badge.style.display = 'inline';
    badge.textContent = keys.length + ' بنود';
    let total = 0;
    list.innerHTML = keys.map(item => {
      const price = selectedItems[item].price;
      total += price;
      return `<div class="selected-item-row"><span>${item}</span><span style="font-weight:700;color:var(--primary)">${formatCurrency(price)}</span></div>`;
    }).join('');
    document.getElementById('suggestedTotal').textContent = formatCurrency(total);
    const amountInput = document.getElementById('amountInput');
    amountInput.value = total; calcDebt();
  }

  function updateDiscountFields() {
    const section = document.getElementById('discountSection');
    const container = document.getElementById('discountFields');
    const keys = Object.keys(selectedItems);
    if (keys.length === 0) { section.style.display='none'; return; }
    section.style.display = 'block';
    container.innerHTML = keys.map(item => `
      <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem">
        <span style="flex:1;font-size:0.85rem;font-weight:600">${item}</span>
        <input type="number" class="form-input" style="width:80px;text-align:center"
          placeholder="0" min="0" max="100" step="0.5"
          id="disc_${item.replace(/\s/g,'_')}"
          oninput="updateItemDiscount('${item}',this.value);calcDebt();"
          value="${selectedItems[item].discount||''}" />
        <span style="font-size:0.8rem;color:var(--text-light)">%</span>
        <span id="discval_${item.replace(/\s/g,'_')}" class="discount-result"></span>
      </div>`).join('');
    updateDiscountPreviews();
  }

  function updateItemDiscount(item, value) {
    if (selectedItems[item]) selectedItems[item].discount = parseFloat(value)||0;
    updateDiscountPreviews();
  }

  function updateDiscountPreviews() {
    Object.keys(selectedItems).forEach(item => {
      const disc = selectedItems[item].discount||0;
      const price = selectedItems[item].price;
      const el = document.getElementById('discval_'+item.replace(/\s/g,'_'));
      if (el && disc > 0) { el.textContent = '- ' + formatCurrency(price*disc/100); }
      else if (el) { el.textContent = ''; }
    });
  }

  function getTotalAfterDiscount() {
    return Object.values(selectedItems).reduce((sum,v) => sum + v.price*(1-(v.discount||0)/100), 0);
  }

  function calcDebt() {
    const totalDue = getTotalAfterDiscount();
    const paid = parseFloat(document.getElementById('amountInput').value)||0;
    const debtPreview = document.getElementById('debtPreview');
    const summaryBox = document.getElementById('paymentSummaryBox');
    const summaryContent = document.getElementById('paymentSummaryContent');
    if (Object.keys(selectedItems).length === 0) { debtPreview.style.display='none'; summaryBox.style.display='none'; return; }
    const debt = totalDue - paid;
    summaryBox.style.display = 'block';
    let rows = Object.entries(selectedItems).map(([item,v]) => {
      const disc = v.discount>0?` (خصم ${v.discount}%)`:'';
      const net = v.price*(1-(v.discount||0)/100);
      return `<div class="payment-summary-row"><span>${item}${disc}</span><span>${formatCurrency(net)}</span></div>`;
    }).join('');
    summaryContent.innerHTML = rows + `
      <div class="payment-summary-row" style="color:var(--text-light)"><span>الاجمالي بعد الخصومات</span><span>${formatCurrency(totalDue)}</span></div>
      <div class="payment-summary-row"><span>المدفوع</span><span style="color:#27ae60;font-weight:700">${formatCurrency(paid)}</span></div>
      ${debt>0?`<div class="payment-summary-total"><span>المديونية</span><span style="color:#c0392b">${formatCurrency(debt)}</span></div>`:
       debt<0?`<div class="payment-summary-total"><span>زيادة مدفوعة</span><span style="color:#27ae60">${formatCurrency(Math.abs(debt))}</span></div>`:
       `<div class="payment-summary-total"><span>تم الدفع بالكامل</span><span style="color:#27ae60">مكتمل</span></div>`}`;
    if (debt>0&&paid>0) { debtPreview.style.display='block'; debtPreview.innerHTML=`<span class="debt-badge">مديونية: ${formatCurrency(debt)}</span>`; }
    else { debtPreview.style.display='none'; }
  }

  function generateReceiptNumber() {
    const now = new Date();
    const y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0'), d=String(now.getDate()).padStart(2,'0');
    document.getElementById('receiptNumber').value = `REC-${y}${m}${d}-${String(Math.floor(Math.random()*9000)+1000)}`;
  }

  function showAlert(msg, type='error') {
    const el = document.getElementById('formAlert');
    el.className = `alert alert-${type}`;
    el.textContent = msg;
    el.classList.remove('hidden');
    setTimeout(()=>el.classList.add('hidden'),5000);
    el.scrollIntoView({behavior:'smooth',block:'center'});
  }

  async function saveTransaction() {
    const studentName = document.getElementById('studentName').value.trim();
    const stage = document.getElementById('stageSelect').value;
    const grade = document.getElementById('gradeSelect').value;
    const amount = parseFloat(document.getElementById('amountInput').value) || 0;
    const paymentType = document.getElementById('paymentType').value;
    const receiptNumber = document.getElementById('receiptNumber').value.trim();
    const date = document.getElementById('dateInput').value;
    const notes = document.getElementById('notes').value.trim();
    if (!studentName) return showAlert('من فضلك ادخل اسم الطالب');
    if (!stage) return showAlert('من فضلك اختر المرحلة');
    if (isCardiff && stage === 'semi_international' && !document.getElementById('paymentTierSelect').value) return showAlert('من فضلك اختر نوع الدفعة');
    if (!grade) return showAlert('من فضلك اختر الصف');
    if (Object.keys(selectedItems).length===0) return showAlert('من فضلك اختر بند الدفع');
    const allFree = Object.values(selectedItems).every(v => (v.price || 0) === 0);
    if (!allFree && (!amount||amount<=0)) return showAlert('من فضلك ادخل مبلغ صحيح');
    if (!paymentType) return showAlert('من فضلك اختر طريقة الدفع');
    if (!receiptNumber) return showAlert('من فضلك ادخل رقم الايصال');
    if (!date) return showAlert('من فضلك اختر التاريخ');
    const totalDue = getTotalAfterDiscount();
    if (amount > totalDue + 0.001) {
      return showAlert('المبلغ المدفوع أكبر من المستحق. عدّل المبلغ أو البنود — لا يُسمح بتسجيل زيادة.');
    }
    const btn = document.getElementById('saveBtn');
    btn.disabled=true; btn.textContent='جاري الحفظ...';
    try {
      const school = SESSION.getSchool();
      const debt = Math.max(0, totalDue - amount);
      const itemsList = Object.entries(selectedItems).map(([item,v])=>({item,price:v.price,discount:v.discount||0,netPrice:v.price*(1-(v.discount||0)/100)}));
      const paymentItem = itemsList.map(i=>i.item).join(' + ');
      const stageName = isCardiff ? (CARDIFF_STAGES[stage]?.labelAr || stage) : (STAGES[stage]?.labelAr || stage);
      const paymentTier = isCardiff ? (stage === 'semi_international' ? document.getElementById('paymentTierSelect').value : null) : null;
      const paymentTierName = isCardiff ? (stage === 'semi_international' ? (document.getElementById('paymentTierSelect').options[document.getElementById('paymentTierSelect').selectedIndex]?.text || '') : null) : null;

      // استعلام الدين قبل الـ transaction (الاستعلامات غير مسموحة داخل runTransaction)
      let existingDebtId = null;
      if (debt > 0) {
        const existingDebtSnap = await db.collection('debts')
          .where('schoolId', '==', schoolId)
          .where('studentName', '==', studentName)
          .where('paymentItem', '==', paymentItem)
          .get();
        const openDebts = existingDebtSnap.docs.filter(d => (d.data().remaining || 0) > 0);
        if (openDebts.length > 0) existingDebtId = openDebts[0].id;
      }

      const txRef = db.collection('transactions').doc();
      let debtDocId = existingDebtId;

      await db.runTransaction(async (t) => {
        let prevData = null;
        if (debt > 0 && existingDebtId) {
          const debtRef = db.collection('debts').doc(existingDebtId);
          const debtSnap = await t.get(debtRef);
          if (debtSnap.exists) prevData = debtSnap.data();
          else existingDebtId = null;
        }

        if (debt > 0) {
          if (existingDebtId && prevData) {
            const debtRef = db.collection('debts').doc(existingDebtId);
            t.update(debtRef, {
              totalDue:  (prevData.totalDue  || 0) + totalDue,
              paid:      (prevData.paid      || 0) + amount,
              remaining: (prevData.remaining || 0) + debt,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            debtDocId = existingDebtId;
          } else {
            const debtRef = db.collection('debts').doc();
            debtDocId = debtRef.id;
            t.set(debtRef, {
              schoolId, studentName, stage, grade,
              stageName, paymentItem,
              paymentTier: paymentTier || null,
              paymentTierName: paymentTierName || null,
              totalDue, paid: amount, remaining: debt,
              transactionId: txRef.id, date,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              academicYear: getAcademicYear(date)
            });
          }
        }

        const transaction = {
          schoolId, schoolName:school.name, studentName, stage, stageName,
          paymentTier, paymentTierName, grade,
          paymentItems: itemsList, paymentItem,
          totalDue, amount, debt, hasDebt: debt > 0,
          paymentType, paymentTypeName:PAYMENT_TYPES.find(p=>p.value===paymentType)?.label||paymentType,
          receiptNumber, date, notes, createdBy:session.email,
          createdAt:firebase.firestore.FieldValue.serverTimestamp(),
          year:new Date(date).getFullYear(), month:new Date(date).getMonth()+1, week:getWeekNumber(new Date(date)),
          academicYear: getAcademicYear(date),
          ...(debtDocId ? { debtId: debtDocId } : {}),
          ...(_shu2onStudentId ? { shu2onStudentId: _shu2onStudentId } : {})
        };
        t.set(txRef, transaction);
      });

      showAlert('تم حفظ التحصيل بنجاح!'+(debt>0?` - مديونية: ${formatCurrency(debt)}`:''), 'success');
      loadTodayTransactions();

      // إشعار فوري للأدمن (Firestore + Web Push)
      if (typeof notifyAdminsOfPayment === 'function') {
        notifyAdminsOfPayment({
          schoolId,
          schoolName: school.name,
          studentName,
          amount,
          paymentItem,
          createdBy: session.email
        }).catch(() => {});
      }

      if (_shu2onStudentId) {
        db.collection('studentAffairs').doc(_shu2onStudentId).update({
          status: 'active',
          collectedBy: session.email,
          collectedAt: firebase.firestore.FieldValue.serverTimestamp(),
          transactionId: txRef.id
        }).catch(e => console.warn('shu2on collected update failed:', e));
      }
      document.getElementById('studentName').value='';
      document.getElementById('amountInput').value='';
      document.getElementById('notes').value='';
      document.getElementById('paymentType').value='';
      document.getElementById('debtIndicator').style.display='none';
      document.getElementById('debtPreview').style.display='none';
      document.getElementById('paymentSummaryBox').style.display='none';
      selectedItems={};
      renderPaymentItems(document.getElementById('stageSelect').value);
      updateSelectedSummary(); updateDiscountFields(); generateReceiptNumber();
    } catch(err) { console.error(err); showAlert('حدث خطا: '+err.message); }
    finally { btn.disabled=false; btn.innerHTML='حفظ التحصيل'; }
  }

  async function checkStudentDebt() {
    const name = document.getElementById('studentName').value.trim();
    const indicator = document.getElementById('debtIndicator');
    if (!name||name.length<3) { indicator.style.display='none'; return; }
    try {
      const snap = await db.collection('debts').where('schoolId','==',schoolId).where('studentName','==',name).where('remaining','>',0).get();
      if (!snap.empty) {
        let totalDebt=0; let items=[];
        snap.forEach(doc=>{const d=doc.data();totalDebt+=d.remaining||0;items.push(d.paymentItem);});
        indicator.style.display='block';
        indicator.innerHTML=`<span class="debt-badge">لدى هذا الطالب مديونية: ${formatCurrency(totalDebt)} (${escapeHtml(items.join(', '))})</span>`;
      } else { indicator.style.display='none'; }
    } catch(e) {
      console.error('checkStudentDebt', e);
      indicator.style.display='none';
    }
  }

  async function deleteTransaction(id){
    if (!confirm('هل تريد حذف هذه العملية؟')) return;
    try {
      // جيب بيانات الـ transaction الأول قبل الحذف
      const txSnap = await db.collection('transactions').doc(id).get();
      if (txSnap.exists) {
        const tx = txSnap.data();
        const txDebt = tx.debt || 0;
        // لو فيها مديونية، اعكس تأثيرها على debts collection
        if (txDebt > 0) {
          // استخدم debtId المخزّن مباشرة لو موجود، وإلا ارجع للبحث القديم
          let debtDocRef = null;
          if (tx.debtId) {
            debtDocRef = db.collection('debts').doc(tx.debtId);
            const debtDocSnap = await debtDocRef.get();
            if (!debtDocSnap.exists) debtDocRef = null;
          }
          if (!debtDocRef) {
            const debtSnap = await db.collection('debts')
              .where('schoolId',    '==', schoolId)
              .where('studentName', '==', tx.studentName)
              .where('paymentItem', '==', tx.paymentItem)
              .get();
            const openDebts = debtSnap.docs.filter(d => (d.data().remaining || 0) > 0);
            if (openDebts.length > 0) debtDocRef = db.collection('debts').doc(openDebts[0].id);
          }
          if (debtDocRef) {
            const debtDocSnap = await debtDocRef.get();
            if (debtDocSnap.exists) {
              const debtData = debtDocSnap.data();
              const newTotalDue  = Math.max(0, (debtData.totalDue  || 0) - (tx.totalDue || 0));
              const newPaid      = Math.max(0, (debtData.paid      || 0) - (tx.amount || 0));
              const newRemaining = Math.max(0, (debtData.remaining || 0) - txDebt);
              // اتساق: المتبقي لا يتجاوز المستحق بعد التصحيح
              const remaining = Math.min(newRemaining, Math.max(0, newTotalDue - newPaid));
              if (remaining <= 0 && newPaid <= 0 && newTotalDue <= 0) {
                await debtDocRef.delete();
              } else {
                await debtDocRef.update({
                  totalDue:   newTotalDue,
                  remaining:  remaining,
                  paid:       newPaid,
                  updatedAt:  firebase.firestore.FieldValue.serverTimestamp()
                });
              }
            }
          }
        } else if (tx.debtId || (tx.totalDue > 0 && tx.amount > 0)) {
          // معاملة بدون مديونية متبقية لكن مرتبطة بدين — اعكس paid/totalDue إن وُجد الدين
          let debtDocRef = tx.debtId ? db.collection('debts').doc(tx.debtId) : null;
          if (debtDocRef) {
            const debtDocSnap = await debtDocRef.get();
            if (debtDocSnap.exists) {
              const debtData = debtDocSnap.data();
              const newTotalDue = Math.max(0, (debtData.totalDue || 0) - (tx.totalDue || 0));
              const newPaid = Math.max(0, (debtData.paid || 0) - (tx.amount || 0));
              const remaining = Math.max(0, newTotalDue - newPaid);
              if (remaining <= 0 && newPaid <= 0 && newTotalDue <= 0) {
                await debtDocRef.delete();
              } else {
                await debtDocRef.update({
                  totalDue: newTotalDue,
                  paid: newPaid,
                  remaining,
                  updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
              }
            }
          }
        }
      }
      await db.collection('transactions').doc(id).delete();
      showAlert('تم الحذف', 'success');
      loadTodayTransactions();
    } catch(err) {
      showAlert('خطأ في الحذف: ' + err.message);
    }
  }

  async function loadStudentSuggestions(){
    // ── Cache في sessionStorage — مش بنعمل query كل ما حد يفتح الصفحة ──
    const NAMES_KEY = `student_names_${schoolId}`;
    const NAMES_TTL = 30 * 60 * 1000; // 30 دقيقة
    try {
      // جرب الـ cache الأول
      const raw = sessionStorage.getItem(NAMES_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (Date.now() - obj.ts < NAMES_TTL) {
          document.getElementById('studentSuggestions').innerHTML =
            obj.names.map(n => `<option value="${escapeHtml(n)}">`).join('');
          return; // ✅ صفر reads
        }
      }
      // جيب من بداية السنة الدراسية الحالية — مش 3 أشهر
      const snap = await db.collection('transactions')
        .where('schoolId', '==', schoolId)
        .where('date', '>=', ACADEMIC_YEAR_START)
        .get();
      const names = new Set();
      snap.forEach(doc => { if (doc.data().studentName) names.add(doc.data().studentName); });
      const namesArr = [...names].sort();
      // احفظ في cache
      sessionStorage.setItem(NAMES_KEY, JSON.stringify({ names: namesArr, ts: Date.now() }));
      document.getElementById('studentSuggestions').innerHTML =
        namesArr.map(n => `<option value="${escapeHtml(n)}">`).join('');
    } catch(e) {
      console.error('loadStudentSuggestions', e);
    }
  }

  function getWeekNumber(d) {
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  }

  let editingDocId = null;

  async function openEditModal(id) {
    const doc = await db.collection('transactions').doc(id).get();
    if (!doc.exists) return showAlert('لم يتم العثور على السجل');
    const d = doc.data();
    editingDocId = id;

  async function saveEdit() {
    if (!editingDocId) return;
    const studentName = document.getElementById('editStudentName').value.trim();
    const grade       = document.getElementById('editGrade').value.trim();
    const amount      = parseFloat(document.getElementById('editAmount').value);
    const date        = document.getElementById('editDate').value;
    const paymentType = document.getElementById('editPaymentType').value;
    const paymentItem = document.getElementById('editPaymentItem').value.trim();
    const notes       = document.getElementById('editNotes').value.trim();
    const receiptNumber = document.getElementById('editReceiptNumber').value.trim();

    if (!studentName) return showAlert('ادخل اسم الطالب');
    if (!amount || amount <= 0) return showAlert('ادخل مبلغ صحيح');
    if (!date) return showAlert('اختر التاريخ');
    if (!paymentType) return showAlert('اختر طريقة الدفع');

    const btn = document.getElementById('editSaveBtn');
    btn.disabled = true; btn.textContent = 'جاري الحفظ...';

    try {
      // جيب الـ transaction الأصلية عشان نعرف totalDue والـ debt القديم
      const origSnap = await db.collection('transactions').doc(editingDocId).get();
      const orig = origSnap.data();
      const totalDue   = orig.totalDue || orig.amount || amount;
      const oldDebt    = orig.debt || 0;
      const newDebt    = Math.max(0, totalDue - amount);

      await db.collection('transactions').doc(editingDocId).update({
        studentName, grade, amount, date, paymentType,
        paymentTypeName: PAYMENT_TYPES.find(p => p.value === paymentType)?.label || paymentType,
        paymentItem, notes, receiptNumber,
        debt: newDebt,
        hasDebt: newDebt > 0,
        editedBy: session.email,
        editedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      // ===== مزامنة debts collection =====
      const debtSnap = await db.collection('debts')
        .where('schoolId',    '==', schoolId)
        .where('studentName', '==', studentName)
        .where('paymentItem', '==', paymentItem)
        .get();
      const openDebts = debtSnap.docs.filter(d => (d.data().remaining || 0) > 0);

      if (newDebt > 0) {
        const diff = newDebt - oldDebt; // الفرق عن الحالة القديمة
        if (openDebts.length > 0) {
          const debtDoc  = openDebts[0];
          const debtData = debtDoc.data();
          await db.collection('debts').doc(debtDoc.id).update({
            remaining: Math.max(0, (debtData.remaining || 0) + diff),
            paid:      Math.max(0, (debtData.paid      || 0) - diff),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          // debt جديد
          await db.collection('debts').add({
            schoolId, studentName, grade,
            stage:     orig.stage     || '',
            stageName: orig.stageName || '',
            paymentItem,
            totalDue, paid: amount, remaining: newDebt,
            date, hasDebt: true,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            academicYear: getAcademicYear(date)
          });
        }
      } else if (oldDebt > 0 && newDebt === 0) {
        // كان في debt وبقى مسدد — صفّر
        if (openDebts.length > 0) {
          const debtDoc  = openDebts[0];
          const debtData = debtDoc.data();
          await db.collection('debts').doc(debtDoc.id).update({
            remaining: 0,
            paid: debtData.totalDue || totalDue,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      }
      // ===== نهاية المزامنة =====

      showAlert('تم التعديل بنجاح ✓', 'success');
      closeEditModal();
      loadTodayTransactions();
    } catch (err) {
      showAlert('خطأ في التعديل: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'حفظ التعديلات';
    }
  }
